<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="robots" content="noindex,follow">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1744436882685241"
     crossorigin="anonymous"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title id="pgtitle">スタディスポットMAP — 無料で勉強できる場所をみんなでランク付け</title>
<meta id="pgdesc" name="description" content="栃木県内の図書館・公民館・カフェなど、無料で勉強できる場所を地図でランク付け。静音性・電源・Wi-Fiなど8軸で評価し、時間帯ごとの空き状況もわかります。">
<link id="pgcanon" rel="canonical" href="https://kaitoinoue0921.github.io/study-map/">
<meta id="pgogtitle" property="og:title" content="スタディスポットMAP — 無料で勉強できる場所をみんなでランク付け">
<meta id="pgogdesc" property="og:description" content="栃木県内の図書館・公民館・カフェなど、無料で勉強できる場所を地図でランク付け。静音性・電源・Wi-Fiなど8軸で評価し、時間帯ごとの空き状況もわかります。">
<meta property="og:type" content="website">
<meta id="pgogurl" property="og:url" content="https://kaitoinoue0921.github.io/study-map/">
<meta property="og:image" content="https://kaitoinoue0921.github.io/ogp.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --bg:#0f1214; --panel:#171b1f; --panel2:#1e242a; --line:#2b333b;
  --tx:#e8edf2; --tx2:#9aa7b4; --tx3:#8a97a4;
  --accent:#3fbf8f;
  --s:#f0b429; --a:#3fbf8f; --b:#4d9de0; --c:#7c8894; --un:#414c56; --blocked:#000;
  --ok:#3fbf8f; --mid:#e0a33e; --busy:#d9534f;
  --shadow:0 8px 28px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  background:var(--bg); color:var(--tx); overflow:hidden; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}

/* ---------- top bar ---------- */
#top{
  height:58px;display:flex;align-items:center;gap:14px;padding:0 16px;
  background:var(--panel);border-bottom:1px solid var(--line);position:relative;z-index:900
}
.brand{display:flex;align-items:center;gap:9px;flex:0 0 auto}
.logo{
  width:30px;height:30px;border-radius:9px;flex:0 0 30px;
  background:linear-gradient(135deg,var(--accent),#2b8f6c);display:grid;place-items:center;font-size:16px
}
#top h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.02em;white-space:nowrap}
#top .tag{font-size:10.5px;color:var(--tx3);margin-top:2px;white-space:nowrap}
.region{display:flex;align-items:center;gap:7px;margin-left:6px}
.region .sep{color:var(--tx3);font-size:12px}
.region select{
  background:var(--panel2);border:1px solid var(--line);border-radius:9px;
  padding:8px 10px;font-size:13px;outline:none;min-width:118px
}
.region select:focus{border-color:var(--accent)}
.region select#pref{font-weight:700}
.searchwrap{flex:1;max-width:300px;position:relative}
#topsearch{
  width:100%;background:var(--panel2);border:1px solid var(--line);
  border-radius:9px;padding:8px 11px;font-size:13px;outline:none
}
#topsearch:focus{border-color:var(--accent)}
#searchsuggest{
  position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:950;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  box-shadow:var(--shadow);overflow:hidden;max-height:360px;overflow-y:auto
}
.sgitem{
  display:flex;align-items:center;gap:9px;width:100%;padding:9px 11px;
  background:none;border:none;border-bottom:1px solid var(--line);cursor:pointer;text-align:left
}
.sgitem:last-child{border-bottom:none}
.sgitem:hover,.sgitem.on{background:var(--panel2)}
.sgbadge{
  flex:0 0 24px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;
  font-size:10.5px;font-weight:800;color:#0f1214;background:var(--un)
}
.sgbadge.S{background:var(--s)} .sgbadge.A{background:var(--a)}
.sgbadge.B{background:var(--b)} .sgbadge.C{background:var(--c)}
.sgbadge.un{background:var(--un);color:#c3ccd5}
.sgbadge.Z{background:var(--blocked);border:1px solid var(--busy);color:#fff}
.sgtext{min-width:0;flex:1}
.sgtext b{display:block;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sgtext small{color:var(--tx3);font-size:10.5px}
#topcount{margin-left:auto;font-size:11.5px;color:var(--tx3);white-space:nowrap}
#dbstat{font-size:10.5px;padding:4px 9px;border-radius:999px;white-space:nowrap;
  border:1px solid var(--line);background:var(--panel2);color:var(--tx3);cursor:pointer}
#dbstat.cloud{border-color:var(--accent);color:var(--accent);background:rgba(63,191,143,.12)}
#topsupport{font-size:10.5px;padding:4px 9px;border-radius:999px;white-space:nowrap;
  border:1px solid var(--line);background:var(--panel2);color:var(--tx2);cursor:pointer;font-family:inherit}
#topsupport:hover{border-color:var(--accent);color:var(--accent)}
#topabout{font-size:10.5px;padding:4px 9px;border-radius:999px;white-space:nowrap;
  border:1px solid var(--line);background:var(--panel2);color:var(--tx2);cursor:pointer;font-family:inherit}
#topabout:hover{border-color:var(--accent);color:var(--accent)}
#topthanks{font-size:10.5px;padding:4px 9px;border-radius:999px;white-space:nowrap;
  border:1px solid var(--line);background:var(--panel2);color:var(--tx2);cursor:pointer;font-family:inherit}
#topthanks:hover{border-color:var(--accent);color:var(--accent)}

/* ---------- layout ---------- */
#app{display:flex;height:calc(100vh - 58px);height:calc(100dvh - 58px)}
#side{
  width:400px;flex:0 0 400px;background:var(--panel);
  border-right:1px solid var(--line);display:flex;flex-direction:column;position:relative;z-index:500;
  min-height:0   /* これが無いと中身の高さで膨らみ、#list が内部スクロールしなくなる */
}
#mapwrap{flex:1;position:relative}
#map{position:absolute;inset:0;background:#20262c}

/* ---------- filters ---------- */
.controls{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:9px}
.rankfilter{display:flex;gap:6px}
.rankfilter button{
  flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:8px;
  padding:6px 0;font-size:12.5px;font-weight:700;color:var(--tx2);transition:.12s
}
.rankfilter button[data-on="1"]{color:#0f1214}
.rankfilter button[data-r="S"][data-on="1"]{background:var(--s);border-color:var(--s)}
.rankfilter button[data-r="A"][data-on="1"]{background:var(--a);border-color:var(--a)}
.rankfilter button[data-r="B"][data-on="1"]{background:var(--b);border-color:var(--b)}
.rankfilter button[data-r="C"][data-on="1"]{background:var(--c);border-color:var(--c)}
.rankfilter button[data-r="?"][data-on="1"]{background:var(--un);border-color:var(--un);color:var(--tx)}
.rankfilter button[data-r="Z"][data-on="1"]{background:var(--blocked);border-color:var(--busy);color:#fff}
.row{display:flex;gap:6px}
.row select{
  flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:8px;
  padding:7px 8px;font-size:12.5px;outline:none
}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{
  background:var(--panel2);border:1px solid var(--line);border-radius:999px;
  padding:4px 9px;font-size:11px;color:var(--tx2)
}
.chip[data-on="1"]{background:rgba(63,191,143,.16);border-color:var(--accent);color:var(--accent)}
.chip.now[data-on="1"]{background:rgba(240,180,41,.16);border-color:var(--s);color:var(--s)}

/* ---------- list ---------- */
#listhead{padding:10px 16px 6px;display:flex;justify-content:space-between;align-items:baseline}
#listhead span{font-size:11.5px;color:var(--tx3)}
#list{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 10px 14px}
.card{display:flex;gap:11px;padding:11px;border-radius:11px;cursor:pointer;border:1px solid transparent;transition:.12s}
.card:hover{background:var(--panel2)}
.card.sel{background:var(--panel2);border-color:var(--accent)}
.badge{width:38px;height:38px;flex:0 0 38px;border-radius:10px;display:grid;place-items:center;
  font-weight:800;font-size:17px;color:#0f1214;font-family:Georgia,serif}
.badge.S{background:var(--s)} .badge.A{background:var(--a)}
.badge.B{background:var(--b)} .badge.C{background:var(--c)}
.badge.un{background:transparent;border:1px dashed var(--line);color:var(--tx3);font-size:10px;font-family:inherit;font-weight:600;letter-spacing:.02em;line-height:1.3}
.badge.Z{background:var(--blocked);border:1px solid var(--busy);color:#fff}
.cbody{min-width:0;flex:1}
.cname{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmeta{font-size:11px;color:var(--tx3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cscore{font-size:11.5px;color:var(--tx2);margin-top:5px;display:flex;align-items:center;gap:6px}
.bar{flex:1;height:4px;background:#2b333b;border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px}
.ctags{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.cnew{font-size:11px;color:var(--accent)}
.cnew.cblock{color:var(--busy)}
.facs{display:flex;gap:6px;flex-wrap:wrap}
.fac{font-size:11.5px;padding:5px 10px;border-radius:7px;border:1px solid var(--line);color:var(--tx3)}
.fac.y{border-color:var(--accent);color:var(--accent);background:rgba(63,191,143,.12)}
.fac.n{border-color:var(--line);color:var(--tx3);text-decoration:line-through}
.fac.u{border-style:dashed}
.tg{font-size:10px;padding:2px 6px;border-radius:5px;background:#232a31;color:var(--tx2)}
.tg.free{background:rgba(63,191,143,.15);color:var(--accent)}
.tg.time{background:rgba(240,180,41,.14);color:var(--s)}
.empty{padding:34px 18px;text-align:center;color:var(--tx3);font-size:12.5px;line-height:1.9}

/* ---------- detail ---------- */
#detail{position:absolute;inset:0;background:var(--panel);display:none;flex-direction:column;z-index:10}
#detail.on{display:flex}
.dhead{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.back{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12px;color:var(--tx2)}
.dbody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:16px}
.dtitle{display:flex;gap:12px;align-items:flex-start}
.dtitle h2{margin:0;font-size:17px;line-height:1.45;font-weight:700}
.dtitle .sub{font-size:11.5px;color:var(--tx3);margin-top:5px}
.scorebox{margin-top:14px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px}
.sbtop{display:flex;align-items:center;gap:14px;margin-bottom:11px}
.big{font-size:30px;font-weight:800;line-height:1;font-family:Georgia,serif}
.big small{font-size:12px;color:var(--tx3);font-weight:400;margin-left:2px;font-family:inherit}
.axgrid{display:grid;grid-template-columns:1fr 1fr;gap:5px 14px}
.ax{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--tx2)}
.ax label{width:52px;flex:0 0 52px}
.ax .bar{height:5px}
.ax b{width:20px;text-align:right;font-weight:600;color:var(--tx)}
.sect{margin-top:18px}
.sect h3{font-size:12px;color:var(--tx3);margin:0 0 8px;font-weight:600;letter-spacing:.06em}
.info{font-size:12.5px;line-height:1.85;color:var(--tx2)}
.kv{display:flex;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line)}
.kv span:first-child{width:80px;flex:0 0 80px;color:var(--tx3);font-size:11.5px}
.kv span:last-child{font-size:12.5px;flex:1}
.openstat{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px;margin-left:8px}
.openstat.o{background:rgba(63,191,143,.18);color:var(--accent)}
.openstat.x{background:rgba(124,136,148,.2);color:var(--tx3)}

/* heatmap */
.heat{width:100%;border-collapse:separate;border-spacing:3px;table-layout:fixed}
.heat th{font-size:9.5px;color:var(--tx3);font-weight:500;padding:0 0 3px}
.heat td.d{font-size:10.5px;color:var(--tx2);width:34px;text-align:left}
.heat td.cell{height:26px;border-radius:5px;text-align:center;font-size:9.5px;color:#0f1214;font-weight:700}
.heat td.cell.nodata{background:#232a31;color:var(--tx3);font-weight:400}
.heat td.cell.now{outline:2px solid #fff;outline-offset:-2px}
.heatleg{display:flex;gap:12px;margin-top:8px;font-size:10px;color:var(--tx3)}
.heatleg span{display:flex;align-items:center;gap:4px}
.heatleg i{width:9px;height:9px;border-radius:2px;display:block}

.rev{background:var(--panel2);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.rev-flag{border:1px solid rgba(217,83,79,.4);background:rgba(217,83,79,.08)}
.rev-flag p:first-of-type{color:var(--busy);font-weight:600;margin-top:0}
.rev .top{display:flex;justify-content:space-between;font-size:11px;color:var(--tx3);margin-bottom:5px}
.rev .top b{color:var(--tx2);font-weight:600}
.rev p{margin:0;font-size:12.5px;line-height:1.75;color:var(--tx2)}
.rev .mini{margin-top:6px;font-size:10px;color:var(--tx3);letter-spacing:.03em;line-height:1.7}
.rev-del{margin-top:8px;font-size:10.5px;padding:3px 8px;border-radius:999px;
  border:1px solid rgba(217,83,79,.5);background:transparent;color:var(--busy);cursor:pointer;font-family:inherit}
.rev-del:hover{background:rgba(217,83,79,.12)}
.btn{display:block;width:100%;text-align:center;background:var(--accent);color:#08120e;
  border:none;border-radius:10px;padding:11px;font-weight:700;font-size:13px;margin-top:10px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--tx2);font-weight:600}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.hint{font-size:11px;color:var(--tx3);line-height:1.7;margin:8px 0 0}
#gplace{margin-top:8px}
.gphours{list-style:none;margin:6px 0 0;padding:0;font-size:12px;color:var(--tx2);line-height:1.8}

/* ---------- form ---------- */
.field{margin-bottom:11px}
.field label{display:block;font-size:11.5px;color:var(--tx3);margin-bottom:5px}
.field input,.field select,.field textarea{
  width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;
  padding:8px 10px;font-size:13px;outline:none}
.field textarea{resize:vertical;min-height:62px;line-height:1.7}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
.axrow{margin-bottom:11px}
.axdesc{margin:-3px 0 0 100px;font-size:11px;line-height:1.5;color:var(--tx3);min-height:16px}
@media(max-width:520px){ .axdesc{margin-left:0} }
.stars{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.stars>label{width:92px;flex:0 0 92px;font-size:11.5px;color:var(--tx2)}
.stars .st{display:flex;gap:2px}
.stars .st button{background:none;border:none;padding:0;font-size:18px;line-height:1;color:#39424b;transition:.1s}
.stars .st button.on{color:var(--s)}
.seg{display:flex;gap:5px;flex-wrap:wrap}
.seg button{background:var(--panel2);border:1px solid var(--line);border-radius:7px;
  padding:5px 10px;font-size:11.5px;color:var(--tx2)}
.seg button.on{background:rgba(63,191,143,.16);border-color:var(--accent);color:var(--accent)}

/* ---------- map ui ---------- */
.mapui{position:absolute;z-index:600}
#addbtn{right:16px;bottom:26px;background:var(--accent);color:#08120e;border:none;
  border-radius:999px;padding:12px 20px;font-weight:700;font-size:13.5px;box-shadow:var(--shadow)}
#addbtn.arm{background:var(--s)}
#toolstoggle{
  right:14px;top:14px;width:36px;height:36px;border-radius:10px;
  background:rgba(23,27,31,.94);border:1px solid var(--line);color:var(--tx2);
  font-size:15px;line-height:1;box-shadow:var(--shadow);display:grid;place-items:center;
  transition:.15s}
#toolstoggle:hover{color:var(--accent);border-color:var(--accent)}
#toolstoggle[aria-expanded="true"]{background:var(--accent);color:#08120e;border-color:var(--accent)}
#toolbar{right:14px;top:58px;display:flex;flex-direction:column;gap:6px;
  background:rgba(23,27,31,.96);border:1px solid var(--line);border-radius:11px;
  padding:6px;box-shadow:var(--shadow)}
#toolbar[hidden]{display:none}
#toolbar button{background:transparent;border:none;border-radius:7px;text-align:left;
  padding:8px 11px;font-size:11.5px;color:var(--tx2);white-space:nowrap}
#toolbar button:hover{background:var(--panel2);color:var(--accent)}
#legend{left:16px;bottom:16px;background:rgba(23,27,31,.94);border:1px solid var(--line);
  border-radius:10px;padding:10px 12px;font-size:11px;color:var(--tx2);box-shadow:var(--shadow)}
#legend div{display:flex;align-items:center;gap:7px;margin-top:5px}
#legend i{width:11px;height:11px;border-radius:3px;display:block}
#banner{left:50%;transform:translateX(-50%);top:16px;background:rgba(240,180,41,.14);
  border:1px solid rgba(240,180,41,.4);color:#f0b429;border-radius:9px;
  padding:7px 14px;font-size:11.5px;box-shadow:var(--shadow);display:none;white-space:nowrap}
#banner.on{display:block}

.pin{width:26px;height:26px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);
  display:grid;place-items:center;border:2px solid rgba(0,0,0,.35);box-shadow:0 3px 8px rgba(0,0,0,.5)}
.pin b{transform:rotate(45deg);font-size:12px;font-weight:800;color:#0f1214;font-family:Georgia,serif}
.pin.S{background:var(--s)} .pin.A{background:var(--a)}
.pin.B{background:var(--b)} .pin.C{background:var(--c)}
.pin.un{background:var(--un);border-color:rgba(0,0,0,.5)}
.pin.un b{color:#c3ccd5}
.pin.Z{background:var(--blocked);border-color:var(--busy)}
.pin.Z b{color:#fff}
.pin.act{outline:3px solid rgba(255,255,255,.85);outline-offset:1px}
.leaflet-tooltip.tip{
  background:rgba(23,27,31,.96);border:1px solid var(--line);color:var(--tx);
  font-size:11.5px;padding:5px 9px;border-radius:7px;box-shadow:var(--shadow)}
.leaflet-tooltip.tip::before{display:none}
.tip em{font-style:normal;color:var(--tx3);font-size:10.5px}

/* 地図ピンをクリックしたときの簡易吹き出し（Leaflet） */
.leaflet-popup.mini-pop .leaflet-popup-content-wrapper{
  background:rgba(23,27,31,.98);border:1px solid var(--line);color:var(--tx);
  border-radius:10px;box-shadow:var(--shadow)}
.leaflet-popup.mini-pop .leaflet-popup-content{margin:9px 11px;min-width:150px}
.leaflet-popup.mini-pop .leaflet-popup-tip{background:rgba(23,27,31,.98);border:1px solid var(--line)}
.leaflet-popup.mini-pop a.leaflet-popup-close-button{color:var(--tx3);font-size:15px}
.mp-name{font-weight:800;font-size:13px;line-height:1.3;margin-bottom:2px}
.mp-meta{color:var(--tx3);font-size:11px;margin-bottom:6px}
.mp-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11.5px;margin-top:4px}
.mp-hours,.mp-addr{color:var(--tx2)}
.mp-badge{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;
  border-radius:5px;font-weight:800;font-size:11px;color:#0f1214}
.mp-score{font-weight:700}
.mp-unrated{color:var(--tx3)}
.mp-open{padding:1px 6px;border-radius:5px;font-size:10.5px;font-weight:700}
.mp-open.o{background:rgba(63,191,143,.18);color:var(--a)}
.mp-open.x{background:rgba(124,136,148,.18);color:var(--tx3)}
.mp-chip{background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:5px;
  padding:1px 6px;font-size:10.5px;color:var(--tx2)}

/* modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:2000;display:none;
  align-items:center;justify-content:center;padding:20px}
#modal.on{display:flex}

<script>
/* =========================================================
   スタディスポットMAP — プロトタイプ
   ※ 掲載データはすべて動作確認用のサンプルです。
   ========================================================= */

/* ---------- 評価軸 ----------
   星は「なんとなくの good/bad」ではなく、その場で数えられる事実・体感に対応させる。
   基準を書かないと、投稿者ごとに★4の意味が変わって平均が意味を失うため、
   1〜5それぞれに具体的な状態を割り当てて、投稿画面で選択中のものを表示する。
   scale[0] が★1、scale[4] が★5。

   ※「アクセス」の軸は廃止した。地図を見れば位置は分かるうえ、
     近い/遠いは見る人の家がどこかで変わるので、場所の性質の評価にならない。

   ※「電源」「Wi-Fi」は主観の5段階評価から外し、FACS（設備の事実／上部バッジ）へ
     移した。「あるかないか」は好みではなく事実なので、レーダーチャートに混ぜると
     他の軸（静音性など）とスケールの意味が揃わなくなる。検索の絞り込みでは
     「電源がある席が確実にある」かどうかを問いたいので、事実ベースのタグの方が
     ユーザーの探し方に合っている。

   ※「水」の軸・設備表示は廃止した。ターゲット層（中高生・大学生）は基本的に
     飲料を持参して勉強しに行くため、評価軸として残す優先度が低いと判断した。

   ※ 旧「人目」は、周囲の視線を気にせず作業できるかという“遮蔽”の軸だったが、
     利用シーンを洗い出すと「周りが集中しているほど自分も集中できる」という
     ピア効果（社会的促進）の方が、场所選びの決め手になっていた。同じキー
     （privacy）のまま、軸の意味を「周囲の集中度／ピア効果」に定義し直した。

   ※「空調」は、温度管理だけでなく天井の高さ・開放感など空間の心地よさも
     集中の持続時間を左右するため、「空調・空間」として評価範囲を広げた。

   ※「息抜きのしやすさ」は、長時間の滞在で休憩の質（飲食可否・離席のしやすさ）が
     継続利用の決め手になっていたため、新しい軸として追加した。

   5軸の重みの合計は1.00。 */
const AXES = [
  {k:'quiet',   label:'静音性',              w:.25, chip:'静か', scale:[
    '大声の会話や呼び出し放送などが頻繁に響き、集中が何度も途切れる',
    '声や物音がときどき気になり、意識がそがれる',
    '生活音はあるが「気になるほどではない」（適度なBGMのカフェ程度）',
    'ほぼ気にならない。たまに物音がする程度で、集中は途切れない',
    '音による中断がほぼゼロ（無音の自習室でも、心地よい環境音のカフェでも該当）']},
  {k:'seat',    label:'座席・姿勢の快適さ',  w:.20, chip:'座席', scale:[
    '机がない、または長時間座れる椅子ではなく、用途を選ばない',
    '机はあるが狭い・椅子が硬いなどで、短時間しか快適でない',
    '標準的な机と椅子が1種類ある。筆記など特定の用途なら問題ない',
    '用途に応じた座席の選択肢がある程度あり、長時間でも比較的快適',
    '筆記・PC作業・読書など用途に合わせて座席を選べ、姿勢を変えながら長時間座れる']},
  {k:'privacy', label:'周囲の集中度・ピア効果', w:.20, chip:'集中ムードがある', scale:[
    '周囲は談笑・休憩目的の人が中心で、自分もペースを乱されやすい',
    '勉強していない人の方が多く、集中モードに入りにくい',
    '勉強している人とそうでない人が混在。特に後押しも邪魔もない',
    '周囲に集中して作業している人が多く、自然と背筋が伸びる',
    'ほぼ全員が勉強・作業に没頭しており、その空気に引っ張られて集中モードに入れる']},
  {k:'refresh', label:'息抜きのしやすさ',    w:.15, chip:'息抜きしやすい', scale:[
    '飲食禁止・離席しづらい（荷物を置いて席を立てない等）で、休憩が取りにくい',
    '休憩できる場所が乏しく、一息つくには施設の外に出る必要がある',
    '飲食可、または近くに自販機がある程度の最低限の息抜きができる',
    '施設内に休憩スペースやドリンクがあり、席を立ってリフレッシュしやすい',
    'カフェのようにドリンク片手に一息つける、外の景色が見えるなど気分転換がしやすい']},
  {k:'aircon',  label:'空調・空間',          w:.20, chip:'空調', scale:[
    '空調がない、または効きが悪く、暑さ・寒さが集中を妨げる',
    '空調はあるが温度にムラがある、天井が低く圧迫感があるなど',
    '標準的な空調と広さ。可もなく不可もない',
    '快適な温度管理がされており、圧迫感の少ない空間',
    '温度・換気・採光まで快適で、天井の高さや開放感など空間そのものが心地よい']},
];
const RANKS=[{r:'S',min:85},{r:'A',min:72},{r:'B',min:58},{r:'C',min:0}];
/* '?' = まだ誰も評価していないスポット。Cとは区別する */
const UNRATED='?';
/* 'Z' = 星評価はまだ無いが「ここでは勉強できなかった」報告だけはあるスポット。
   これも '?'（誰も行っていない）と同じ扱いにすると、実際に行って
   ダメだったという情報が「未評価」に埋もれてしまうため、別扱いにする。
   すでに星評価がついているスポットは、1件くらい失敗報告があっても
   スコアはそのまま（Zにはしない）。 */
const BLOCKED='Z';
/* 設備は「事実」。誰かの主観評価とは別に、あるかないかだけを持つ。
   1=あり 0=なし undefined=不明（口コミの平均で代用する）
   「水」は対象層が飲料を持参する前提のため設備表示から外した。
   電源・Wi-Fiは施設詳細の上部にバッジとして出す（TOPFACS）ので、
   ここ（FACS）は「設備（確認できている事実）」セクション用に空調だけ残す。 */
const TOPFACS=[{k:'power',label:'電源',icon:'⚡'},{k:'wifi',label:'Wi-Fi',icon:'📶'}];
const FACS=[{k:'aircon',label:'空調'}];
/* 一覧カードや地図ポップアップの簡易バッジには、上部バッジ分も含めて全部出す */
const ALLFACS=[...TOPFACS,...FACS];
const facOf=(sp,k)=>sp.facilities?sp.facilities[k]:undefined;
const RCOL={S:'var(--s)',A:'var(--a)',B:'var(--b)',C:'var(--c)','?':'var(--un)',Z:'var(--blocked)'};

/* ---------- ピンをクリックしたときの簡易吹き出し ---------- */
function miniPopupHTML(sp,rank,sc){
  const op=isOpenNow(sp), h=hoursFor(sp);
  const statusHtml = op===true?`<span class="mp-open o">開館中</span>`
    : op===false?`<span class="mp-open x">時間外</span>`:'';
  const scoreHtml = rank===UNRATED ? `<span class="mp-unrated">未評価</span>`
    : rank===BLOCKED ? `<span class="mp-badge" style="background:${RCOL[rank]}">${rank}</span><span class="mp-unrated">勉強できなかった、との報告あり</span>`
    : `<span class="mp-badge" style="background:${RCOL[rank]}">${rank}</span><span class="mp-score">${sc}点</span>`;
  const facs = ALLFACS.filter(f=>facOf(sp,f.k)===1).map(f=>`<span class="mp-chip">${f.label}</span>`).join('');
  return `<div class="mp">
    <div class="mp-name">${esc(sp.name)}</div>
    <div class="mp-meta">${esc(sp.city||'')}・${esc(sp.category||'')}</div>
    <div class="mp-row">${scoreHtml}${statusHtml?' '+statusHtml:''}</div>
    ${h?`<div class="mp-row mp-hours">${esc(h)}</div>`:''}
    ${sp.address?`<div class="mp-row mp-addr">${esc(sp.address)}</div>`:''}
    ${facs?`<div class="mp-row">${facs}</div>`:''}
  </div>`;
}

/* ---------- 時間帯 ---------- */
const SLOTS=[[9,11],[11,13],[13,15],[15,17],[17,19],[19,21]];
const SLOT_LABEL=SLOTS.map(x=>`${x[0]}–${x[1]}`);
const DAYS=[{k:'wd',label:'平日'},{k:'we',label:'土日'}];
const LEVELS={1:{t:'混雑',c:'var(--busy)'},2:{t:'ふつう',c:'var(--mid)'},3:{t:'空き',c:'var(--ok)'}};

function nowCell(){
  const d=new Date(), h=d.getHours()+d.getMinutes()/60;
  const day=(d.getDay()===0||d.getDay()===6)?'we':'wd';
  const i=SLOTS.findIndex(s=>h>=s[0]&&h<s[1]);
  return i<0?null:{day,slot:i};
}

/* ---------- 都道府県 ---------- */
const PREFS=['北海道','青森県','岩手県','宮城県','秋田県','山形県','福島県','茨城県','栃木県','群馬県',
'埼玉県','千葉県','東京都','神奈川県','新潟県','富山県','石川県','福井県','山梨県','長野県','岐阜県',
'静岡県','愛知県','三重県','滋賀県','京都府','大阪府','兵庫県','奈良県','和歌山県','鳥取県','島根県',
'岡山県','広島県','山口県','徳島県','香川県','愛媛県','高知県','福岡県','佐賀県','長崎県','熊本県',
'大分県','宮崎県','鹿児島県','沖縄県'];

/* ---------- サンプルデータ ---------- */
const rid=()=>Math.random().toString(36).slice(2,9);
function s(o){ return Object.assign({id:'seed-'+rid(),pref:'栃木県',seed:true},o); }
/* ガスト・ココスのようなファミレスチェーンは、店舗ごとに実測しなくても
   写真や一般的な特徴（会話が多い・ドリンクバーがある等）から大体の評価がつく。

/* ---------- スコア ---------- */
/* 「ここでは勉強できなかった」報告（axes:null）はスコア計算に入れない。
   星評価をしていない投稿を平均に混ぜると数字が実態からズレるため。 */
const ratedReviews=sp=>sp.reviews.filter(rv=>rv.axes);
function avgAxes(sp){
  const o={}; AXES.forEach(a=>o[a.k]=0);
  const rv2=ratedReviews(sp);
  if(!rv2.length) return o;
  rv2.forEach(rv=>AXES.forEach(a=>o[a.k]+=(rv.axes[a.k]??3)));
  AXES.forEach(a=>o[a.k]/=rv2.length);
  return o;
}
function score100(sp){
  if(!ratedReviews(sp).length) return 0;
  const a=avgAxes(sp);
  return Math.round(AXES.reduce((t,x)=>t+a[x.k]*x.w,0)/5*100);
}
const rankOf=sc=>RANKS.find(x=>sc>=x.min).r;
/* 口コミが1件も無いスポットは順位をつけず「未評価」にする。 */
const rated=sp=>ratedReviews(sp).length>0;
/* 星評価がまだ無く、「ここでは勉強できなかった」報告だけが付いている状態。 */
const hasBlockFlag=sp=>sp.reviews.some(rv=>rv.cantStudy);
const rankOfSpot=sp=>rated(sp)?rankOf(score100(sp)):(hasBlockFlag(sp)?BLOCKED:UNRATED);

/* ---------- 空き状況 ---------- */
function heatData(sp){
  const g={}; DAYS.forEach(d=>g[d.k]=SLOTS.map(()=>({n:0,t:0})));
  sp.reviews.forEach(rv=>{
    const v=rv.visit; if(!v||!g[v.day]||v.slot==null) return;
    const c=g[v.day][v.slot]; if(!c) return;
    c.n++; c.t+=v.level;
  });
  return g;
}
function bestSlot(sp){
  const g=heatData(sp); let best=null;
  DAYS.forEach(d=>g[d.k].forEach((c,i)=>{
    if(!c.n) return; const a=c.t/c.n;
    if(!best||a>best.avg) best={avg:a,day:d.label,slot:SLOT_LABEL[i]};
  }));
  return best&&best.avg>=2.5?best:null;
}
function freeNow(sp){
  const n=nowCell(); if(!n) return false;
  const c=heatData(sp)[n.day][n.slot];
  return c.n>0 && c.t/c.n>=2.5;
}
/* 営業時間（"9:00–19:00" 形式）から開館中か判定 */
function parseHM(t){ const m=/(\d{1,2}):(\d{2})/.exec(t||''); return m?+m[1]+ +m[2]/60:null; }
function hoursFor(sp){
  const d=new Date().getDay();
  return (d===0||d===6)?(sp.hoursWe||sp.hoursWd):(sp.hoursWd||sp.hoursWe);
}
function isOpenNow(sp){
  const h=hoursFor(sp); if(!h) return null;
  const p=h.split(/[–~-]/); if(p.length<2) return null;
  const a=parseHM(p[0]), b=parseHM(p[1]); if(a==null||b==null) return null;
  const now=new Date().getHours()+new Date().getMinutes()/60;
  return now>=a&&now<b;
}
function closeHour(sp){ const h=hoursFor(sp)||''; const p=h.split(/[–~-]/); return p[1]?(parseHM(p[1])??0):0; }

function loadScript(src){
  return new Promise((res,rej)=>{
    const s=document.createElement('script'); s.src=src;
    s.onload=()=>res(); s.onerror=()=>rej(new Error('スクリプトを読み込めませんでした'));
    document.head.appendChild(s);
  });
}

/* DBの行 <-> アプリのオブジェクト */
function rowToReview(r){
  const cantStudy=!!r.cant_study;
  const axes=cantStudy?null:(()=>{ const o={}; AXES.forEach(a=>o[a.k]=r['ax_'+a.k]??3); return o; })();
  return {id:r.id,user:r.user_name||'名無し',axes,cantStudy,comment:r.comment||'',
    visit:(r.visit_day!=null&&r.visit_slot!=null)?{day:r.visit_day,slot:r.visit_slot,level:r.visit_level}:null,
    date:(r.created_at||'').slice(0,7)};
}
/* facilities（設備の事実）は jsonb 1列にそのまま入れる。
   1=あり 0=なし キーなし=不明、という3状態を持つので、
   列を4つに割ると「不明」をNULLで表すことになって扱いが増える。 */
function rowToSpot(r,revs){
  return {id:r.id,name:r.name,pref:r.pref||'栃木県',city:r.city||'—',category:r.category||'図書館',
    address:r.address||'',lat:r.lat,lng:r.lng,hoursWd:r.hours_wd||'',hoursWe:r.hours_we||'',
    closed:r.closed_days||'',fee:r.fee||'',note:r.note||'',
    facilities:(r.facilities&&typeof r.facilities==='object')?r.facilities:{},reviews:revs};
}
const spotToRow=sp=>({name:sp.name,pref:sp.pref,city:sp.city,category:sp.category,address:sp.address,
  lat:sp.lat,lng:sp.lng,hours_wd:sp.hoursWd,hours_we:sp.hoursWe,closed_days:sp.closed,fee:sp.fee,note:sp.note,
  facilities:sp.facilities||{}});
function reviewToRow(spotId,rv){
  const o={spot_id:spotId,user_name:rv.user,comment:rv.comment,cant_study:!!rv.cantStudy,
    visit_day:rv.visit?.day??null,visit_slot:rv.visit?.slot??null,visit_level:rv.visit?.level??null};
  AXES.forEach(a=>o['ax_'+a.k]=rv.axes?rv.axes[a.k]:null);
  return o;
}

const DB={
  mode:'local', sb:null, err:'',
  async init(){
    const cfg=cloudCfg(); if(!cfg||!cfg.url||!cfg.key) return 'local';
    try{
      if(!window.supabase) await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2');
      this.sb=window.supabase.createClient(cfg.url,cfg.key);
      const {error}=await this.sb.from('spots').select('id',{count:'exact',head:true});
      if(error) throw error;
      this.mode='cloud'; return 'cloud';
    }catch(e){ this.err=e.message||String(e); this.mode='local'; return 'local'; }
  },
  async list(){
    if(this.mode==='local') return loadLocal();
    const [sp,rv]=await Promise.all([
      this.sb.from('spots').select('*'),
      this.sb.from('reviews').select('*').order('created_at',{ascending:true})
    ]);
    if(sp.error) throw sp.error;
    if(rv.error) throw rv.error;
    const by={}; (rv.data||[]).forEach(r=>{ (by[r.spot_id]??=[]).push(rowToReview(r)); });
    return (sp.data||[]).map(r=>rowToSpot(r,by[r.id]||[]));
  },
  async addSpot(sp){
    if(this.mode==='local'){ SPOTS.push(sp); saveLocal(); return sp; }
    const ins=await this.sb.from('spots').insert(spotToRow(sp)).select().single();
    if(ins.error) throw ins.error;
    const rv=sp.reviews[0];
    if(rv){
      const r2=await this.sb.from('reviews').insert(reviewToRow(ins.data.id,rv)).select().single();
      if(r2.error) throw r2.error;
      rv.id=r2.data.id;
    }
    sp.id=ins.data.id; SPOTS.push(sp); return sp;
  },
  async addReview(sp,rv){
    if(this.mode==='local'){ sp.reviews.push(rv); saveLocal(); return rv; }
    const r=await this.sb.from('reviews').insert(reviewToRow(sp.id,rv)).select().single();
    if(r.error) throw r.error;
    rv.id=r.data.id; sp.reviews.push(rv); return rv;
  },
  /* 電源・Wi-Fiは5段階評価から外して「事実」（facilities）に一本化したので、
     口コミ・報告・スポット登録のどのタイミングでも、わかった人がここを更新できる
     ようにしておく。patch は {power:1} のように「確認できた項目だけ」を渡す。
     後から報告した人の情報で上書きする単純な仕組み（多数決などはしない）。 */
  async updateFacilities(sp,patch){
    const merged={...(sp.facilities||{}),...patch};
    if(this.mode==='local'){ sp.facilities=merged; saveLocal(); return; }
    const up=await this.sb.from('spots').update({facilities:merged}).eq('id',sp.id);
    if(up.error) throw up.error;
    sp.facilities=merged;
  },
  /* 管理者モードから、雑な・荒らしっぽい口コミ・報告を消すためのもの。 */
  async deleteReview(sp,rv){
    if(this.mode==='local'){ sp.reviews=sp.reviews.filter(r=>r.id!==rv.id); saveLocal(); return; }
    const del=await this.sb.from('reviews').delete().eq('id',rv.id);
    if(del.error) throw del.error;
    sp.reviews=sp.reviews.filter(r=>r.id!==rv.id);
  },
  /* 初期データを共有DBに流し込む（初回セットアップ用）。
     二重投入すると同じスポットが2つ並ぶので、空のときだけ通す。 */
  async seed(){
    if(this.mode!=='cloud') throw new Error('共有DBに接続していません');
    const c=await this.sb.from('spots').select('id',{count:'exact',head:true});
    if(c.error) throw c.error;
    if(c.count>0) throw new Error(`共有DBには既に${c.count}件入っています。二重投入を避けるため中止しました。`);
    const src=JSON.parse(JSON.stringify(SEED));
    for(const sp of src){
      const ins=await this.sb.from('spots').insert(spotToRow(sp)).select().single();
      if(ins.error) throw ins.error;
      const rows=sp.reviews.map(rv=>reviewToRow(ins.data.id,rv));
      if(rows.length){ const e=await this.sb.from('reviews').insert(rows); if(e.error) throw e.error; }
    }
    return src.length;
  }
};

/* ---------- 状態 ---------- */
const state={pref:'栃木県',city:'',q:'',cat:'',sort:'score',ranks:{S:1,A:1,B:1,C:1,'?':1,'Z':1},chips:{},sel:null,adding:false};

/* ---------- 地図アダプタ ---------- */
let MapA=null;

function LeafletAdapter(){
  const map=L.map('map',{zoomControl:false}).setView([36.62,139.83],9.4);
  L.control.zoom({position:'topleft'}).addTo(map);
  L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png',
    {attribution:'&copy; <a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">国土地理院</a>',maxNativeZoom:18,maxZoom:19}).addTo(map);
  let markers=[], byId=new Map();
  return {
    clear(){ markers.forEach(m=>map.removeLayer(m)); markers=[]; byId.clear(); },
    add(sp,rank,sc,onClick){
      const cls=rank===UNRATED?'un':rank, mark=rank===UNRATED?'未':rank;
      const icon=L.divIcon({html:`<div class="pin ${cls}" data-id="${sp.id}"><b>${mark}</b></div>`,
        className:'',iconSize:[26,26],iconAnchor:[13,26]});
      const m=L.marker([sp.lat,sp.lng],{icon}).addTo(map);
      const rankLabel=rank===UNRATED?'未評価':rank===BLOCKED?'勉強できなかった、との報告あり':sc+'点';
      m.bindTooltip(`<b>${esc(sp.name)}</b><br><em>${rankLabel} ・ ${esc(hoursFor(sp)||'—')}</em>`,
        {className:'tip',direction:'top',offset:[0,-28]});
      m.bindPopup(miniPopupHTML(sp,rank,sc),{className:'mini-pop',closeButton:true,offset:[0,-14],maxWidth:240,autoPan:false});
      m.on('click',()=>{ onClick(sp.id); MapA.openPopup(sp.id); });
      markers.push(m); byId.set(sp.id,m);
    },
    highlight(id){ document.querySelectorAll('.pin').forEach(p=>p.classList.toggle('act',p.dataset.id===id)); },
    focus(sp){ map.setView([sp.lat,sp.lng],Math.max(map.getZoom(),13),{animate:true}); },
    fit(rows){ if(!rows.length) return; map.fitBounds(rows.map(x=>[x.lat,x.lng]),{padding:[60,60],maxZoom:13}); },
    openPopup(id){ const m=byId.get(id); if(m) m.openPopup(); },
    onMapClick(fn){ map.on('click',e=>fn(e.latlng.lat,e.latlng.lng)); },
    cursor(on){ document.getElementById('map').style.cursor=on?'crosshair':''; }
  };
}

function bootMap(){ initAdapter(LeafletAdapter()); }
function initAdapter(a){
  MapA=a;
  MapA.onMapClick((lat,lng)=>{ if(state.adding) openAddForm(lat,lng); });
  render();
  const rows=filtered();
  MapA.fit(rows);
  if(rows.length) selectSpot(rows[0].id,false);   // ← 開いてすぐ1位の情報が見える
}

/* ---------- 絞り込み ---------- */
function filtered(){
  const q=state.q.trim().toLowerCase();
  let out=SPOTS.filter(sp=>{
    if(state.pref && (sp.pref||'栃木県')!==state.pref) return false;
    if(state.city && sp.city!==state.city) return false;
    if(!state.ranks[rankOfSpot(sp)]) return false;
    if(state.cat && sp.category!==state.cat) return false;
    if(q && !(sp.name+sp.city+(sp.address||'')+sp.category).toLowerCase().includes(q)) return false;
    const a=avgAxes(sp);
    // 電源・Wi-Fiは主観評価を持たない「絶対条件」。確認できたものだけを通す。
    for(const k of ['power','wifi']){
      if(state.chips[k] && facOf(sp,k)!==1) return false;
    }
    // 空調・空間は設備の事実があればそれを優先し、無ければ口コミの平均で判定する。
    if(state.chips.aircon){
      const f=facOf(sp,'aircon');
      if(f===0) return false;
      if(f!==1 && a.aircon<3.5) return false;
    }
    if(state.chips.privacy && a.privacy<3.5) return false;
    if(state.chips.quiet && a.quiet<4) return false;
    if(state.chips.free && !/無料/.test(sp.fee||'')) return false;
    if(state.chips.open && isOpenNow(sp)!==true) return false;
    if(state.chips.now && !freeNow(sp)) return false;
    return true;
  });
  const key={score:x=>-score100(x),rank:x=>-score100(x),late:x=>-closeHour(x),
             rev:x=>-x.reviews.length,name:x=>x.name}[state.sort];
  out.sort((x,y)=>{
    // 未評価は点数で並べられないので、名前順以外では常に末尾へ
    if(state.sort!=='name' && rated(x)!==rated(y)) return rated(x)?-1:1;
    const a=key(x),b=key(y);
    if(a!==b) return a<b?-1:1;
    // 同点（未評価どうしを含む）は、遅くまで開いているほうを先に
    const ca=closeHour(x),cb=closeHour(y);
    if(ca!==cb) return cb-ca;
    return x.name<y.name?-1:x.name>y.name?1:0;
  });
  return out;
}

/* ---------- 検索候補（入力中に出す候補一覧） ----------
   絞り込み中の地域だけでなく全国から候補を出し、選ぶとその場所に飛ぶ。
   名前の前方一致を優先し、それ以外は名前・市町村・住所・種別の部分一致。 */
function searchCandidates(q){
  const qq=q.trim().toLowerCase();
  if(!qq) return [];
  const starts=[],contains=[];
  SPOTS.forEach(sp=>{
    if(sp.name.toLowerCase().startsWith(qq)) starts.push(sp);
    else if((sp.name+sp.city+(sp.address||'')+sp.category).toLowerCase().includes(qq)) contains.push(sp);
  });
  return [...starts,...contains].slice(0,8);
}
function renderSuggest(){
  const box=document.getElementById('searchsuggest');
  const list=searchCandidates(document.getElementById('topsearch').value);
  if(!list.length){ box.hidden=true; box.innerHTML=''; return; }
  box.innerHTML=list.map(sp=>{
    const rk=rankOfSpot(sp);
    return `<button type="button" class="sgitem" data-id="${sp.id}">
      <span class="sgbadge ${rk===UNRATED?'un':rk}">${rk===UNRATED?'未':rk}</span>
      <span class="sgtext"><b>${esc(sp.name)}</b><small>${esc(sp.pref||'')} ${esc(sp.city)}・${esc(sp.category)}</small></span>
    </button>`;
  }).join('');
  box.hidden=false;
  box.querySelectorAll('.sgitem').forEach(b=>b.onclick=()=>jumpToSpot(b.dataset.id));
}
function hideSuggest(){
  const box=document.getElementById('searchsuggest'); box.hidden=true; box.innerHTML='';
}
function jumpToSpot(id){
  const sp=SPOTS.find(x=>x.id===id); if(!sp) return;
  state.pref=sp.pref||'栃木県'; state.city=sp.city; state.q='';
  document.getElementById('topsearch').value='';
  hideSuggest();
  fillRegion(); render(); syncPageMeta();
  const rows=filtered(); MapA&&MapA.fit(rows);
  selectSpot(sp.id);
}

/* ---------- 地域セレクタ ---------- */
function fillRegion(){
  const pf=document.getElementById('pref');
  const counts={}; SPOTS.forEach(sp=>{const p=sp.pref||'栃木県';counts[p]=(counts[p]||0)+1;});
  pf.innerHTML=`<option value="">全国</option>`+
    PREFS.map(p=>`<option value="${p}" ${p===state.pref?'selected':''}>${p}${counts[p]?` (${counts[p]})`:''}</option>`).join('');
  const cs=[...new Set(SPOTS.filter(sp=>!state.pref||(sp.pref||'栃木県')===state.pref).map(sp=>sp.city))].sort();
  const cy=document.getElementById('city');

    cs.map(c=>`<option value="${c}" ${c===state.city?'selected':''}>${c}</option>`).join('');

/* ---------- URLと状態の同期 ----------
   市町村ごとに ?pref=…&city=… という別URLで見えるようにして、
   Googleが各市町村を別ページとして評価できるようにする。
   静的ページを作る余裕はないので、クエリ文字列とtitle/meta/canonicalの
   書き換えだけで済ませる「軽い」実装。 */
function applyURLParams(){
  const p=new URLSearchParams(location.search);
  const pref=p.get('pref'), city=p.get('city');
  if(pref && PREFS.includes(pref)) state.pref=pref;
  if(city && SPOTS.some(sp=>sp.city===city && (sp.pref||'栃木県')===state.pref)) state.city=city;
}
function syncPageMeta(){
  const base='スタディスポットMAP';
  const count=filtered().length;
  let title,desc;
  if(state.pref && state.city){
    title=`${state.city}の無料勉強スポット${count}件（${state.pref}）| ${base}`;
    desc=`${state.pref}${state.city}で無料で勉強できる場所${count}件。図書館・カフェ・公民館などを静音性や電源の有無で比較できます。`;
  }else if(state.pref){
    title=`${state.pref}の無料勉強スポット${count}件 | ${base}`;
    desc=`${state.pref}内で無料で勉強できる場所${count}件を地図とランキングで比較。静音性・電源・Wi-Fiなどの設備もわかります。`;
  }else{
    title=`${base} — 無料で勉強できる場所をみんなでランク付け`;
    desc='栃木県内の図書館・公民館・カフェなど、無料で勉強できる場所を地図でランク付け。静音性・電源・Wi-Fiなど8軸で評価し、時間帯ごとの空き状況もわかります。';
  }
  document.title=title;
  document.getElementById('pgdesc').setAttribute('content',desc);
  document.getElementById('pgogtitle').setAttribute('content',title);
  document.getElementById('pgogdesc').setAttribute('content',desc);
  const p=new URLSearchParams();
  if(state.pref) p.set('pref',state.pref);
  if(state.city) p.set('city',state.city);
  const qs=p.toString();
  const url='https://kaitoinoue0921.github.io/study-map/'+(qs?`?${qs}`:'');
  document.getElementById('pgcanon').setAttribute('href',url);
  document.getElementById('pgogurl').setAttribute('content',url);
  history.replaceState(null,'',location.pathname+(qs?`?${qs}`:''));
}
/* ---------- 描画 ---------- */
function render(){
  const rows=filtered();
  document.getElementById('count').textContent=`${rows.length} 件`;
  document.getElementById('topcount').textContent=
    `${state.pref||'全国'}${state.city?' / '+state.city:''} — ${rows.length}件`;

  const list=document.getElementById('list');
  list.innerHTML= rows.length ? rows.map(sp=>{
    const sc=score100(sp),rk=rankOfSpot(sp),a=avgAxes(sp),bs=bestSlot(sp),op=isOpenNow(sp);
    const tags=[];
    if(op===true) tags.push(`<span class="tg free">開館中 ${esc(hoursFor(sp)||'')}</span>`);
    else if(op===false) tags.push(`<span class="tg">${esc(hoursFor(sp)||'')}</span>`);
    if(bs) tags.push(`<span class="tg time">${bs.day}${bs.slot}時が空き</span>`);
    ALLFACS.forEach(f=>{
      const v=facOf(sp,f.k);
      if(v===1||(v===undefined&&a[f.k]>=4)) tags.push(`<span class="tg">${f.label}</span>`);
    });
    const score = rk===UNRATED
      ? `<span class="cnew">まだ評価がありません — 最初の1人になりませんか？</span>`
      : rk===BLOCKED
      ? `<span class="cnew cblock">⚠ ここでは勉強できなかった、との報告があります</span>`
      : `<span style="width:30px">${sc}点</span>
         <span class="bar"><i style="width:${sc}%;background:${RCOL[rk]}"></i></span>
         <span>口コミ${sp.reviews.length}</span>`;
    return `<div class="card ${state.sel===sp.id?'sel':''}" data-id="${sp.id}">
      <div class="badge ${rk===UNRATED?'un':rk}">${rk===UNRATED?'未<br>評価':rk}</div>
      <div class="cbody">
        <div class="cname">${esc(sp.name)}</div>
        <div class="cmeta">${esc(sp.city)}・${esc(sp.category)}</div>
        <div class="cscore">${score}</div>
        <div class="ctags">${tags.join('')}</div>
      </div></div>`;
  }).join('') : `<div class="empty">${state.pref||'この地域'}にはまだスポットがありません。<br>
      右下の「＋ スポットを追加」から、<br>あなたの知っている場所を最初に登録してみてください。</div>`;

  list.querySelectorAll('.card').forEach(c=>c.onclick=()=>selectSpot(c.dataset.id));

  if(MapA){
    MapA.clear();
    rows.forEach(sp=>MapA.add(sp,rankOfSpot(sp),score100(sp),selectSpot));
    if(state.sel) MapA.highlight(state.sel);
  }
}

function selectSpot(id,focus=true){
  const sp=SPOTS.find(x=>x.id===id); if(!sp) return;
  state.sel=id;
  if(MapA){ if(focus) MapA.focus(sp); MapA.highlight(id); }
  document.getElementById('dbody').innerHTML=detailHTML(sp);
  document.getElementById('detail').classList.add('on');
  document.getElementById('side').classList.add('detail-on');
  document.getElementById('dbody').scrollTop=0;
  const b=document.getElementById('addRev'); if(b) b.onclick=()=>openReviewForm(sp);
  const fb=document.getElementById('addFlag'); if(fb) fb.onclick=()=>openFlagForm(sp);
  const gb=document.getElementById('btnGplace'); if(gb) gb.onclick=()=>fetchGooglePlace(sp);
  document.querySelectorAll('.rev-del').forEach(db=>{
    db.onclick=async()=>{
      const rv=sp.reviews.find(r=>r.id===db.dataset.rid); if(!rv) return;
      if(!confirm('この投稿を削除します。よろしいですか？（元に戻せません）')) return;
      db.disabled=true; db.textContent='削除中…';
      try{ await DB.deleteReview(sp,rv); }
      catch(err){ db.disabled=false; db.textContent='✕ 削除'; toast('削除できませんでした: '+(err.message||err)); return; }
      selectSpot(sp.id,false); toast('削除しました');
    };
  });
  render();
}

function heatHTML(sp){
  const g=heatData(sp),n=nowCell();
  const head=`<tr><th></th>${SLOT_LABEL.map(l=>`<th>${l}</th>`).join('')}</tr>`;
  const body=DAYS.map(d=>`<tr><td class="d">${d.label}</td>`+
    g[d.k].map((c,i)=>{
      const isNow=n&&n.day===d.k&&n.slot===i?' now':'';
      if(!c.n) return `<td class="cell nodata${isNow}">–</td>`;
      const a=c.t/c.n, lv=a>=2.5?3:a>=1.7?2:1;
      return `<td class="cell${isNow}" style="background:${LEVELS[lv].c}">${LEVELS[lv].t}</td>`;
    }).join('')+`</tr>`).join('');
  return `<table class="heat">${head}${body}</table>
    <div class="heatleg">
      <span><i style="background:var(--ok)"></i>空き</span>
      <span><i style="background:var(--mid)"></i>ふつう</span>
      <span><i style="background:var(--busy)"></i>混雑</span>
      <span><i style="background:#232a31"></i>情報なし</span>
      <span style="margin-left:auto">白枠＝現在</span>

}

/* ---------- 入力部品 ---------- */
/* 星を選ぶと、その星が何を意味するのかを下に出す。
   基準を見せないまま5段階を出しても、人によって★4の中身が変わってしまうため。 */
const axScale=(k,v)=>{
  const a=AXES.find(x=>x.k===k);
  return (a&&a.scale&&a.scale[v-1])?a.scale[v-1]:'';
};
function starsRow(k,label,val){
  return `<div class="axrow"><div class="stars"><label>${label}</label><div class="st" data-k="${k}">
    ${[1,2,3,4,5].map(i=>`<button type="button" data-v="${i}" class="${i<=val?'on':''}"
       title="★${i}：${esc(axScale(k,i))}">★</button>`).join('')}
  </div></div><div class="axdesc" data-desc="${k}">${esc(axScale(k,val))}</div></div>`;
}
function wireStars(root,vals){
  root.querySelectorAll('.st').forEach(st=>st.querySelectorAll('button').forEach(b=>{
    b.onclick=()=>{ const v=+b.dataset.v, k=st.dataset.k; vals[k]=v;
      st.querySelectorAll('button').forEach(x=>x.classList.toggle('on',+x.dataset.v<=v));
      const d=root.querySelector(`[data-desc="${k}"]`); if(d) d.textContent=axScale(k,v); };
  }));
}
function segHTML(name,items,sel){
  return `<div class="seg" data-seg="${name}">${items.map(it=>
    `<button type="button" data-v="${it.v}" class="${it.v==sel?'on':''}">${it.t}</button>`).join('')}</div>`;
}
function wireSeg(root,store){
  root.querySelectorAll('.seg').forEach(sg=>sg.querySelectorAll('button').forEach(b=>{
    b.onclick=()=>{ store[sg.dataset.seg]=b.dataset.v;
      sg.querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); };
  }));
}
function visitBlock(sel){
  return `<div class="grp">行った曜日・時間帯（空き状況の集計に使います）</div>
    ${segHTML('day',DAYS.map(d=>({v:d.k,t:d.label})),sel.day)}
    <div style="height:5px"></div>
    ${segHTML('slot',SLOT_LABEL.map((l,i)=>({v:i,t:l+'時'})),sel.slot)}
    <div class="grp">その時の混み具合</div>
    ${segHTML('level',[{v:3,t:'空いていた'},{v:2,t:'ふつう'},{v:1,t:'混んでいた'}],sel.level)}`;
}
/* 電源・Wi-Fiは主観評価ではなく「事実」なので、口コミ投稿のたびに
   わかった人が確認結果を報告できるようにしておく（デフォルトは「不明のまま」＝未回答）。
   sel に f_power / f_wifi を生やして wireSeg の対象に混ぜ込む。 */
function factsBlock(sel){
  sel.f_power=''; sel.f_wifi='';
  const opts=[{v:'1',t:'あり'},{v:'0',t:'なし'},{v:'',t:'不明のまま'}];
  return `<div class="grp">電源・Wi-Fiは実際どうでしたか？（わかれば教えてください）</div>
    <div style="font-size:11px;color:var(--tx3);margin-bottom:4px">電源</div>
    ${segHTML('f_power',opts,'')}
    <div style="height:5px"></div>
    <div style="font-size:11px;color:var(--tx3);margin-bottom:4px">Wi-Fi</div>
    ${segHTML('f_wifi',opts,'')}`;
}
function factsPatch(sel){
  const p={};
  if(sel.f_power!=='') p.power=+sel.f_power;
  if(sel.f_wifi!=='') p.wifi=+sel.f_wifi;
  return p;
}

/* ---------- 情報提供者への感謝 ----------
   口コミ・報告のニックネームごとに、投稿してくれたスポット名と件数を集計して
   お礼のメッセージと一緒に表示する。連絡先は集めていないので、個別DMではなく
   このページ上での公開のお礼という形にしている。 */
function collectContributors(){
  const by=new Map();
  SPOTS.forEach(sp=>{
    (sp.reviews||[]).forEach(rv=>{
      const name=(rv.user||'').trim();
      if(!name || name==='名無し') return;
      if(!by.has(name)) by.set(name,{name,count:0,spots:new Set(),last:''});
      const c=by.get(name);
      c.count++; c.spots.add(sp.name);
      if(!c.last || (rv.date||'')>c.last) c.last=rv.date||'';
    });
  });
  return [...by.values()].sort((a,b)=>b.count-a.count || (b.last>a.last?1:-1));
}
function openThanks(){
  const list=collectContributors();
  const anon=SPOTS.reduce((n,sp)=>n+(sp.reviews||[]).filter(rv=>!rv.user||rv.user.trim()===''||rv.user.trim()==='名無し').length,0);
  const cards=list.length ? list.map(c=>`<div class="rev">
      <div class="top"><b>${esc(c.name)} さん</b><span>最新 ${esc(c.last||'—')}</span></div>
      <p>${esc(c.spots.size)}件のスポットに、${esc(c.count)}件の口コミ・報告をありがとうございます。</p>
      <div class="mini">${[...c.spots].map(esc).join('　/　')}</div>
    </div>`).join('')
    : `<div class="info" style="color:var(--tx3)">まだニックネーム付きの口コミがありません。</div>`;
  openModal(`<h2>🙏 情報提供者への感謝</h2>
    <p class="lead">口コミや「ここでは勉強できなかった」報告は、次に行く人がその場所を選べるかどうかを左右します。
    ニックネームを添えて投稿してくれた方々に、この場を借りてお礼を伝えます。本当にありがとうございます。</p>
    ${cards}
    ${anon?`<p class="hint">このほか、名無しでの投稿が${esc(anon)}件あります。名無しの方にも同じだけ感謝しています。</p>`:''}
    <button class="btn ghost" id="thanksclose">閉じる</button>`);
  document.getElementById('sheet').querySelector('#thanksclose').onclick=closeModal;
}

let tTimer=null;
function banner(msg){ const b=document.getElementById('banner'); b.textContent=msg; b.classList.toggle('on',!!msg); }
function toast(msg){ banner(msg); clearTimeout(tTimer); tTimer=setTimeout(()=>{ if(!state.adding) banner(''); },2400); }
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ⚙ 設定メニューの開閉。地図の邪魔にならないよう、ふだんは畳んでおく */
const toolsBtn=document.getElementById('toolstoggle'), toolsBox=document.getElementById('toolbar');
function setTools(open){
  toolsBox.hidden=!open;
  toolsBtn.setAttribute('aria-expanded',open?'true':'false');
}
toolsBtn.onclick=e=>{ e.stopPropagation(); setTools(toolsBox.hidden); };
toolsBox.onclick=()=>setTools(false);          // 項目を選んだら閉じる
document.addEventListener('click',e=>{
  if(!toolsBox.hidden && !toolsBox.contains(e.target) && e.target!==toolsBtn) setTools(false);
});

document.getElementById('btnExport').onclick=()=>{
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(SPOTS,null,2)],{type:'application/json'}));
  a.download='study-spots.json'; a.click(); toast('JSONを書き出しました');
};
document.getElementById('btnImport').onclick=()=>{
  const i=document.createElement('input'); i.type='file'; i.accept='.json';
  i.onchange=()=>{ const f=i.files[0]; if(!f) return;
    const fr=new FileReader();
    fr.onload=()=>{ try{
        const d=JSON.parse(fr.result); if(!Array.isArray(d)) throw 0;
        SPOTS=d; saveLocal(); backToList(); fillRegion(); render();
        toast(`${d.length}件を読み込みました${DB.mode==='cloud'?'（表示のみ・共有DBには書き込まれません）':''}`);
      }catch(e){ toast('読み込めませんでした（JSON形式を確認してください）'); } };
    fr.readAsText(f); };
  i.click();
};
document.getElementById('btnReset').onclick=()=>{
  if(DB.mode==='cloud'){ toast('共有DB接続中は使えません（消すならSupabase側で操作してください）'); return; }
  if(!confirm('この端末に登録したスポットと口コミをすべて消して、サンプルデータに戻します。よろしいですか？')) return;
  localStorage.removeItem(KEY); SPOTS=loadLocal(); state.pref='栃木県'; state.city='';
  backToList(); fillRegion(); render(); toast('サンプルデータに戻しました');
};

/* ---------- 管理者モード（雑な口コミを消す） ---------- */
const isAdmin=()=>localStorage.getItem(ADMINKEY)==='1';
function renderAdminBtn(){
  document.getElementById('btnAdmin').textContent=isAdmin()?'🔓 管理者モードを終了':'🔒 管理者モード';
}
document.getElementById('btnAdmin').onclick=()=>{
  if(isAdmin()){
    localStorage.removeItem(ADMINKEY); renderAdminBtn(); toast('管理者モードを終了しました');
    if(state.sel) selectSpot(state.sel,false);
    return;
  }
  const p=prompt('合言葉を入力してください');
  if(p===null) return;
  if(p!==ADMIN_PASS){ toast('違います'); return; }
  localStorage.setItem(ADMINKEY,'1'); renderAdminBtn(); toast('管理者モードにしました（口コミに削除ボタンが出ます）');
  if(state.sel) selectSpot(state.sel,false);
};
renderAdminBtn();
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ closeModal(); setTools(false); if(state.adding) setAdding(false); }
});

/* ---------- 共有DB(Supabase)の設定 ---------- */
function openCloudForm(){
  const cfg=cloudCfg()||{url:'',key:''};
  openModal(`<h2>共有データベースに接続</h2>
    <p class="lead">Supabase のプロジェクトURLと <b>anon public</b> キーを入れると、
    スポットと口コミが全員で共有されます。未設定ならこの端末内にだけ保存されます。<br>
    テーブルは同梱の <b>supabase-schema.sql</b> を Supabase の SQL Editor に貼って実行すると作れます。</p>
    <div class="field"><label for="su">Project URL</label><input id="su" value="${esc(cfg.url)}" placeholder="https://xxxx.supabase.co"></div>
    <div class="field"><label for="sk">anon public key</label><input id="sk" value="${esc(cfg.key)}" placeholder="eyJhbGciOi..."></div>
    <p class="hint">anonキーは公開前提の鍵なのでブラウザに置いて問題ありませんが、
    テーブルのRLS（行レベルセキュリティ）は必ず設定してください。schema.sqlに雛形が入っています。</p>
    <button class="btn" id="ssave">接続する</button>
    ${DB.mode==='cloud'?`<button class="btn ghost" id="sseed">初期データ ${SEED.length}件を共有DBに投入する</button>`:''}
    <button class="btn ghost" id="soff">接続を解除（端末内保存に戻す）</button>
    <button class="btn ghost" id="scancel">キャンセル</button>`);
  const sh=document.getElementById('sheet');
  sh.querySelector('#scancel').onclick=closeModal;
  sh.querySelector('#soff').onclick=()=>{ localStorage.removeItem(CKEY); location.reload(); };
  sh.querySelector('#ssave').onclick=()=>{
    const url=sh.querySelector('#su').value.trim().replace(/\/+$/,'');
    const key=sh.querySelector('#sk').value.trim();
    if(!/^https?:\/\//.test(url)||!key){ toast('URLとキーを両方入力してください'); return; }
    localStorage.setItem(CKEY,JSON.stringify({url,key})); location.reload();
  };
  const sd=sh.querySelector('#sseed');
  if(sd) sd.onclick=async()=>{
    if(!confirm(`初期データ${SEED.length}件を共有DBに投入します。よろしいですか？`)) return;
    sd.disabled=true; sd.textContent='投入中…';
    try{ const n=await DB.seed(); SPOTS=await DB.list(); closeModal(); fillRegion(); render(); toast(`${n}件を投入しました`); }
    catch(e){ sd.disabled=false; sd.textContent=`初期データ ${SEED.length}件を共有DBに投入する`; toast('投入に失敗: '+(e.message||e)); }
  };
}
document.getElementById('btnCloud').onclick=openCloudForm;
document.getElementById('dbstat').onclick=openCloudForm;

/* ---------- Google情報（Places API）の設定 ----------
   静的サイトなのでサーバー側からは呼べない。ブラウザ内で動く
   Places JavaScript ライブラリ経由で使うので、キーはHTTPリファラー制限で守る。
   自動では叩かず、スポット詳細で「Googleで確認」を押したときだけ呼ぶ
   （費用を利用者の関心の分だけに抑えるため）。 */
const GPKEY='tsm.placeskey';
let placesLibPromise=null;
/* google.maps.places.PlacesService は2025年3月以降の新規キーでは使えないため、
   新しい google.maps.places.Place（importLibrary経由）を使う。 */
function loadPlacesLib(key){
  if(placesLibPromise) return placesLibPromise;
  const ready=()=>window.google&&google.maps&&google.maps.places&&google.maps.places.Place;
  placesLibPromise=new Promise((res,rej)=>{
    if(ready()){ res(); return; }
    const s=document.createElement('script');
    s.src=`https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(key)}&libraries=places`;
    s.onerror=()=>rej(new Error('Places APIの読み込みに失敗しました'));
    // scriptのonloadが発火しても google.maps.places.Place の初期化が
    // 追いついていないことがある（google.maps.importLibrary はここでは使えない）ので、
    // 短い間隔でポーリングして本当に使える状態になるまで待つ。
    s.onload=()=>{
      let tries=0;
      const poll=()=>{
        if(ready()) return res();
        if(++tries>100) return rej(new Error('Places APIの初期化がタイムアウトしました'));
        setTimeout(poll,50);
      };
      poll();
    };
    document.head.appendChild(s);
  });
  return placesLibPromise;
}
function openPlacesForm(){
  const key=localStorage.getItem(GPKEY)||'';
  openModal(`<h2>Google情報の設定</h2>
    <p class="lead">Places API のキーを入れると、スポット詳細に「Googleで営業時間・評価を確認」ボタンが出ます。
    未設定でも他の機能は変わりません。</p>
    <div class="field"><label for="pk">APIキー（Places API・HTTPリファラー制限推奨）</label>
      <input id="pk" value="${esc(key)}" placeholder="AIza..."></div>
    <p class="hint">キーはこのブラウザの localStorage にだけ保存されます。呼び出しはボタンを押した時だけ発生し、
    自動では叩きません。1回の呼び出しは無料枠内に収まる金額です。</p>
    <button class="btn" id="pksave">保存する</button>
    <button class="btn ghost" id="pkoff">解除する</button>
    <button class="btn ghost" id="pkcancel">キャンセル</button>`);
  const sh=document.getElementById('sheet');
  sh.querySelector('#pkcancel').onclick=closeModal;
  sh.querySelector('#pkoff').onclick=()=>{ localStorage.removeItem(GPKEY); closeModal(); toast('Google情報の設定を解除しました'); };
  sh.querySelector('#pksave').onclick=()=>{
    const v=sh.querySelector('#pk').value.trim();
    if(!v){ toast('キーを入力してください'); return; }
    localStorage.setItem(GPKEY,v); closeModal(); toast('保存しました');
  };
}
document.getElementById('btnPlaces').onclick=openPlacesForm;

/* スポット名＋住所でGoogle検索し、営業時間・評価を取ってくる。
   新しい Place API（Text Search）を使う。1回のボタン操作で1回だけ呼ぶ。 */
async function fetchGooglePlace(sp){
  const key=localStorage.getItem(GPKEY);
  if(!key){ openPlacesForm(); return; }
  const box=document.getElementById('gplace');
  if(!box) return;
  box.innerHTML='<p class="hint">Googleで確認中…</p>';
  try{
    await loadPlacesLib(key);
    const { Place }=google.maps.places;
    const { places }=await Place.searchByText({
      textQuery:`${sp.name} ${sp.address||''}`,
      fields:['id','displayName','regularOpeningHours','rating','userRatingCount','businessStatus'],
      maxResultCount:1
    });
    if(!places||!places.length){
      box.innerHTML='<p class="hint">Googleで見つかりませんでした。名前や住所が公式と違う可能性があります。</p>';
      return;
    }
    const place=places[0];
    if(place.businessStatus==='CLOSED_PERMANENTLY'){
      box.innerHTML='<p class="hint">Googleでは「閉業」となっています。要確認。</p>'; return;
    }
    const hours=place.regularOpeningHours&&place.regularOpeningHours.weekdayDescriptions
      ? `<ul class="gphours">${place.regularOpeningHours.weekdayDescriptions.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`
      : '<p class="hint">営業時間の情報はありませんでした。</p>';
    const rating=place.rating
      ? `<p>★ ${place.rating}（${place.userRatingCount||0}件のGoogle評価）</p>` : '';
    box.innerHTML=`<div class="sect" style="margin-top:0"><h3>Googleでの情報</h3>${rating}${hours}
      <p class="hint">study-mapの8軸評価とは別の、Google側の情報です。実際と異なる場合があります。</p></div>`;
  }catch(e){
    box.innerHTML=`<p class="hint">読み込みに失敗: ${esc(e.message||e)}</p>`;
  }
}

/* ---------- 起動 ---------- */
(async function boot(){
  await DB.init();
  try{ SPOTS=await DB.list(); }
  catch(e){ DB.mode='local'; DB.err=e.message||String(e); SPOTS=loadLocal(); }
  if(DB.mode==='cloud'&&!SPOTS.length){
    toast('共有DBは空です。右上「☁ 共有DBの設定」からサンプルを投入できます');
  }
  renderDbStat();
  applyURLParams();
  fillRegion();
  bootMap();
  syncPageMeta();
})();
