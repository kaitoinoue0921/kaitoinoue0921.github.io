25年から8大問形式のため、大問番号だけで比較できません。"}]}],"questions":{"math1":[{"id":"m1-prob","topic":"場合の数と確率","prompt":"白玉3個と青玉2個の袋から、同時に2個を無作為に取り出す。少なくとも1個が青玉だったと分かった。2個とも青玉である確率は？","choices":["1/10","1/7","1/5","2/7"],"correct":1,"why":"色を無視した組合せは10通り。白2個の3通りを除くと、条件に合う7通りが残る。そのうち青2個は1通り。"},{"id":"m1-data","topic":"データの分析","prompt":"5人の点数は2、4、6、8、10点だった。最後の1人の点数が14点に訂正された。平均値と中央値はどう変わる？","choices":["平均値も中央値も0.8点上がる","平均値は変わらず、中央値は4点上がる","平均値は0.8点上がり、中央値は変わらない","平均値は4点上がり、中央値は変わらない"],"correct":2,"why":"合計が4増えるので、平均値は4÷5＝0.8点上がる。小さい順の3番目はどちらも6点で、中央値は変わらない。"},{"id":"m1-quad","topic":"二次関数","prompt":"y = x² − 4x + 5 の 3 ≤ x ≤ 5 における最小値は？","choices":["1","9","5","2"],"correct":3,"why":"y=(x−2)²+1。頂点の x=2 は定義域の外。区間内で頂点に最も近い x=3 で最小値2。"},{"id":"m1-geometry","topic":"図形の性質","prompt":"三角形ABCで AB=8、AC=6、BC=7。角Aの二等分線と辺BCの交点をDとすると、BDの長さは？","choices":["3","3.5","4","4.5"],"correct":2,"why":"内角の二等分線より BD:DC=AB:AC=8:6=4:3。BCは7なので BD=4。"}],"math2":[{"id":"m2-seq","topic":"数列","prompt":"a₁=1、aₙ₊₁−aₙ=2n+1 とする。a₄はいくつ？","choices":["13","15","16","25"],"correct":2,"why":"a₄=a₁+(a₂−a₁)+(a₃−a₂)+(a₄−a₃)=1+3+5+7=16。階差を aₙ の項数より1個少なく足す。"},{"id":"m2-calc","topic":"微分・積分","prompt":"曲線 y=x² の点 (2,4) における接線は、x軸とどこで交わる？","choices":["x=1","x=0","x=2","x=4"],"correct":0,"why":"傾きは y′=2x に x=2 を代入して4。接線は y−4=4(x−2)、つまり y=4x−4。y=0 を代入すると x=1。"},{"id":"m2-vector","topic":"ベクトル","prompt":"a=(2,1)、b=(−1,3) のとき、内積 a・b と、2つのベクトルのなす角は？","choices":["内積 −1、鈍角","内積 0、直角","内積 1、鈍角","内積 1、鋭角"],"correct":3,"why":"内積は2×(−1)+1×3=1。ベクトルの長さはどちらも正なので、内積が正なら cosθ>0、なす角は鋭角。"},{"id":"m2-stats","topic":"統計的な推測","prompt":"母平均に変化がないという帰無仮説を、有意水準5%で検定した。この仮説が正しいときでも起こりうるのは？","choices":["5%以下の割合で帰無仮説を誤って棄却する","帰無仮説は必ず棄却される","帰無仮説を棄却したら変化の大きさが5%と分かる","実際に変化があると検定の誤りは必ず0になる"],"correct":0,"why":"有意水準は、帰無仮説が正しいときに誤って棄却する確率の上限。効果の大きさや、変化があるときの見落とし率を表す数字ではない。"}],"biology":[{"id":"bio-gel","topic":"遺伝子を扱う技術","prompt":"試料AとBのDNA断片を同じ条件で電気泳動したところ、同じ位置にバンドがあった。この結果だけから最も妥当なのは？","choices":["断片の塩基配列が一致する","断片の長さが同程度と考えられる","断片を含む細胞の種類が一致する","もとのDNA全体の長さが一致する"],"correct":1,"why":"同じ条件で似た距離を移動したことは、断片の長さが同程度という根拠になる。位置だけでは塩基配列の一致は判断できない。"},{"id":"bio-control","topic":"実験資料","prompt":"光が植物の成長量に与える影響を調べたい。明るい区と暗い区を比べるとき、比較を最も妥当にする方法は？","choices":["明るい区の株だけ肥料を増やす","明るい区の温度だけ上げる","成長した株だけを後から選ぶ","同じ品種の株を両区に割り当て、光以外の条件をそろえる"],"correct":3,"why":"光の効果と他の要因を分けるには、比較する区の違いを光に絞る。光と肥料や温度を同時に変えると、どの要因の影響か区別できない。"},{"id":"bio-eco","topic":"生態系","prompt":"池の生態系で、分解者が有機物を分解する。炭素の一部はどのように循環へ戻る？","choices":["呼吸によって二酸化炭素として放出される","すべて酸素になる","無機窒素だけに変わる","分解者の体に永久に蓄積される"],"correct":0,"why":"分解者は有機物を利用し、呼吸によって炭素の一部を二酸化炭素として放出する。二酸化炭素は光合成で再び有機物に取り込まれうる。"},{"id":"bio-pop","topic":"進化・集団","prompt":"ある遺伝子座に対立遺伝子A、aがある。aの頻度が0.20で、集団がハーディ・ワインベルグ平衡にあるとき、aaの割合は？","choices":["4%","16%","20%","40%"],"correct":0,"why":"aを2個もつ割合は q²。0.20×0.20=0.04で4%。Aaの割合は2pqなので区別する。"}],"chemistry":[{"id":"chem-acid","topic":"酸塩基","prompt":"濃度不明の水酸化ナトリウム水溶液10.0 mLを中和するのに、0.100 mol/Lの塩酸が12.0 mL必要だった。水酸化ナトリウムの濃度は？","choices":["0.0833 mol/L","0.100 mol/L","0.120 mol/L","1.20 mol/L"],"correct":2,"why":"HClとNaOHは1:1。HClは0.100×0.0120=0.00120 mol。10.0 mL=0.0100 Lだから、NaOHは0.120 mol/L。"},{"id":"chem-eq","topic":"化学平衡","prompt":"A(g) ⇄ B(g) の正反応が発熱反応である。一定体積で温度を上げ、再び平衡に達したとき、Bの割合はどう変わる？","choices":["増える","減る","変わらない","AとBの初期量だけで決まる"],"correct":1,"why":"温度を上げると吸熱方向が有利。正反応が発熱なら、吸熱方向は B → A。したがってBの割合は減る。"},{"id":"chem-redox","topic":"酸化還元","prompt":"Fe²⁺ 0.020 molをすべてFe³⁺に酸化する。酸化剤1 molが電子5 molを受け取るとき、必要な酸化剤は？","choices":["0.0040 mol","0.010 mol","0.020 mol","0.100 mol"],"correct":0,"why":"Fe²⁺ 1 molがFe³⁺になると電子1 molを出す。電子0.020 molを受け取る酸化剤は0.020÷5=0.0040 mol。"},{"id":"chem-organic","topic":"有機の構造・反応","prompt":"次のうち、構造にカルボキシ基 −COOH を持つのはどれか？","choices":["CH₃CH₂OH","CH₃CHO","CH₃COOCH₃","CH₃COOH"],"correct":3,"why":"−COOH は同じ炭素に C=O と −OH が結合した構造。CH₃COOCH₃ はエステルで、末端が −OCH₃ になっている。"}],"physics":[{"id":"phy-graph","topic":"グラフ","prompt":"台車が同じ向きに走り、速さが2.0秒で1.0 m/sから5.0 m/sになった。加速度が一定なら、進行方向を正とした加速度は？","choices":["0.50 m/s²","2.0 m/s²","2.5 m/s²","4.0 m/s²"],"correct":1,"why":"v–t グラフの傾きは速度の増分÷時間。ここでは (5.0−1.0)÷2.0=2.0 m/s²。"},{"id":"phy-heat","topic":"熱","prompt":"12 V、2.0 Aのヒーターを60秒使い、電気エネルギーがすべて水に伝わる。水が受け取る熱量は？","choices":["24 J","360 J","1,440 J","2,880 J"],"correct":2,"why":"電力は VI=24 W。1 W=1 J/s なので、60秒で24×60=1,440 J。"},{"id":"phy-wave","topic":"波","prompt":"ばねの長さ方向に押し引きすると、疎密がばねに沿って進む。コイルの振動方向と、波の進む方向の関係は？","choices":["平行","垂直","常に45°","コイルは振動しない"],"correct":0,"why":"疎密波は縦波。ばねのコイルは局所的に前後へ振動し、疎密の形が同じ直線に沿って移動する。"},{"id":"phy-energy","topic":"力学","prompt":"摩擦のない同じ斜面を、質量mと2mの物体が同じ高さから静かに滑る。斜面の同じ地点に着いたとき、2mの物体の速さはmの物体の何倍？","choices":["1倍","√2倍","2倍","4倍"],"correct":0,"why":"失う位置エネルギーと得る運動エネルギーはどちらも質量に比例する。mgh=mv²/2 の両辺から m が消える。"}],"english":[{"id":"eng-info","topic":"条件照合","passage":"Library workshops\nTue 16:00 · Reading Skills · Room 3\nWed 16:00 · Essay Planning · online\nThu 17:00 · Reading Skills · online\nMessage: I can join only online, and I want to improve my reading.","prompt":"Which workshop should the sender choose?","choices":["Tuesday at 16:00","Wednesday at 16:00","Thursday at 17:00","Any workshop"],"correct":2,"why":"online と reading の両条件を満たすのは Thursday at 17:00。曜日・内容・参加形態を別々に照合する。"},{"id":"eng-order","topic":"物語・時系列","passage":"Maya called the café after she got home. She had taken a bus from the museum. While she was waiting for the bus, she noticed that her umbrella was missing.","prompt":"What happened first?","choices":["Maya got home.","Maya called the café.","Maya took a bus.","Maya noticed the umbrella was missing."],"correct":3,"why":"文章に書かれた順番と出来事の順番は別。while she was waiting for the bus はバスに乗る前なので、傘がないと気づいたのが選択肢の中で最初。"},{"id":"eng-evidence","topic":"事実と意見","passage":"A school moved its lunch break from 12:00 to 12:30. The cafeteria counted 120 visitors before the change and 150 after it, using the same one-day method each time. A student said the new time was perfect.","prompt":"Which conclusion is directly supported?","choices":["The cafeteria counted more visitors on the measured day after the change.","The new time was perfect for every student.","The change caused the increase.","The cafeteria had more visitors on every day after the change."],"correct":0,"why":"直接比較できるのは測定した各1日、120人と150人。全員への評価、毎日の傾向、変更の因果効果はこの記述だけでは確定できない。"},{"id":"eng-sources","topic":"複数資料","passage":"Bus timetable\nA: departs 9:20, arrives 9:50\nB: departs 9:35, arrives 10:05\nC: departs 9:45, arrives 10:20\nMuseum notice: Your group must arrive by 10:00.\nMessage: We cannot reach the bus stop before 9:25.","prompt":"What should the group conclude?","choices":["Take bus A.","Take bus B.","Take bus C.","None of the listed buses meets both constraints."],"correct":3,"why":"Aは9:25より前に出発。BとCは10:00を過ぎて到着する。出発時刻と到着期限は別の資料を組み合わせて確かめる。"}]}}</script>
<script>
const {subjects, questions} = JSON.parse(document.getElementById('study-data').textContent);
const all = subjects.flatMap(subject => questions[subject.id].map(q => ({...q, subjectId:subject.id, subject:subject.name})));
const byId = new Map(all.map(q => [q.id,q]));
const bySubject = new Map(subjects.map(s => [s.id,s]));
const storageKey = 'kyotsu-study-v1';
const starterSubjects = ['math1','biology','chemistry','math2'];
const state = {results:{}, active:null, latest:null, subject:'math1'};
try {
  const saved = JSON.parse(localStorage.getItem(storageKey) || '{}');
  if (saved.results && typeof saved.results === 'object') state.results = saved.results;
  if (saved.active?.ids?.every(id => byId.has(id)) && saved.active.index < saved.active.ids.length) state.active = saved.active;
  if (saved.latest?.ids?.every(id => byId.has(id))) state.latest = saved.latest;
  if (bySubject.has(saved.subject)) state.subject = saved.subject;
} catch {
  // The site remains usable when local browser storage is unavailable.
}
function save() {
  try { localStorage.setItem(storageKey,JSON.stringify(state)); } catch {}
}
const viewIds = ['overview','analysis','review','practice'];
let currentView = 'overview';
const find = id => document.getElementById(id);
const e = text => String(text ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
function link(url, label) {
  if (!url || !['www.dnc.ac.jp','www.dnc.ac.jp:443'].includes(new URL(url).host)) return '';
  return '<a href="' + e(url) + '">' + e(label) + '</a>';
}
function dueIds() {
  return all.filter(q => state.results[q.id]?.review).map(q => q.id);
}
function show(view, focus = false) {
  currentView = view;
  viewIds.forEach(id => {find(id).hidden = id !== view;});
  document.querySelectorAll('nav [data-tab]').forEach(button => {
    const target = view === 'practice' ? (state.active?.mode === 'review' ? 'review' : 'overview') : view;
    if (button.dataset.tab === target) button.setAttribute('aria-current','page');
    else button.removeAttribute('aria-current');
  });
  if (view === 'overview') renderOverview();
  if (view === 'analysis') renderAnalysis();
  if (view === 'review') renderReview();
  if (view === 'practice') renderPractice();
  if (focus) {
    const heading = find(view).querySelector('h1,h2');
    if (heading) {
      heading.setAttribute('tabindex','-1');
      heading.focus({preventScroll:true});
    }
    window.scrollTo({top:0,behavior:'instant'});
  }
}
function launch(mode, ids, title) {
  if (!ids.length) return;
  state.active = {mode, ids, title, index:0, selected:null, locked:false, answers:[]};
  save();
  show('practice',true);
}
function renderOverview() {
  find('solved').textContent = all.filter(q => state.results[q.id]?.attempts).length + ' / ' + all.length;
  find('due').textContent = dueIds().length + '問';
  find('start-mixed').textContent = state.active ? '前の続きから' : '4問をはじめる';
  find('subjects').innerHTML = subjects.map(s => {
    const count = questions[s.id].length;
    const solved = questions[s.id].filter(q => state.results[q.id]?.attempts).length;
    return '<button class="subject" data-subject="' + e(s.id) + '" aria-label="' + e(s.name) + 'を解く"><span class="subject-name">' + e(s.name) + '</span><span class="label">' + (solved ? '回答 ' + solved + ' / ' + count + '問' : count + '問') + '</span><span class="subject-arrow" aria-hidden="true">›</span></button>';
  }).join('');
}
function renderReview() {
  const list = dueIds();
  const box = find('review-box');
  if (!list.length) {
    box.innerHTML = '<p>復習待ちの問題はありません。</p><button class="quiet below" data-tab="overview">演習に戻る →</button>';
    return;
  }
  box.innerHTML = '<h2>' + list.length + '問</h2><ul class="results-list">' + list.map(id => {
    const q = byId.get(id);
    return '<li><span>' + e(q.subject) + '</span><span>' + e(q.topic) + '</span></li>';
  }).join('') + '</ul><button class="primary" data-start-review>復習をはじめる</button>';
}
function scoreBar(done,total) {
  return '<div class="progress-track" role="progressbar" aria-label="解いた問題" aria-valuenow="' + done + '" aria-valuemin="0" aria-valuemax="' + total + '"><span style="width:' + (done / total * 100) + '%"></span></div>';
}
function renderPractice() {
  const panel = find('practice');
  const run = state.active;
  if (!run) {
    const latest = state.latest;
    if (!latest) { show('overview'); return; }
    const score = latest.answers.filter(a => a.right).length;
    const missed = latest.answers.filter(a => !a.right);
    panel.innerHTML = '<article class="pane result"><h1>演習結果</h1><p><strong>' + score + ' / ' + latest.ids.length + '</strong> 問正解</p>' +
      (missed.length ? '<h2>解き直すテーマ</h2><ul class="results-list">' + missed.map(a => {
        const q = byId.get(a.id);
        return '<li><span>' + e(q.subject) + '</span><span>' + e(q.topic) + '</span></li>';
      }).join('') + '</ul>' : '<p class="muted">今回のセットは全問正解です。</p>') +
      '<div class="actions">' + (dueIds().length ? '<button class="primary" data-start-review>間違えた問題を復習</button>' : '') +
      '<button class="secondary" data-tab="overview">科目選択に戻る</button></div></article>';
    return;
  }
  const q = byId.get(run.ids[run.index]);
  const mode = run.mode === 'review' ? '復習' : run.title;
  const result = run.locked ? run.selected === q.correct : null;
  const guidance = q.passage ? '<p class="passage" lang="en">' + e(q.passage) + '</p>' : '';
  const choices = q.choices.map((choice,i) => {
    const mark = run.locked ? (i === q.correct ? 'right' : run.selected === i ? 'wrong' : '') : '';
    return '<button class="option" data-answer="' + i + '" aria-pressed="' + (run.selected === i) +
      '"' + (mark ? ' data-mark="' + mark + '"' : '') + (run.locked ? ' disabled' : '') + '>' + e(choice) + '</button>';
  }).join('');
  panel.innerHTML = '<article class="pane question"><div class="qhead"><span>' + e(mode) + ' · ' + (run.index+1) + ' / ' + run.ids.length + '</span>' +
    scoreBar(run.index + Number(run.locked),run.ids.length) + '</div><p class="muted fine">' + e(q.subject) + ' ／ ' + e(q.topic) + '</p><h1 class="prompt">' + e(q.prompt) +
    '</h1>' + guidance + '<div class="options" role="group" aria-label="選択肢">' + choices + '</div>' +
    (run.locked ? '<div class="explain" id="explanation" tabindex="-1" data-correct="' + result + '" aria-live="polite"><strong>' + (result ? '正解' : '正解は「' + e(q.choices[q.correct]) + '」') + '</strong><p>' + e(q.why) + '</p></div>' : '') +
    '<div class="actions">' + (run.locked ? '<button class="primary" data-next>' + (run.index+1 === run.ids.length ? '結果を見る' : '次の問題') + '</button>'
      : '<button class="primary" data-check' + (run.selected === null ? ' disabled' : '') + '>採点する</button>') +
    '<button class="secondary" data-tab="overview">あとで続きを解く</button></div></article>';
}
function selectAnswer(index) {
  const run = state.active;
  if (!run || run.locked) return;
  run.selected = index;
  save();
  renderPractice();
  find('practice').querySelector('[data-answer="' + index + '"]').focus();
}
function checkAnswer() {
  const run = state.active;
  if (!run || run.locked || run.selected === null) return;
  const id = run.ids[run.index];
  const correct = run.selected === byId.get(id).correct;
  const was = state.results[id] || {};
  run.locked = true;
  run.answers.push({id,right:correct});
  state.results[id] = {attempts:(was.attempts || 0) + 1, last:correct, review:!correct || (run.mode !== 'review' && !!was.review)};
  save();
  renderPractice();
  find('explanation').focus();
}
function next() {
  const run = state.active;
  if (!run?.locked) return;
  if (run.index + 1 === run.ids.length) {
    state.latest = run;
    state.active = null;
  } else {
    run.index++;
    run.selected = null;
    run.locked = false;
  }
  save();
  show('practice',true);
}
function trends(subject) {
  const records = new Map();
  subject.years.forEach(y => y.modules.forEach(module => {
    if (module.exclude) return;
    for (const tag of new Set(module.tags)) {
      if (!records.has(tag)) records.set(tag,{tag, years:new Set(), count:0});
      const item = records.get(tag);
      item.years.add(y.year);
      item.count++;
    }
  }));
  return Array.from(records.values()).sort((a,b) =>
    b.years.size - a.years.size || b.count - a.count || a.tag.localeCompare(b.tag,'ja'));
}
function renderAnalysis() {
  const subject = bySubject.get(state.subject);
  find('analysis-subject').value = subject.id;
  const top = trends(subject);
  const years = [...subject.years].reverse();
  const rows = top.map(item => '<tr><td>' + e(item.tag) + '</td><td>' + [...item.years].sort().join('・') +
    '</td><td>' + item.years.size + '年</td><td>' + item.count + '</td></tr>');
  const study = questions[subject.id].map(q => {
    const trend = top.find(item => item.tag === q.topic);
    return '<div class="trend"><strong>' + e(q.topic) + '</strong><span class="muted fine">' +
      (trend ? trend.years.size + ' / ' + years.length + '年で出題' : '関連テーマの補習') + '</span></div>';
  }).join('');
  const list = years.map(year => '<details><summary>' + year.year + '年 · ' + year.modules.filter(m => !m.exclude).length +
    '大問</summary>' + (year.note ? '<p class="micro">' + e(year.note) + '</p>' : '') +
    '<div class="year-links">' + link(year.examUrl,'本試験PDF') + link(year.analysisUrl,'公式分析PDF') + link(year.scoreUrl,'公式得点データ') + '</div>' +
    year.modules.map(m => '<div class="module"><b>第' + m.no + '問 ' + e(m.topic) + '</b>' +
      '<p class="fine muted">' + e(m.skill) + '</p><p class="micro">' +
      (m.exclude ? '旧課程の代替問題 · 集計外' : m.optional ? '選択問題' : '必答') +
      (Number.isFinite(m.scoreRate) ? ' · 全国得点率 ' + m.scoreRate.toFixed(2) + '%' : '') + '</p></div>').join('') + '</details>').join('');
  find('analysis-content').innerHTML = '<div class="analysis-grid"><article class="pane analysis-pane"><h2>2027年向けに練習する型</h2>' +
    study + '<div class="actions"><button class="primary" data-subject="' + e(subject.id) + '">この科目を解く</button></div>' +
    (subject.id === 'physics' && location.protocol !== 'file:' ? '<p class="below"><a href="/works/physics-notes/items/">手元で公式を確認する</a></p>' : '') + '</article>' +
    '<article class="pane analysis-pane"><h2>よく出たテーマ</h2><table class="counts"><thead><tr><th scope="col">テーマ</th><th scope="col">出題年</th><th scope="col">年数</th><th scope="col">大問数</th></tr></thead><tbody>' +
    rows.slice(0,6).join('') + '</tbody></table><details class="analysis-guide"><summary class="fine">すべてのテーマを見る</summary><table class="counts"><thead><tr><th scope="col">テーマ</th><th scope="col">出題年</th><th scope="col">年数</th><th scope="col">大問数</th></tr></thead><tbody>' +
    rows.join('') + '</tbody></table></details></article></div>' +
    '<article class="pane analysis-pane below"><h2>年度別の記録</h2><div class="years">' + list + '</div>' +
    '<details class="analysis-guide"><summary>集計方法</summary><p class="fine muted">本試験のみ。大問に複数のテーマを付け、同じ大問内の同一テーマは1回。選択問題は出題されたテーマとして数え、旧課程の代替問題は除外。課程・出題形式が変わった年は年度欄に記載。全国得点率は公式の平均得点を配点で割った値。年数は観測した回数で、2027年の出題確率ではありません。</p></details></article>';
}
document.addEventListener('click', event => {
  const button = event.target.closest('button');
  if (!button) return;
  if (button.dataset.tab) show(button.dataset.tab,true);
  else if (button.id === 'start-mixed') {
    if (state.active) show('practice',true);
    else launch('mix',starterSubjects.map(id => {
      const set = questions[id];
      return (set.find(q => !state.results[q.id]?.attempts) || set[0]).id;
    }),'4科目セット');
  } else if (button.dataset.subject) {
    const id = button.dataset.subject;
    launch('subject',questions[id].map(q => q.id),bySubject.get(id).name);
  } else if ('startReview' in button.dataset) launch('review',dueIds(),'復習');
  else if ('answer' in button.dataset) selectAnswer(Number(button.dataset.answer));
  else if ('check' in button.dataset) checkAnswer();
  else if ('next' in button.dataset) next();
});
find('analysis-subject').innerHTML = subjects.map(s => '<option value="' + e(s.id) + '">' + e(s.name) + '</option>').join('');
find('analysis-subject').addEventListener('change', event => {
  state.subject = event.target.value;
  save();
  renderAnalysis();
});
const initialSubject = new URLSearchParams(location.search).get('subject');
if (bySubject.has(initialSubject)) {
  state.subject = initialSubject;
  show('analysis');
} else {
  show('overview');
}

</script>
