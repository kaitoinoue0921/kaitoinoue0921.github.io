<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>先生用ビュー — 東大理三 数学マップ</title>
<meta name="robots" content="noindex">
<style>
  :root{ --bg:#0f1115; --panel:#171a21; --panel2:#1d212a; --line:#2a2f3a;
         --fg:#e6e9ef; --dim:#98a0b0; --accent:#6ea8fe; --ok:#4ec9a0; --warn:#e0b34a; --hot:#e8705f; --gold:#e5c76b; }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f6f7f9; --panel:#fff; --panel2:#f0f2f5; --line:#dde1e8;
           --fg:#1a1d23; --dim:#5c6472; --accent:#2b6cd4; --ok:#1a9e78; --warn:#a97b12; --hot:#c94a38; --gold:#b8860b; } }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-size:14px;line-height:1.75;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
  header{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 20px}
  h1{font-size:16px;margin:0}
  .sub{font-size:12.5px;color:var(--dim);margin-top:3px}
  main{max-width:1200px;margin:0 auto;padding:20px}
  .drop{border:2px dashed var(--line);border-radius:12px;padding:34px 20px;text-align:center;
    background:var(--panel);margin-bottom:20px;transition:.15s}
  .drop.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--panel))}
  .drop b{font-size:15px}
  .drop p{color:var(--dim);font-size:13px;margin:8px 0 0}
  .btn{background:var(--accent);color:#fff;border:none;border-radius:7px;padding:10px 20px;
    cursor:pointer;font-size:13.5px;font-family:inherit;font-weight:600;margin-top:14px}
  .btn.sec{background:var(--panel2);color:var(--fg);border:1px solid var(--line)}
  table{border-collapse:collapse;width:100%;font-size:13px;background:var(--panel)}
  th,td{border:1px solid var(--line);padding:9px 11px;text-align:left;vertical-align:top}
  th{background:var(--panel2);font-size:12px;white-space:nowrap;position:sticky;top:0}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  .bar{height:7px;background:var(--panel2);border-radius:4px;overflow:hidden;min-width:80px}
  .bar>i{display:block;height:100%}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:12px}
  .card h3{font-size:15px;margin:0 0 4px}
  .meta{font-size:12px;color:var(--dim);margin-bottom:10px}
  .tags span{display:inline-block;background:var(--panel2);border:1px solid var(--line);
    border-radius:5px;padding:2px 8px;margin:2px 4px 2px 0;font-size:12px}
  .tags span.hot{border-color:var(--hot);color:var(--hot)}
  .tags span.warn{border-color:var(--warn);color:var(--warn)}
  h2{font-size:17px;margin:26px 0 10px}
  .note{background:color-mix(in srgb,var(--ok) 9%,var(--panel));border:1px solid var(--ok);
    border-radius:10px;padding:14px 18px;font-size:13px;line-height:1.85;margin-bottom:20px}
  .empty{color:var(--dim);text-align:center;padding:36px}
  .wrap{overflow-x:auto}
</style>
</head>
<body>
<header>
  <h1>先生用ビュー — 東大理三 数学マップ</h1>
  <div class="sub">生徒が書き出した進捗ファイルを読み込んで、並べて比べます</div>
</header>
<main>
  <div class="note">
    <b>データはこの端末から出ません。</b>読み込んだファイルはブラウザの中だけで処理され、
    どこにも送信されず、保存もされません（ページを閉じれば消えます）。<br>
    生徒には、アプリのヘッダーにある「進捗を書き出す」でファイルを保存し、それを送ってもらってください。
  </div>

  <div class="drop" id="drop">
    <b>進捗ファイル（.json）をここにドラッグ</b>
    <p>複数まとめて読み込めます。生徒ごとに比較できます。</p>
    <button class="btn" id="pick">ファイルを選ぶ</button>
    <input type="file" id="file" accept=".json,application/json" multiple style="display:none">
  </div>

  <div id="out"><div class="empty">まだ読み込んでいません</div></div>
</main>

<script>
const DATA = {"nodes":[{"id":"m1-expand","title":"展開・因数分解の型","unit":"数と式","level":1,"prereq":[],"todai":2,"cost":60,"why":"式変形の速度そのもの。ここが遅いと数III積分で毎回時間を失う","trap":"3文字対称式・複2次式の因数分解が反射で出ない","field":"数学I"},{"id":"m1-sym","title":"対称式・交代式","unit":"数と式","level":2,"prereq":["m1-expand"],"todai":3,"cost":60,"why":"解と係数の関係、整数問題、複素数平面すべての土台","trap":"基本対称式に還元する発想が出ない","field":"数学I"},{"id":"m1-real","title":"実数・絶対値・平方根の扱い","unit":"数と式","level":1,"prereq":[],"todai":2,"cost":50,"why":"絶対値の場合分けは全分野に出る。ここの雑さが減点の常連","trap":"√(x^2)=|x| を書かずに符号ミス","field":"数学I"},{"id":"m1-ineq1","title":"1次不等式・連立不等式","unit":"数と式","level":1,"prereq":["m1-real"],"todai":1,"cost":30,"why":"領域・場合分けの前提","trap":"","field":"数学I"},{"id":"m1-set","title":"集合と要素の個数","unit":"集合と命題","level":1,"prereq":[],"todai":2,"cost":40,"why":"包除原理は場合の数の中核","trap":"","field":"数学I"},{"id":"m1-logic","title":"必要条件・十分条件","unit":"集合と命題","level":2,"prereq":["m1-set"],"todai":5,"cost":60,"why":"東大の論証はここが読めているかを直接測ってくる。同値変形の意識が全て","trap":"「⇒」しか示さず同値を主張して失点","field":"数学I"},{"id":"m1-proof","title":"対偶・背理法","unit":"集合と命題","level":2,"prereq":["m1-logic"],"todai":4,"cost":60,"why":"整数・無理数の論証で必須","trap":"背理法の仮定を最後まで使い切らない","field":"数学I"},{"id":"m2f-quad-complete","title":"平方完成","unit":"2次関数","level":1,"prereq":["m1-expand"],"todai":3,"cost":30,"why":"最大最小・軌跡・2次形式の全ての入口","trap":"","field":"数学I"},{"id":"m2f-minmax","title":"2次関数の最大最小（区間・軸の場合分け）","unit":"2次関数","level":2,"prereq":["m2f-quad-complete"],"todai":4,"cost":90,"why":"「場合分けを漏れなく書く」訓練の最初の場。東大の答案はこの延長線上にある","trap":"軸と区間の位置関係を3通りに割る境界の扱い","field":"数学I"},{"id":"m2f-param-minmax","title":"文字定数入りの最大最小（逆に見る）","unit":"2次関数","level":3,"prereq":["m2f-minmax"],"todai":4,"cost":90,"why":"「変数と定数を入れ替えて眺める」東大頻出の視点の原型","trap":"誰を主役の変数と見るかを固定できない","field":"数学I"},{"id":"m2f-disc","title":"判別式と解の存在","unit":"2次関数","level":1,"prereq":["m2f-quad-complete"],"todai":3,"cost":40,"why":"実数条件を式に翻訳する基本手段","trap":"実数解条件を課し忘れる（軌跡・領域で致命傷）","field":"数学I"},{"id":"m2f-place","title":"解の配置問題","unit":"2次関数","level":3,"prereq":["m2f-disc","m2f-minmax"],"todai":4,"cost":90,"why":"判別式・軸・端点の値の3点セット。方程式の解の個数問題の原型","trap":"端点の値の符号だけで済ませて軸条件を落とす","field":"数学I"},{"id":"m2f-ineq2","title":"2次不等式と符号","unit":"2次関数","level":1,"prereq":["m2f-disc"],"todai":2,"cost":40,"why":"領域・定積分の符号処理の前提","trap":"","field":"数学I"},{"id":"m1-trigratio","title":"三角比の定義と拡張（0〜180°）","unit":"図形と計量","level":1,"prereq":[],"todai":2,"cost":50,"why":"三角関数・ベクトル内積・複素数平面のすべての根","trap":"単位円で定義し直せていない","field":"数学I"},{"id":"m1-sinlaw","title":"正弦定理・余弦定理","unit":"図形と計量","level":2,"prereq":["m1-trigratio"],"todai":3,"cost":60,"why":"図形量を式に落とす二大手段。使い分けの判断が本体","trap":"外接円半径Rを見落とす／余弦定理で角の候補を絞れない","field":"数学I"},{"id":"m1-area","title":"三角形の面積・内接円・外接円","unit":"図形と計量","level":2,"prereq":["m1-sinlaw"],"todai":3,"cost":60,"why":"図形の最大最小問題の計算基盤","trap":"","field":"数学I"},{"id":"m1-space-fig","title":"空間図形への三角比の応用","unit":"図形と計量","level":3,"prereq":["m1-area"],"todai":4,"cost":90,"why":"東大の空間図形は結局「適切な平面で切って三角比」。座標に頼れない問題の逃げ道","trap":"切断面を自分で選べない","field":"数学I"},{"id":"m1-data","title":"データの分析（平均・分散・相関）","unit":"データの分析","level":1,"prereq":[],"todai":0,"cost":60,"why":"共通テスト用。二次では実質出ない。ここに時間を使わない判断が重要","trap":"","field":"数学I"},{"id":"ma-count-basic","title":"数え上げの原則（和の法則・積の法則・辞書式）","unit":"場合の数","level":1,"prereq":["m1-set"],"todai":4,"cost":60,"why":"公式より先に「重複なく漏れなく数える枠組み」を持てるかどうか。東大の確率はここで決まる","trap":"いきなりC・Pに飛びついて数え落とす","field":"数学A"},{"id":"ma-perm","title":"順列・組合せ","unit":"場合の数","level":1,"prereq":["ma-count-basic"],"todai":3,"cost":60,"why":"道具。使い所を誤らないことが本体","trap":"区別する/しないの前提が曖昧","field":"数学A"},{"id":"ma-samekind","title":"同じものを含む順列・円順列・じゅず順列","unit":"場合の数","level":2,"prereq":["ma-perm"],"todai":3,"cost":60,"why":"「割る」操作の正当化（同値類で数える）を理解する場","trap":"回転・裏返しで割れない場合に機械的に割る","field":"数学A"},{"id":"ma-partition","title":"組分け・重複組合せ（仕切り）","unit":"場合の数","level":3,"prereq":["ma-samekind"],"todai":4,"cost":90,"why":"整数解の個数、多項式の係数、確率の分母すべてに顔を出す","trap":"組に区別があるかで割り方が変わる点","field":"数学A"},{"id":"ma-incl","title":"包除原理・余事象で数える","unit":"場合の数","level":3,"prereq":["ma-partition"],"todai":4,"cost":60,"why":"「直接数えない」判断。完全順列や東大の色分け問題の主武器","trap":"3つ以上の集合で符号を間違える","field":"数学A"},{"id":"ma-prob-def","title":"確率の定義（同様に確からしい・根元事象の設定）","unit":"確率","level":2,"prereq":["ma-count-basic"],"todai":5,"cost":60,"why":"東大の確率で落ちる人の9割はここ。「区別のないものを区別して数える」原則を体で理解する","trap":"同じ色の玉を区別せずに数えて分母を壊す","field":"数学A"},{"id":"ma-prob-indep","title":"独立試行・反復試行","unit":"確率","level":2,"prereq":["ma-prob-def"],"todai":4,"cost":60,"why":"二項分布型の確率計算の基本形","trap":"","field":"数学A"},{"id":"ma-prob-cond","title":"条件付き確率・原因の確率","unit":"確率","level":3,"prereq":["ma-prob-indep"],"todai":4,"cost":90,"why":"状態を分けて考える発想の入口。漸化式の立式に直結する","trap":"分母にどの事象を置くかを取り違える","field":"数学A"},{"id":"ma-prob-rec","title":"確率漸化式","unit":"確率","level":4,"prereq":["ma-prob-cond","mb-rec-type"],"todai":5,"cost":180,"why":"東大理系で最頻出の型。n回目の状態を有限個に分類し、1手先で遷移を書く","trap":"状態の分類が粗い／遷移の漏れ／和が1になる検算をしない","field":"数学A"},{"id":"ma-prob-exp","title":"期待値","unit":"確率","level":3,"prereq":["ma-prob-indep"],"todai":4,"cost":90,"why":"線形性を使えば場合分けを回避できる。差がつく道具","trap":"独立でないのに線形性が使えないと思い込む（実は常に使える）","field":"数学A"},{"id":"ma-int-div","title":"約数・倍数・素因数分解","unit":"整数","level":1,"prereq":["m1-expand"],"todai":3,"cost":60,"why":"整数問題の語彙","trap":"","field":"数学A"},{"id":"ma-int-euclid","title":"ユークリッドの互除法・最大公約数","unit":"整数","level":2,"prereq":["ma-int-div"],"todai":4,"cost":60,"why":"gcdを動かす道具。連続整数の互いに素の議論で必ず使う","trap":"","field":"数学A"},{"id":"ma-int-dio","title":"1次不定方程式","unit":"整数","level":2,"prereq":["ma-int-euclid"],"todai":3,"cost":60,"why":"特殊解＋一般解の型","trap":"","field":"数学A"},{"id":"ma-int-mod","title":"合同式（mod）","unit":"整数","level":3,"prereq":["ma-int-euclid"],"todai":5,"cost":120,"why":"整数論証の共通言語。周期性・剰余での分類は東大整数の主戦場","trap":"mod を何で取るかを問題から読み取れない（末尾→mod 10、平方数→mod 3,4,8）","field":"数学A"},{"id":"ma-int-factor","title":"積の形に持ち込む（因数分解型の不定方程式）","unit":"整数","level":3,"prereq":["ma-int-div","m1-sym"],"todai":4,"cost":90,"why":"整数解を有限個に閉じ込める最有力手段","trap":"","field":"数学A"},{"id":"ma-int-bound" ment","td-symmetry"],"todai":5,"cost":120,"why":"東大は初見の設定を出すが、中身は必ず既習の型。設定を剥がして何の問題かを見抜く作業が本体","trap":"問題文の言葉のまま処理しようとする","field":"東大レイヤー"},{"id":"td-argument","title":"場合分けを漏らさない・同値性を保つ記述","unit":"メタ技能","level":4,"prereq":["m1-logic","m2f-minmax","m2-int-abs"],"todai":5,"cost":120,"why":"東大の採点は論理の飛躍に厳しい。合っている答えでも過程で落ちる","trap":"必要条件だけ出して十分性の確認を書かない","field":"東大レイヤー"},{"id":"td-writing","title":"減点されない答案の書き方","unit":"メタ技能","level":4,"prereq":["td-argument"],"todai":5,"cost":90,"why":"同じ実力で15〜25点変わる領域。図・宣言（〜とおく）・結論の明示の3点","trap":"計算だけが並び、何を求めているかが読み手に伝わらない","field":"東大レイヤー"},{"id":"td-calc","title":"計算の設計と検算（次数・単位・特殊値）","unit":"メタ技能","level":4,"prereq":["m3-int-sub","m3-area"],"todai":5,"cost":90,"why":"理三の失点の最大要因は難問ではなく計算ミス。検算の型を持っているかどうか","trap":"検算を『もう一度同じ計算をする』でやる（別の方法で確かめる）","field":"東大レイヤー"},{"id":"td-time","title":"150分の運用（大問の選択と撤退の判断）","unit":"メタ技能","level":5,"prereq":["td-calc","td-writing"],"todai":5,"cost":120,"why":"6問150分。全問完答は不要。解ける4問を確実に取り切る配分の設計","trap":"1問に40分溶かして他が白紙になる","field":"東大レイヤー"},{"id":"td-t-prob","title":"【東大型】確率の状態設計","unit":"出題テーマ","level":5,"prereq":["ma-prob-rec","td-experiment"],"todai":5,"cost":180,"why":"設定が複雑で、何を状態と見るかを自分で決めさせる。分類さえ決まれば計算は易しい","trap":"状態の個数を増やしすぎて漸化式が解けなくなる","field":"東大レイヤー"},{"id":"td-t-integer","title":"【東大型】整数の論証","unit":"出題テーマ","level":5,"prereq":["ma-int-mod","ma-int-bound","mb-induction"],"todai":5,"cost":180,"why":"合同式・因数分解・評価の3手段から選ぶ。証明として完結させる力を測ってくる","trap":"具体例で確認して終わりにし、一般の証明を書かない","field":"東大レイヤー"},{"id":"td-t-region","title":"【東大型】通過領域・存在条件","unit":"出題テーマ","level":5,"prereq":["m2-pass-region","m3-root-count3"],"todai":5,"cost":180,"why":"『あるtが存在してこの式を満たす点の集合』への読み替え。逆像法（yを固定してxの存在条件）が主武器","trap":"パラメータの範囲制約を落とし、余分な領域まで塗る","field":"東大レイヤー"},{"id":"td-t-volume","title":"【東大型】立体の体積","unit":"出題テーマ","level":5,"prereq":["m3-vol-cross","mc-vec-foot","td-symmetry"],"todai":5,"cost":240,"why":"毎年のように出る最大配点帯。切断面をどの向きで取るかの一択で難易度が変わる","trap":"立体を3次元で把握しようとして詰まる（断面の2次元問題に落とす）","field":"東大レイヤー"},{"id":"td-t-cplx","title":"【東大型】複素数平面と図形","unit":"出題テーマ","level":5,"prereq":["mc-cplx-locus","td-reduce"],"todai":4,"cost":150,"why":"回転・軌跡・n乗根。ベクトルや座標より圧倒的に短く書ける場面を見抜く","trap":"実部虚部に分解して計算が膨張する","field":"東大レイヤー"},{"id":"td-t-eval","title":"【東大型】評価と極限の融合","unit":"出題テーマ","level":5,"prereq":["m3-int-ineq","m3-int-recur","m3-mvt"],"todai":5,"cost":240,"why":"『(1)で不等式を示し (2)で極限を出す』という誘導の意味を読む。理三で差がつく最上位テーマ","trap":"(1)を飛ばして(2)を解こうとする（誘導は使うために置かれている）","field":"東大レイヤー"},{"id":"td-t-space","title":"【東大型】空間図形の最大最小","unit":"出題テーマ","level":5,"prereq":["mc-vec-foot","m3-diff-minmax","td-symmetry"],"todai":4,"cost":180,"why":"ベクトルで立式→1変数に落として微分、という長い一本道を最後まで走り切る体力","trap":"変数の取り方が悪く式が汚くなったまま突き進む","field":"東大レイヤー"},{"id":"td-t-func","title":"【東大型】関数の決定・不等式の成立条件","unit":"出題テーマ","level":5,"prereq":["m3-ineq-diff","m2-int-param","td-argument"],"todai":4,"cost":150,"why":"『すべてのxで成り立つ』『あるxで成り立つ』の違いを最小値・最大値に翻訳する","trap":"∀と∃の翻訳を取り違える","field":"東大レイヤー"},{"id":"td-goal","title":"理三の合格ライン（数学 6問中4完+α / 目安80〜100点）","unit":"到達点","level":5,"prereq":["td-time","td-t-prob","td-t-integer","td-t-region","td-t-volume","td-t-eval"],"todai":5,"cost":0,"why":"全問完答は不要。標準3問を落とさず、難問1問に手を伸ばせる状態が目標","trap":"満点を狙って全範囲を均一に固めようとし、時間切れになる","field":"東大レイヤー"}],"targetsFile":{"disclaimer":"偏差値は河合塾ボーダー帯のおおよその値（年度・予備校で変動する）。need は『二次数学で取りたい得点を100点満点に換算した目安』であり、公表値ではなく合格体験記・開示得点から逆算した推定値。毎年更新する前提でこのファイルに外出ししている。ここの数値の精度がアプリの信頼性そのものなので、実データが集まり次第 calibration で置き換える。","model":{"note":"数学の到達度から想定得点を出し、目標ラインとの差をロジスティック関数で確率に変換する。ただしこれは『他教科が志望校の合格者平均並みなら』という条件付き確率であり、合格確率そのものではない。UI に必ずこの条件を表示すること。","scoreFromMastery":"score = 100 * mastery^1.25（到達度がそのまま得点にはならない。難しい項目ほど得点への寄与が大きいため下に凸）","weight":"各項目の重み = todai * (cost/60)。todai=0 の項目（データの分析・統計的推測）は寄与しない","probability":"p = 1 / (1 + exp(-(score - need) / 8))","calibrationStatus":"未較正。合格者・不合格者の実データが溜まるまで、確率は参考値として扱い『到達度』を主表示にする"},"targets":[{"id":"todai-r3","name":"東京大学 理科三類","group":"最難関","dev":72.5,"need":78,"note":"6問150分で4完+部分点。数学が易しい年ほど落とせない"},{"id":"kyoto-med","name":"京都大学 医学部医学科","group":"最難関","dev":72.5,"need":75,"note":"6問180分。1問あたりの重さが東大より大きい"},{"id":"keio-med","name":"慶應義塾大学 医学部","group":"私立最難関","dev":72.5,"need":70,"note":"処理速度重視。数IIIの計算量が多い"},{"id":"osaka-med","name":"大阪大学 医学部医学科","group":"難関","dev":70,"need":72,"note":""},{"id":"science-tokyo-med","name":"東京科学大学 医学部医学科（旧 東京医科歯科）","group":"難関","dev":70,"need":70,"note":""},{"id":"kyudai-med","name":"旧帝大 医学部（北大・東北・名大・九大）","group":"難関","dev":67.5,"need":68,"note":""},{"id":"todai-r1","name":"東京大学 理科一類","group":"難関","dev":67.5,"need":65,"note":"理三と同じ問題。要求得点が13点ほど低い"},{"id":"todai-r2","name":"東京大学 理科二類","group":"難関","dev":67.5,"need":62,"note":""},{"id":"kokuritsu-med","name":"地方国公立大学 医学部医学科（標準）","group":"標準","dev":65,"need":60,"note":"共通テストの比重が高い大学が多く、数学の要求は東大理三より20点分低い"},{"id":"shiritsu-med","name":"私立大学 医学部（中位）","group":"標準","dev":62.5,"need":50,"note":"記述より処理速度と正確さ"}]},"pastexams":{"policy":{"why":"東大の出題は分野が均等に出るわけではなく、テーマに強い偏りと周期がある。年度×テーマの表を作れば『今年はどのテーマが来やすいか』『自分がまだ触れていない頻出テーマはどれか』が定量的に見える。","copyright":"入試問題の文章そのものには著作権がある（赤本は許諾を得て掲載している）。したがってここには問題文を載せない。載せるのは『何年の第何問が、どのテーマだったか』という分類の記録のみで、これは事実の記録であり分析の土台になる。","verification":"verified: true は出典で確認済みのもの。false は未確認。未確認のデータを根拠に判断すると危険なので、アプリ側では検証済みと未検証を明確に区別して表示する。","howToFill":"赤本や過去問集を開き、各大問がどのテーマかを選んで記録していく。25年×6問=150問だが、テーマを選ぶだけなので1問10秒、全部で30分程度で埋まる。埋まった瞬間から、頻度・周期・空白の分析が自動で出る。","source":"電送数学舎『東大数学 過去問ライブラリー／東大理系数学 出題分野』(https://densu.jp/table/ifrtokyo2.htm) の分野一覧を参照し、本アプリのテーマ体系に対応づけたもの","sourceNote":"分野の分類そのものは事実の記録であり、問題文や解答は一切収録していない。元の一覧表を作成された電送数学舎に敬意を表して出典を明記する。解答例は同サイトで公開されているので、実際に解くときはそちらを参照するのがよい。"},"themes":[{"id":"prob","name":"確率（状態設計・漸化式）","nodes":["ma-prob-rec","td-t-prob","ma-prob-def"]},{"id":"integer","name":"整数の論証","nodes":["ma-int-mod","ma-int-bound","td-t-integer"]},{"id":"region","name":"通過領域・存在条件","nodes":["m2-pass-region","td-t-region"]},{"id":"volume","name":"立体の体積","nodes":["m3-vol-cross","m3-vol-rot","td-t-volume"]},{"id":"area","name":"面積・曲線の長さ","nodes":["m3-area","m3-length"]},{"id":"eval","name":"評価と極 const N = DATA.nodes;
const byId = new Map(N.map(n => [n.id, n]));
const TG = DATA.targetsFile, PE = DATA.pastexams;
const DAY = 86400000;
const esc = s => String(s ?? '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

const wt = n => n.todai * (n.cost / 60);
const totW = N.reduce((a, n) => a + wt(n), 0);

function analyze(S, filename){
  const rec = S.rec || {};
  const ret = id => {
    const r = rec[id]; if (!r) return 0;
    return Math.pow(2, -((Date.now() - r.t) / DAY) / r.s);
  };
  const done = N.filter(n => rec[n.id]);
  const power = N.reduce((a, n) => a + wt(n) * ret(n.id), 0);
  const score = 100 * Math.pow(power / totW, 1.25);
  const fade = done.filter(n => ret(n.id) < 0.7);
  // 東大★5でまだ手をつけていないもの（優先度の高い順）
  const gaps = N.filter(n => n.todai === 5 && !rec[n.id])
    .sort((a, b) => wt(b) - wt(a));
  // 過去問テーマのうち、直近10年で頻出なのに未習得のもの
  const nowY = new Date().getFullYear();
  const themeGaps = (PE.themes || []).map(t => {
    const hit = (PE.exams || []).filter(e => e.themes.includes(t.id));
    const recent = hit.filter(e => e.year >= nowY - 10).length;
    const ns = t.nodes.filter(id => byId.has(id));
    const d = ns.filter(id => rec[id]).length;
    return { name: t.name, recent, done: d, total: ns.length, obsolete: t.obsolete };
  }).filter(t => !t.obsolete && t.recent >= 3 && t.total && t.done / t.total < 0.5)
    .sort((a, b) => b.recent - a.recent);

  const byField = {};
  for (const n of N){
    (byField[n.field] ??= { t: 0, d: 0 });
    byField[n.field].t++;
    if (rec[n.id]) byField[n.field].d++;
  }
  const lastSeen = Object.values(rec).map(r => r.t).sort((a,b) => b-a)[0] || null;
  return {
    name: S.name || filename.replace(/\.json$/,''),
    done: done.length, total: N.length, power, score,
    level: Math.floor(Math.sqrt((S.exp||0)/40)) + 1, exp: S.exp || 0,
    fade: fade.length, gaps, themeGaps, byField, lastSeen,
    placed: !!S.placed, exams: (S.exams||[]).length
  };
}

const students = [];

function render(){
  const out = document.getElementById('out');
  if (!students.length){ out.innerHTML = '<div class="empty">まだ読み込んでいません</div>'; return; }
  const nowY = new Date().getFullYear();
  const col = p => p >= .8 ? 'var(--ok)' : p >= .5 ? 'var(--warn)' : 'var(--hot)';

  const rows = students.map(s => {
    const near = [...TG.targets].sort((a,b) => Math.abs(a.need - s.score) - Math.abs(b.need - s.score))[0];
    const days = s.lastSeen ? Math.floor((Date.now() - s.lastSeen) / DAY) : null;
    return `<tr>
      <td><b>${esc(s.name)}</b></td>
      <td class="num">${s.done}/${s.total}</td>
      <td><div class="bar"><i style="width:${(s.done/s.total*100).toFixed(0)}%;background:${col(s.done/s.total)}"></i></div></td>
      <td class="num">${s.score.toFixed(0)}</td>
      <td class="num">Lv ${s.level}</td>
      <td class="num" style="color:${s.fade ? 'var(--warn)' : 'var(--dim)'}">${s.fade}</td>
      <td>${esc(near.name)}<br><span style="font-size:11px;color:${near.need - s.score > 0 ? 'var(--hot)' : 'var(--ok)'}">
        ${near.need - s.score > 0 ? `あと ${(near.need - s.score).toFixed(0)}点` : '到達'}</span></td>
      <td style="font-size:12px;color:${days > 7 ? 'var(--hot)' : 'var(--dim)'}">
        ${days === null ? '—' : days === 0 ? '今日' : `${days}日前`}</td>
    </tr>`;
  }).join('');

  const cards = students.map(s => `
    <div class="card">
      <h3>${esc(s.name)}</h3>
      <div class="meta">習得 ${s.done}/${s.total}　想定得点 ${s.score.toFixed(0)}/100　Lv ${s.level}
        ${s.placed ? '　診断済み' : '　<span style="color:var(--warn)">診断テスト未受験</span>'}
        ${s.fade ? `　<span style="color:var(--warn)">要復習 ${s.fade}項目</span>` : ''}</div>

      <div style="font-size:12.5px;color:var(--dim);margin-bottom:4px">分野別の到達</div>
      <div class="tags">${Object.entries(s.byField).map(([f,v]) =>
        `<span class="${v.d/v.t < .3 ? 'hot' : v.d/v.t < .7 ? 'warn' : ''}">${esc(f)} ${v.d}/${v.t}</span>`).join('')}</div>

      ${s.themeGaps.length ? `
      <div style="font-size:12.5px;color:var(--dim);margin:12px 0 4px">
        東大で直近10年に頻出だが、まだ半分も習得していないテーマ</div>
      <div class="tags">${s.themeGaps.slice(0,6).map(t =>
        `<span class="hot">${esc(t.name)}（直近10年 ${t.recent}回 / 習得 ${t.done}/${t.total}）</span>`).join('')}</div>` : ''}

      <div style="font-size:12.5px;color:var(--dim);margin:12px 0 4px">
        次に指導するとよい項目（東大必要度★5で未習得、重要な順）</div>
      <div class="tags">${s.gaps.slice(0,8).map(n =>
        `<span>${esc(n.title)}<span style="color:var(--dim)">（${esc(n.unit)}・${n.cost}分）</span></span>`).join('')
        || '<span style="color:var(--ok)">★5はすべて習得済み</span>'}</div>
    </div>`).join('');

  out.innerHTML = `
    <h2>一覧（${students.length}人）</h2>
    <div class="wrap"><table>
      <tr><th>名前</th><th>習得</th><th>進捗</th><th>想定得点</th><th>Lv</th><th>要復習</th>
          <th>いまの位置に近い目標</th><th>最終学習</th></tr>
      ${rows}
    </table></div>
    <button class="btn sec" id="csv">一覧をCSVで書き出す</button>
    <button class="btn sec" id="clear">読み込んだデータを消す</button>
    <h2>生徒ごとの詳細</h2>
    ${cards}`;

  document.getElementById('csv').onclick = () => {
    const head = ['名前','習得','全項目','想定得点','レベル','要復習','最終学習からの日数'];
    const lines = students.map(s => [s.name, s.done, s.total, s.score.toFixed(0), s.level, s.fade,
      s.lastSeen ? Math.floor((Date.now()-s.lastSeen)/DAY) : '']);
    const csv = '﻿' + [head, ...lines].map(r => r.join(',')).join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
    a.download = `数学マップ_生徒一覧_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
  };
  document.getElementById('clear').onclick = () => { students.length = 0; render(); };
}

function load(files){
  let n = 0;
  [...files].forEach(f => {
    const r = new FileReader();
    r.onload = () => {
      try {
        const p = JSON.parse(r.result);
        if (!p.rec) throw new Error('進捗ファイルではないようです');
        students.push(analyze(p, f.name));
        render();
      } catch (e) {
        alert(`${f.name} を読み込めませんでした：${e.message}`);
      }
    };
    r.readAsText(f);
  });
}

const drop = document.getElementById('drop');
document.getElementById('pick').onclick = () => document.getElementById('file').click();
document.getElementById('file').onchange = e => load(e.target.files);
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('on'); });
drop.addEventListener('dragleave', () => drop.classList.remove('on'));
drop.addEventListener('drop', e => {
  e.preventDefault(); drop.classList.remove('on');
  load(e.dataTransfer.files);
});
</script>
</body>
</html>
