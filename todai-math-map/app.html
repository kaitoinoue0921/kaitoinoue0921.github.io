<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>東大理三 数学マップ</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1d212a; --line:#2a2f3a;
    --fg:#e6e9ef; --dim:#98a0b0; --accent:#6ea8fe; --ok:#4ec9a0; --warn:#e0b34a; --hot:#e8705f;
    --gold:#e5c76b;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f6f7f9; --panel:#fff; --panel2:#f0f2f5; --line:#dde1e8;
           --fg:#1a1d23; --dim:#666e7d; --accent:#2b6cd4; --ok:#1a9e78; --warn:#a97b12; --hot:#c94a38;
           --gold:#b8860b; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    font-size:14px;line-height:1.7}
  header{position:sticky;top:0;z-index:10;background:var(--panel);border-bottom:1px solid var(--line);padding:9px 16px}
  .hrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  h1{font-size:15px;margin:0;font-weight:700}
  .hstat{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--dim);align-items:center}
  .hstat b{color:var(--fg);font-size:14px;font-variant-numeric:tabular-nums}
  .pw{color:var(--ok)!important}
  nav{display:flex;gap:3px;margin-top:7px;flex-wrap:wrap}
  nav button{background:none;border:1px solid transparent;color:var(--dim);padding:5px 11px;
    border-radius:6px;cursor:pointer;font-size:13px;font-family:inherit}
  nav button.on{background:var(--panel2);color:var(--fg);border-color:var(--line)}
  nav button .bdg{background:var(--hot);color:#fff;border-radius:8px;padding:0 5px;font-size:10px;margin-left:4px}
  main{padding:16px;max-width:1400px;margin:0 auto}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
  select,input[type=search]{background:var(--panel);color:var(--fg);border:1px solid var(--line);
    border-radius:6px;padding:5px 9px;font-size:13px;font-family:inherit}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line);
    border-radius:8px;padding:11px 13px;cursor:pointer;transition:.15s}
  .card:hover{border-color:var(--accent)}
  .card.done{border-left-color:var(--ok)}
  .card.ready{border-left-color:var(--accent)}
  .card.locked{opacity:.55}
  .card.fade{border-left-color:var(--warn)}
  .ct{font-weight:700;margin-bottom:3px;font-size:14px}
  .meta{font-size:11px;color:var(--dim);display:flex;gap:9px;flex-wrap:wrap;margin-bottom:6px;align-items:center}
  .why{font-size:12.5px;color:var(--dim);line-height:1.55}
  .tag{display:inline-block;padding:1px 6px;border-radius:4px;background:var(--panel2);font-size:11px}
  .star{color:var(--warn);letter-spacing:-1px}
  .lockmsg{font-size:11px;color:var(--hot);margin-top:5px}
  .lessonbadge{display:inline-block;font-size:10px;padding:1px 5px;border-radius:3px;background:var(--accent);color:#fff}
  .rbar{width:52px;height:5px;background:var(--panel2);border-radius:3px;overflow:hidden;display:inline-block;vertical-align:middle}
  .rbar>i{display:block;height:100%}
  /* detail */
  #ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:50}
  #ov.on{display:block}
  #dp{position:fixed;top:0;right:0;bottom:0;width:min(680px,100%);background:var(--panel);
    border-left:1px solid var(--line);overflow-y:auto;padding:20px 24px 60px;z-index:51;
    transform:translateX(100%);transition:transform .2s}
  #dp.on{transform:none}
  #dp h2{font-size:18px;margin:0 0 4px}
  #dp h3{font-size:13px;color:var(--accent);margin:20px 0 6px;letter-spacing:.04em;
    border-bottom:1px solid var(--line);padding-bottom:4px}
  #dp p,#dp li{font-size:13.5px}
  #dp ul{padding-left:18px;margin:6px 0}
  #dp li{margin-bottom:5px}
  .close{position:absolute;top:14px;right:18px;background:none;border:none;color:var(--dim);
    font-size:22px;cursor:pointer;line-height:1}
  .chip{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:5px;
    padding:2px 8px;margin:2px 3px 2px 0;font-size:12px;cursor:pointer}
  .chip.done{border-color:var(--ok);color:var(--ok)}
  .btn{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:9px 16px;
    cursor:pointer;font-size:13px;font-family:inherit;font-weight:600;margin:12px 6px 0 0}
  .btn.sec{background:var(--panel2);color:var(--fg);border:1px solid var(--line)}
  .btn.gold{background:var(--gold);color:#1a1d23}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .wk{background:var(--panel2);border-radius:7px;padding:11px 13px;font-size:13px;margin-top:6px}
  .wk b{color:var(--accent)}
  .sol{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;line-height:1.75;
    white-space:pre-wrap;margin-top:7px}
  /* map */
  #map{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px}
  .n rect{fill:var(--panel2);stroke:var(--line);rx:4}
  .n.done rect{stroke:var(--ok);fill:color-mix(in srgb,var(--ok) 12%,var(--panel2))}
  .n.sel rect{stroke:var(--accent);stroke-width:2}
  .n text{fill:var(--fg);font-size:9.5px}
  .n{cursor:pointer}
  .e{stroke:var(--line);fill:none}
  .e.hi{stroke:var(--accent);stroke-width:1.6}
  .doc{max-width:860px}
  .doc h3{font-size:14px;color:var(--accent);margin:22px 0 6px}
  .doc code{background:var(--panel2);padding:1px 5px;border-radius:4px;font-size:12px}
  table{border-collapse:collapse;width:100%;font-size:13px;margin-top:8px}
  th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
  th{background:var(--panel2);font-size:12px}
  .empty{color:var(--dim);padding:30px;text-align:center}
  /* targets */
  .tg{display:flex;align-items:center;gap:14px;padding:11px 14px;border:1px solid var(--line);
    border-radius:8px;background:var(--panel);margin-bottom:7px;flex-wrap:wrap}
  .tg .nm{flex:1;min-width:210px}
  .tg .dv{font-size:11px;color:var(--dim)}
  .tg .pb{width:130px;height:8px;background:var(--panel2);border-radius:4px;overflow:hidden}
  .tg .pb>i{display:block;height:100%;transition:width .3s}
  .tg .pc{width:60px;text-align:right;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
  .tg .gp{font-size:11px;color:var(--dim);width:72px}
  .warnbox{background:color-mix(in srgb,var(--warn) 12%,var(--panel));border:1px solid var(--warn);
    border-radius:8px;padding:11px 14px;font-size:12.5px;margin-bottom:14px;line-height:1.6}
  .big{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
  .kpi{display:flex;gap:26px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);
    border-radius:8px;padding:14px 18px;margin-bottom:14px}
  .kpi div small{display:block;font-size:11px;color:var(--dim);margin-bottom:2px}
  /* quiz */
  .qq{font-size:14.5px;font-weight:600;white-space:pre-wrap;margin-bottom:12px;line-height:1.7}
  .opt{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);
    color:var(--fg);border-radius:6px;padding:10px 13px;margin-bottom:6px;cursor:pointer;
    font-size:13px;font-family:inherit;line-height:1.55}
  .opt:hover{border-color:var(--accent)}
  .opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--panel2))}
  .opt.ng{border-color:var(--hot);background:color-mix(in srgb,var(--hot) 16%,var(--panel2))}
  .qin{background:var(--bg);border:2px solid var(--accent);color:var(--fg);border-radius:8px;
    padding:13px 15px;font-size:17px;font-family:inherit;flex:1;min-width:0;max-width:280px}
  .qin:focus{outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
  .qin::placeholder{color:var(--dim)}
  .anslabel{font-size:12px;color:var(--accent);font-weight:700;margin-bottom:6px}
  .ansrow{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
  .ansrow .btn{margin:0;padding:12px 22px}
  .anshint{font-size:11.5px;color:var(--dim);margin-top:7px;line-height:1.6}
  .fb{margin-top:12px;padding:11px 13px;border-radius:6px;font-size:13px;line-height:1.65}
  .fb.ok{background:color-mix(in srgb,var(--ok) 15%,var(--panel2))}
  .fb.ng{background:color-mix(in srgb,var(--hot) 15%,var(--panel2))}
  .prog{font-size:11px;color:var(--dim);margin-bottom:10px}
  /* 過去問 */
  .exrow{display:flex;gap:12px;align-items:center;padding:9px 12px;border:1px solid var(--line);
    border-radius:8px;background:var(--panel);margin-bottom:6px;flex-wrap:wrap}
  .exrow .th{flex:1;min-width:180px;font-weight:700;font-size:13.5px}
  .exrow .cnt{font-variant-numeric:tabular-nums;font-size:15px;font-weight:800;width:52px;text-align:right}
  .exrow .last{font-size:11.5px;color:var(--dim);width:110px}
  .exrow .mast{font-size:11.5px;width:96px}
  .exrow.gap{border-color:var(--hot);background:color-mix(in srgb,var(--hot) 8%,var(--panel))}
  .exform{background:var(--panel);border:1px solid var(--accent);border-radius:10px;padding:14px 16px;margin-bottom:16px}
  .exform select,.exform input{background:var(--bg);border:1px solid var(--line);color:var(--fg);
    border-radius:6px;padding:8px 10px;font-size:14px;font-family:inherit}
  .exform input{width:84px}
  .exform .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
  .yearblk{margin-bottom:10px;font-size:13px}
  .yearblk b{color:var(--accent);margin-right:10px}
  .exchip{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:5px;
    padding:2px 8px;margin:2px 4px 2px 0;font-size:12px}
  .exchip.v{border-color:var(--ok)}
  /* 導出 */
  .deriv{background:var(--panel2);border-left:3px solid var(--ok);border-radius:0 8px 8px 0;
    padding:12px 16px;margin-top:6px}
  .deriv div{font-size:13.5px;line-height:1.95;margin-bottom:4px}
  .deriv div:last-child{margin-bottom:0}
  .deriv .dstep{color:var(--dim)}
  .deriv b{color:var(--ok)}
  /* 公式・確認問題 */
  .fm{background:var(--panel2);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;
    padding:12px 16px;margin-top:6px}
  .fm ul{margin:0;padding-left:18px}
  .fm li{font-size:14px;line-height:2;margin-bottom:2px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .prac{background:var(--panel2);border-radius:8px;padding:13px 15px;margin-top:6px}
  .prac .pq{font-size:14px;font-weight:600;line-height:1.75}
  .prac details{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
  .prac summary{cursor:pointer;font-size:12.5px;color:var(--accent);font-weight:700;list-style:none}
  .prac summary::-webkit-details-marker{display:none}
  .prac summary::before{content:'▶ ';font-size:10px}
  .prac details[open] summary::before{content:'▼ '}
  .prac .pa{font-size:13.5px;line-height:1.85;margin-top:8px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .selfnote{font-size:11.5px;color:var(--dim);margin-top:8px;line-height:1.7}
  /* 俯瞰マップ */
  .maptoggle{display:flex;gap:4px;margin-bottom:10px}
  .maptoggle button{background:var(--panel);border:1px solid var(--line);color:var(--dim);
    padding:5px 13px;border-radius:6px;cursor:pointer;font-size:12.5px;font-family:inherit}
  .maptoggle button.on{background:var(--panel2);color:var(--fg);border-color:var(--accent)}
  .u rect{fill:var(--panel);stroke:var(--line);rx:7}
  .u:hover rect{stroke:var(--accent)}
  .u .ut{fill:var(--fg);font-size:12px;font-weight:700}
  .u .us{fill:var(--dim);font-size:9.5px}
  .u{cursor:pointer}
  .u .bar-bg{fill:var(--panel2)}
  .u.full rect{stroke:var(--gold);stroke-width:1.6}
  .ue{stroke:var(--line);fill:none;stroke-width:1.2;opacity:.65}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--dim);margin-top:10px}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:4px}
  /* buddy（成長するキャラ） */
  .buddy{display:flex;gap:20px;align-items:center;background:var(--panel);
    border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:16px;flex-wrap:wrap}
  .bav{width:124px;height:124px;flex-shrink:0}
  .bav svg{width:100%;height:100%;overflow:visible}
  .binfo{flex:1;min-width:230px}
  .bname{font-size:17px;font-weight:800;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .blv{font-size:11px;font-weight:700;background:var(--panel2);border:1px solid var(--line);
    border-radius:5px;padding:2px 8px;color:var(--gold)}
  .bstat{font-size:12.5px;color:var(--dim);margin-top:4px}
  .bstat b{color:var(--fg);font-variant-numeric:tabular-nums}
  .bbar{height:9px;background:var(--panel2);border-radius:5px;overflow:hidden;margin:10px 0 6px}
  .bbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));
    transition:width .6s cubic-bezier(.2,.8,.2,1)}
  .bnext{font-size:12px;color:var(--dim)}
  .bnext b{color:var(--gold);font-variant-numeric:tabular-nums}
  .btoday{font-size:11.5px;color:var(--dim);margin-top:7px;padding-top:7px;border-top:1px solid var(--line)}
  .btoday b{color:var(--ok)}
  @keyframes bfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  @keyframes bpulse{0%,100%{opacity:.82}50%{opacity:1}}
  @keyframes bspin{to{transform:rotate(360deg)}}
  .bbody{animation:bfloat 4.5s ease-in-out infinite}
  .bcore{animation:bpulse 3s ease-in-out infinite}
  .baura{animation:bspin 20s linear infinite;transform-origin:60px 60px}
  .beye{fill:var(--panel)}
  /* 診断テスト */
  .plcard{background:var(--panel);border:1px solid var(--accent);border-radius:14px;
    padding:24px 26px;margin-bottom:16px}
  .plcard h2{font-size:19px;margin:0 0 8px}
  .plcard p{font-size:13.5px;color:var(--dim);margin:0 0 6px;line-height:1.85}
  .plres{display:flex;gap:24px;flex-wrap:wrap;background:var(--panel2);border-radius:10px;
    padding:16px 20px;margin:14px 0}
  .plres div small{display:block;font-size:11px;color:var(--dim);margin-bottom:2px}
  .plfield{font-size:12.5px;padding:5px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
  /* monsters */
  .mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
  .mon{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px;text-align:center}
  .mon.zero{opacity:.4}
  .mface{font-size:42px;line-height:1.2;filter:grayscale(0)}
  .mon.weak .mface{filter:grayscale(.85) brightness(.8)}
  .mname{font-weight:700;font-size:13px;margin-top:4px}
  .munit{font-size:10.5px;color:var(--dim)}
  .mlv{font-size:11px;color:var(--gold);font-weight:700;margin-top:3px}
  .mles{font-size:10px;margin-top:2px;font-weight:700}
  .mbar{height:5px;background:var(--panel2);border-radius:3px;overflow:hidden;margin-top:7px}
  .mbar>i{display:block;height:100%;transition:width .3s}
  /* gacha */
  .gbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px;text-align:center;max-width:460px}
  .result{font-size:44px;margin:10px 0}
  .r5{color:var(--gold);font-weight:800;text-shadow:0 0 14px color-mix(in srgb,var(--gold) 55%,transparent)}
  .r4{color:var(--accent);font-weight:700}
  .r3{color:var(--dim)}
  .boxlist{margin-top:16px;font-size:12.5px}
  .boxlist div{padding:5px 0;border-bottom:1px solid var(--line)}
</style>
  <meta property="og:title" content="東大理三 数学マップ">
  <meta property="og:description" content="何を、どの順で、なぜやるか。数学の全範囲を構造化した学習マップ。">
  <meta property="og:image" content="https://kaitoinoue0921.github.io/todai-math-map/ogp.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="icon" href="./icon-192.png">
  <meta name="theme-color" content="#0f1115">
</head>
<body>
<header>
  <div class="hrow">
    <h1>東大理三 数学マップ</h1>
    <div class="hstat" id="hs"></div>
  </div>
  <nav>
    <button data-v="next" class="on">次にやる</button>
    <button data-v="review">復習<span class="bdg" id="rvb" style="display:none">0</span></button>
    <button data-v="all">全項目</button>
    <button data-v="map">全体マップ</button>
    <button data-v="prob">合格可能性</button>
    <button data-v="past">過去問</button>
    <button data-v="mon">モンスター</button>
    <button data-v="gacha">ガチャ</button>
    <button data-v="doc">設計方針</button>
  </nav>
</header>
<main>
  <div class="filters" id="filters">
    <select id="fField"><option value="">全分野</option></select>
    <select id="fUnit"><option value="">全単元</option></select>
    <select id="fState">
      <option value="">状態: すべて</option>
      <option value="ready">着手可能</option>
      <option value="locked">前提未達</option>
      <option value="done">習得済み</option>
    </select>
    <select id="fTodai">
      <option value="">東大必要度: すべて</option>
      <option value="5">★5のみ</option><option value="4">★4以上</option><option value="3">★3以上</option>
    </select>
    <input type="search" id="fQ" placeholder="検索…">
    <button class="btn sec" id="reset" style="margin:0;padding:5px 11px">リセット</button>
  </div>
  <div id="view"></div>
</main>

<div id="ov"></div>

<script>

ment","td-symmetry"],"todai":5,"cost":120,"why":"東大は初見の設定を出すが、中身は必ず既習の型。設定を剥がして何の問題かを見抜く作業が本体","trap":"問題文の言葉のまま処理しようとする","field":"東大レイヤー"},{"id":"td-argument","title":"場合分けを漏らさない・同値性を保つ記述","unit":"メタ技能","level":4,"prereq":["m1-logic","m2f-minmax","m2-int-abs"],"todai":5,"cost":120,"why":"東大の採点は論理の飛躍に厳しい。合っている答えでも過程で落ちる","trap":"必要条件だけ出して十分性の確認を書かない","field":"東大レイヤー"},{"id":"td-writing","title":"減点されない答案の書き方","unit":"メタ技能","level":4,"prereq":["td-argument"],"todai":5,"cost":90,"why":"同じ実力で15〜25点変わる領域。図・宣言（〜とおく）・結論の明示の3点","trap":"計算だけが並び、何を求めているかが読み手に伝わらない","field":"東大レイヤー"},{"id":"td-calc","title":"計算の設計と検算（次数・単位・特殊値）","unit":"メタ技能","level":4,"prereq":["m3-int-sub","m3-area"],"todai":5,"cost":90,"why":"理三の失点の最大要因は難問ではなく計算ミス。検算の型を持っているかどうか","trap":"検算を『もう一度同じ計算をする』でやる（別の方法で確かめる）","field":"東大レイヤー"},{"id":"td-time","title":"150分の運用（大問の選択と撤退の判断）","unit":"メタ技能","level":5,"prereq":["td-calc","td-writing"],"todai":5,"cost":120,"why":"6問150分。全問完答は不要。解ける4問を確実に取り切る配分の設計","trap":"1問に40分溶かして他が白紙になる","field":"東大レイヤー"},{"id":"td-t-prob","title":"【東大型】確率の状態設計","unit":"出題テーマ","level":5,"prereq":["ma-prob-rec","td-experiment"],"todai":5,"cost":180,"why":"設定が複雑で、何を状態と見るかを自分で決めさせる。分類さえ決まれば計算は易しい","trap":"状態の個数を増やしすぎて漸化式が解けなくなる","field":"東大レイヤー"},{"id":"td-t-integer","title":"【東大型】整数の論証","unit":"出題テーマ","level":5,"prereq":["ma-int-mod","ma-int-bound","mb-induction"],"todai":5,"cost":180,"why":"合同式・因数分解・評価の3手段から選ぶ。証明として完結させる力を測ってくる","trap":"具体例で確認して終わりにし、一般の証明を書かない","field":"東大レイヤー"},{"id":"td-t-region","title":"【東大型】通過領域・存在条件","unit":"出題テーマ","level":5,"prereq":["m2-pass-region","m3-root-count3"],"todai":5,"cost":180,"why":"『あるtが存在してこの式を満たす点の集合』への読み替え。逆像法（yを固定してxの存在条件）が主武器","trap":"パラメータの範囲制約を落とし、余分な領域まで塗る","field":"東大レイヤー"},{"id":"td-t-volume","title":"【東大型】立体の体積","unit":"出題テーマ","level":5,"prereq":["m3-vol-cross","mc-vec-foot","td-symmetry"],"todai":5,"cost":240,"why":"毎年のように出る最大配点帯。切断面をどの向きで取るかの一択で難易度が変わる","trap":"立体を3次元で把握しようとして詰まる（断面の2次元問題に落とす）","field":"東大レイヤー"},{"id":"td-t-cplx","title":"【東大型】複素数平面と図形","unit":"出題テーマ","level":5,"prereq":["mc-cplx-locus","td-reduce"],"todai":4,"cost":150,"why":"回転・軌跡・n乗根。ベクトルや座標より圧倒的に短く書ける場面を見抜く","trap":"実部虚部に分解して計算が膨張する","field":"東大レイヤー"},{"id":"td-t-eval","title":"【東大型】評価と極限の融合","unit":"出題テーマ","level":5,"prereq":["m3-int-ineq","m3-int-recur","m3-mvt"],"todai":5,"cost":240,"why":"『(1)で不等式を示し (2)で極限を出す』という誘導の意味を読む。理三で差がつく最上位テーマ","trap":"(1)を飛ばして(2)を解こうとする（誘導は使うために置かれている）","field":"東大レイヤー"},{"id":"td-t-space","title":"【東大型】空間図形の最大最小","unit":"出題テーマ","level":5,"prereq":["mc-vec-foot","m3-diff-minmax","td-symmetry"],"todai":4,"cost":180,"why":"ベクトルで立式→1変数に落として微分、という長い一本道を最後まで走り切る体力","trap":"変数の取り方が悪く式が汚くなったまま突き進む","field":"東大レイヤー"},{"id":"td-t-func","title":"【東大型】関数の決定・不等式の成立条件","unit":"出題テーマ","level":5,"prereq":["m3-ineq-diff","m2-int-param","td-argument"],"todai":4,"cost":150,"why":"『すべてのxで成り立つ』『あるxで成り立つ』の違いを最小値・最大値に翻訳する","trap":"∀と∃の翻訳を取り違える","field":"東大レイヤー"},{"id":"td-goal","title":"理三の合格ライン（数学 6問中4完+α / 目安80〜100点）","unit":"到達点","level":5,"prereq":["td-time","td-t-prob","td-t-integer","td-t-region","td-t-volume","td-t-eval"],"todai":5,"cost":0,"why":"全問完答は不要。標準3問を落とさず、難問1問に手を伸ばせる状態が目標","trap":"満点を狙って全範囲を均一に固めようとし、時間切れになる","field":"東大レイヤー"}],"lessons":[{"nodeId":"ma-prob-rec","title":"確率漸化式","core":"確率漸化式は『確率の問題』ではなく『状態遷移の問題』。n回目に起こりうる状況を有限個の状態に分類し、1手先でどこへ移るかだけを書く。難しいのは計算ではなく分類で、状態の取り方が決まった瞬間に問題は終わっている。逆に言えば、手が止まるのは常に『何を状態と見るか』を決めていないとき。","trigger":["『n回の操作』『n秒後』など、回数が文字で与えられている → まず漸化式を疑う","毎回の操作が同じルールで、直前の状況だけで次が決まる（それ以前の履歴によらない）→ 漸化式が立つ確定サイン","『ちょうどn回目に初めて〜』→ 状態に『まだ達していない』を含める","状態が2つなら p_n と 1-p_n で足りる。3つ以上なら連立漸化式を覚悟する"],"procedure":["1. n回後の状態を、互いに排反で網羅的な有限個に分類する（ここが本体）","2. 各状態にいる確率を p_n, q_n, ... と置き、必ず p_n + q_n + ... = 1 を確認する","3. n回後の各状態から、n+1回目の1手で行き先と確率を全部書き出す（遷移図を描く）","4. p_{n+1} = （各状態からp状態へ流れ込む確率の和）として立式","5. 初期条件を n=0 と n=1 の両方で確認する（どちらで始めるかで式がずれる）","6. 漸化式を型で解く（多くは等比型 or 特性方程式）","7. 検算：n=1,2 を式に入れ、手で数えた値と一致するか見る"],"worked":{"problem":"部屋 A, B, C がある。点Pは1回の操作で、今いる部屋以外の2部屋のどちらかへ等確率で移動する。最初 A にいるとき、n回後に A にいる確率 p_n を求めよ。","solution":["n回後にAにいる確率を p_n とすると、Aにいない確率は 1 - p_n。","対称性から、Aにいないとき B にいる確率と C にいる確率は等しい（ここに気づくと状態が2つで済む）。","n回後にAにいる場合、次の1手で必ずAを出るので、Aに留まる寄与は 0。","n回後にAにいない場合（確率 1 - p_n）、その部屋から見てAは『今いる部屋以外の2部屋』の一方なので、Aへ移る確率は 1/2。","よって p_{n+1} = (1/2)(1 - p_n)、p_0 = 1。","特性方程式 α = (1/2)(1 - α) より α = 1/3。","p_{n+1} - 1/3 = -(1/2)(p_n - 1/3) となり、p_n - 1/3 = (2/3)(-1/2)^n。","∴ p_n = 1/3 + (2/3)(-1/2)^n","検算：p_0 = 1/3 + 2/3 = 1 ○。p_1 = 1/3 - 1/3 = 0 ○（1回で必ずAを出る）。p_2 = 1/3 + 1/6 = 1/2 ○（B or C から戻る確率 1/2）。"]},"variants":["状態が3つ以上で対称性が使えないときは連立漸化式。p_n + q_n + r_n = 1 で1本消して2元にするのが定石","遷移が行列で書けるときは行列の n 乗（ただし東大では対角化を要求する形では出にくい）","n が小さい場合を全部書き出して一般項を予想し、数学的帰納法で示す — 漸化式が解けない形のときの逃げ道。東大はこちらを要求することがある","『初めて到達する確率』は、到達済みを吸収状態にして分けると素直になる"],"pitfalls":["状態の分類が粗く、同じ状態に見えて遷移確率が違うものを混ぜてしまう（最頻出の敗因）","逆に状態を増やしすぎて漸化式が解けなくなる。対称性で潰せないか必ず一度考える","確率の和が1になる検算をしない","p_0 で立てた式に p_1 の初期条件を入れて添字が1ずれる","『n回後』と『n回目の操作で』を混同する"],"todaiUse":"東大理系で最も出題頻度が高い型の一つ。設定が複雑（サイコロ、カードの並べ替え、格子上の点の移動など）で、状態を自分で設計させる形で出る。誘導で(1)に小さいnの具体値を求めさせ、(2)で漸化式、(3)で極限、という3段構成が典型。","check":["サイコロを n 回投げ、出た目の和が3の倍数になる確率を求めよ（状態を『和を3で割った余り』に取る）","上の問題で n→∞ の極限を求め、直感と合うか確かめよ"],"stretch":"状態数が n に依存して増える設定（例：n個の箱を使う）では漸化式が立たない。その場合は数え上げか、別のパラメータで漸化式を立て直す。"},{"nodeId":"ma-int-mod","title":"合同式（mod）","core":"整数問題で『割った余り』を持ち出す理由は、無限個の整数を有限個のグループに潰せるからにほかならない。mod m で考えるとは、整数全体を m 個の箱に分けて、箱の名前だけで計算することを指す。積と和が箱のまま計算できる（合同式が積・和で保たれる）ことが唯一にして最大の武器で、逆に割り算だけは自由にできない、という一点さえ押さえれば道具として完成する。","trigger":["『〜で割った余り』『〜の倍数であることを示せ』→ 即 mod","末尾の数字 → mod 10（下2桁なら mod 100）","平方数が絡む → mod 3, mod 4, mod 8 を試す（平方数は mod 3 で 0,1 / mod 4 で 0,1 / mod 8 で 0,1,4 しか取らない）","3乗が絡む → mod 9（立方数は mod 9 で 0, 1, 8 のみ）","n^k の余りの周期を聞かれている → 小さいkで実際に計算し周期を見つける","解が存在しないことを示せ → mod で矛盾を出す（存在しないことの証明はほぼこれか無限降下）"],"procedure":["1. 何で割るか（mod をいくつに取るか）を決める。これが8割","2. 決め方：問題に出てくる数の素因数、平方数なら 3・4・8、周期性なら実験して決める","3. 各文字を mod m での余りで場合分けする（m個の場合、対称性で減ることもある）","4. 合同式のまま計算し、両辺の取りうる値を比較して矛盾を出す／条件を絞る","5. 割り算をした箇所がないか点検する（gcd(a,m)=1 のときしか a で割れない）"],"worked":{"problem":"x, y, z を自然数とするとき、x² + y² = 3z² を満たすものは存在しないことを示せ。","solution":["平方数を3で割った余りを調べる。整数 n は n ≡ 0, 1, 2 (mod 3) のいずれかで、","n ≡ 0 なら n² ≡ 0、n ≡ ±1 なら n² ≡ 1 (mod 3)。よって平方数は mod 3 で 0 か 1 のみ。","x² + y² ≡ 0 (mod 3) が必要（右辺が3の倍数だから）。","0 と 1 の2つの和で 0 (mod 3) になるのは 0 + 0 のときだけ。","よって x ≡ 0 かつ y ≡ 0 (mod 3)、すなわち x = 3a, y = 3b と書ける。","代入して 9a² + 9b² = 3z² より 3(a² + b²) = z²。よって z² は3の倍数、3は素数だから z も3の倍数で z = 3c。","3(a² + b²) = 9c² より a² + b² = 3c²。","これは元と同じ形で、a < x, b < y, c < z。同じ操作を繰り返せば自然数が無限に減り続けることになり矛盾（無限降下法）。","∴ 自然数解は存在しない。"]},"variants":["mod を使わず因数分解で積の形に持ち込む（(x+y)(x-y)=n 型）。有限個に閉じ込めたいときはこちら","不等式で範囲を絞る（大小関係を仮定して有限化）。3つの手段のうちどれが効くかは、問題の形で決まる","『存在しない』の証明は mod での矛盾か無限降下。『存在する』の証明は構成するだけでよい","フェルマーの小定理は高校範囲外だが、周期性の実験で同じ結論に辿り着ける"],"pitfalls":["合同式で両辺を割ってしまう（法と互いに素でなければ不可）","mod をいくつに取るかを試行錯誤せず、最初の1つで諦める","『x²が3の倍数 ⇒ xが3の倍数』に3が素数であることの言及がない（東大はここを見る）","具体例で確認して満足し、一般の証明を書かない","無限降下で『最小の解を取る』と宣言せずに議論を進める"],"todaiUse":"東大の整数は合同式・因数分解・評価の3手段のどれを選ぶかを問う形で出る。単独の大問になる年が多く、誘導が薄いのが特徴。(1)で小さい場合を実験させ、(2)で一般の証明という構成が多い。","check":["2ⁿ を 7 で割った余りを n について調べ、周期を求めよ","n が 3 の倍数でないとき n² - 1 が 3 の倍数であることを示せ","x² + y² = z² で x, y の少なくとも一方は 3 の倍数であることを示せ"],"stretch":"mod の複数取り（mod 4 と mod 9 を同時に見て絞る）。中国剰余定理の考え方は範囲外だが、2つの条件を並べて絞るだけなら高校範囲で書ける。"},{"nodeId":"m2-pass-region","title":"通過領域（存在条件への読み替え）","core":"『パラメータ t を動かしたときに直線や曲線が通る点の全体』を求める問題は、幾何の問題に見えて実際は論理の問題である。点 (X, Y) が通過領域に入るとは、その (X, Y) に対して条件式を満たす実数 t が少なくとも1つ存在すること、それだけを意味する。したがって図形的に考える必要はなく、条件式を t の方程式と見て『実数解を持つ条件』に翻訳すればよい。ここで視点を t 側に移せるかどうかが、この単元の全てになる。","trigger":["『t が実数全体を動くとき、直線 ℓ の通過する範囲を求めよ』→ 定番の逆像法","式の中でパラメータが2次以下 → t の2次方程式と見て判別式（最速）","パラメータに範囲がついている（0 ≦ t ≦ 1 など）→ 判別式だけでは足りず、解の配置問題になる","パラメータが2つ以上 → 1つずつ順に処理する（順像法の出番）","『少なくとも1つ存在する』『すべての t で成り立つ』→ ∃ と ∀ の違いを最初に確定させる"],"procedure":["1. 通過領域上の点を (X, Y) と置く（動点と定点の記号を必ず分ける）","2. 条件式を、X, Y を定数・t を変数とみなして整理する（この視点の切り替えが核心）","3. 『この t の方程式が、t の許される範囲内に実数解を持つ』条件を求める","4. t が実数全体なら判別式 D ≧ 0。t に範囲があれば解の配置（軸・端点の値）で処理","5. 得られた X, Y の条件を図示する。境界を含むかを必ず判定する","6. 検算：領域内の点を1つ取り、実際にその t を求めて元の式を満たすか確かめる"],"worked":{"problem":"t が実数全体を動くとき、直線 y = 2tx - t² が通過する領域を図示せよ。","solution":["点 (X, Y) がこの直線群のいずれかの上にある条件は、Y = 2tX - t² を満たす実数 t が存在すること。","これを t について整理すると t² - 2Xt + Y = 0。","X, Y を定数、t を未知数とする2次方程式と見る。","実数 t が存在する条件は判別式 D/4 = X² - Y ≧ 0、すなわち Y ≦ X²。","∴ 求める領域は放物線 y = x² およびその下側（境界を含む）。","検算：(0, -1) は Y ≦ X² を満たす。実際 t² - 0 - 1 = 0 より t = ±1 が存在し、直線 y = 2x - 1 は点 (0, -1) を通る ○。","補足：この直線群は放物線 y = x² の接線全体（t が接点の x 座標）。通過領域が接線の下側になるのは幾何的にも整合する。"]},"variants":["逆像法（上の解法）：(X,Y) を固定して t の存在条件に落とす。パラメータが低次のとき最速","順像法：t を固定して x の各値に対する y の動く範囲を求め、t を動かして合併する。パラメータの範囲が複雑なとき有効","包絡線として捉える（範囲外だが、答えの検算に使える）：接線族なら包絡線が境界になる","領域上での最大最小と組み合わせる問題では、逆像法で得た不等式をそのまま制約条件に使える"],"pitfalls":["t の動く範囲の制約を忘れて、余分な領域まで塗る（最頻出の失点）","判別式だけで済ませてよいのは t が実数全体のときだけ。範囲つきなら解の配置が必要","境界を含むかどうかの判定を書かない","動点 (X, Y) と元の変数 (x, y) を同じ文字で書いて論理が壊れる","『すべての t で成り立つ』(∀) 問題を、存在条件 (∃) と取り違える。この2つは答えが全く違う"],"todaiUse":"東大の最重要テーマの一つ。単独でも出るが、数III の関数と組み合わせて『曲線群の通過領域』として出ることも多い。領域を求めた後に面積を計算させる、という2段構えが定番。","check":["0 ≦ t ≦ 1 のとき、直線 y = 2tx - t² の通過領域を図示せよ（範囲つきに変えると解の配置が必要になることを体感する）","t が実数全体を動くとき、円 (x - t)² + y² = 1 の通過領域を求めよ"],"stretch":"パラメータが2つ (s, t) ある場合。1つを固定してもう1つで処理し、最後に固定した方を動かす。順序を変えると難易度が変わるので両方試す。"},{"nodeId":"m3-int-riemann","title":"区分求積法","core":"区分求積法は『和の極限を積分に翻訳する辞書』である。n個の項の和を、幅 1/n の長方形 n 個の面積の和と見れば、n→∞ で曲線の下の面積、すなわち定積分になる。使えるようになる鍵は公式の暗記ではなく、与えられた和を (1/n)·Σ f(k/n) の形に整形する手の動きにある。1/n を括り出せるかどうか、それだけを見ればよい。","trigger":["Σ と lim が同時に出てくる → まず区分求積を疑う","和の中に k/n の形が見える、または作れる → 確定","分母が n の1次で、Σ の項数も n → 1/n を括り出せる形","Σ の中身が n だけの式で k がない → 区分求積ではない（単なる和の公式）","はさみうちで処理しようとして評価がうまく作れない → 区分求積で厳密値が出ないか見る"],"procedure":["1. 和の形を Σ[k=1..n] の形に統一する","2. 全体から 1/n を括り出す","3. 残りが k/n だけの式 f(k/n) になっているか確認する（なっていなければ変形する）","4. lim (1/n)Σ[k=1..n] f(k/n) = ∫[0→1] f(x) dx と書き換える","5. k の動く範囲と積分区間の対応を確認する（k=1..n なら [0,1]、k=1..2n なら [0,2] など）","6. 定積分を計算する"],"worked":{"problem":"lim[n→∞] Σ[k=1..n] n/(n² + k²) を求めよ。","solution":["分母分子を n² で割る：n/(n² + k²) = (1/n) · 1/(1 + (k/n)²)。","よって与式 = lim[n→∞] (1/n) Σ[k=1..n] 1/(1 + (k/n)²)。","f(x) = 1/(1 + x²) とすると、これは f の [0,1] 上の区分求積の形。","= ∫[0→1] dx/(1 + x²)","x = tanθ と置換すると dx = dθ/cos²θ、1 + x² = 1/cos²θ、x: 0→1 のとき θ: 0→π/4。","= ∫[0→π/4] dθ = π/4","∴ π/4","検算：各項は正で、n=1 のとき 1/2、項数が増えても和は π/4 ≒ 0.785 に近づく。数値的にも整合する。"]},"variants":["はさみうち：区分求積で厳密値が出ない場合、単調性を使って積分で上下から挟む（∫ ≦ Σ ≦ ∫ の形）","積分区間を [0,1] 以外に取る：k が 1 から 2n まで動くなら [0,2]","log を取ってから区分求積：積の形の極限（例：(n!/nⁿ)^(1/n)）は log で和に変えると使える。東大の頻出変形","逆向きの利用：積分の値を近似する不等式を作るために、和と積分の大小を比較する"],"pitfalls":["1/n を括り出す整形ができず手が止まる（この単元の失敗はほぼ全てこれ）","k の範囲と積分区間の対応を間違える（k=0 から始まるか k=1 からかで区間の端がずれるが、極限では一致することの確認）","Σ の中に n が k と独立に残っているのに区分求積を適用してしまう","積の形の極限に log を取らずに直接適用しようとする"],"todaiUse":"『和の極限』を求めさせる形で頻出。単独では易しいため、不等式評価（はさみうち）と組み合わせて難度を上げてくるのが東大の通例。(1)で不等式を示させ、(2)でその不等式を使って極限を出す誘導が典型。","check":["lim[n→∞] (1/n) Σ[k=1..n] √(k/n) を求めよ","lim[n→∞] (n!/nⁿ)^(1/n) を求めよ（log を取る）"],"stretch":"和と積分の大小比較による評価（Σ 1/k と log n の比較）。調和級数の発散速度を押さえると、上位の極限問題が処理できるようになる。"},{"nodeId":"m3-vol-cross","title":"非回転体の体積（断面積を積分する）","core":"立体の体積を求める作業は、立体そのものを3次元で把握する作業ではない。軸を1本決め、その軸に垂直な平面 x = t で切ったときの断面積 S(t) を求め、∫S(t)dt を計算する——ただそれだけの手続きである。だから難しさは積分ではなく、『t を固定したときに断面がどんな図形になるか』を求める2次元の問題を解けるかどうかに集約される。立体が頭の中で見えないまま止まってしまう人は、3次元で見ようとしているのであって、断面という2次元の問題に落とす手続きを踏んでいない。","trigger":["回転体ではない立体の体積 → 断面積を積分する以外の道はない","『2つの立体の共通部分』→ 断面同士の共通部分を取る（2次元の問題になる）","軸の選び方が自由なとき → 断面が最も単純になる向きを選ぶ（対称性のある向き）","断面が t の範囲によって形を変えそう → 場合分けを最初に見積もる","空間の点の条件が不等式で与えられている → x = t を代入して y, z の条件にする"],"procedure":["1. 座標軸を設定する。対称性が最も活きる取り方を選ぶ（ここで難易度が半分になる）","2. 積分する軸を決め、その軸に垂直な平面 x = t で切る","3. t を定数として扱い、断面が y-z 平面上のどんな図形かを求める（これは2次元の問題）","4. 断面積 S(t) を t の式で表す","5. t の動く範囲で断面の形が変わるなら場合分けし、各区間で S(t) を求める","6. V = ∫ S(t) dt を計算する","7. 検算：t の端で S(t) が 0 または既知の値になるか、体積のオーダーが直感と合うか"],"worked":{"problem":"底面が半径1の円である円柱を、底面の直径を含み底面と 45° をなす平面で切る。このとき小さい方の立体の体積を求めよ。","solution":["底面の円の中心を原点、切断に使う直径を x 軸に取る。底面は x² + y² ≦ 1、高さ方向を z とする。","立体は、底面の半円 (y ≧ 0 の側) の上にあり、平面 z = y·tan45° = y の下にある部分。","x = t (-1 ≦ t ≦ 1) で切る。断面は y-z 平面上で、0 ≦ y ≦ √(1 - t²)、0 ≦ z ≦ y の領域。","これは直角をはさむ2辺が √(1 - t²) の直角三角形。","S(t) = (1/2)·√(1 - t²)·√(1 - t²) = (1 - t²)/2","V = ∫[-1→1] (1 - t²)/2 dt = (1/2)[t - t³/3]₋₁¹ = (1/2)·(2 - 2/3) = (1/2)·(4/3) = 2/3","∴ 2/3","検算：t = ±1 で S = 0 ○（円の端では断面が潰れる）。t = 0 で S = 1/2（斜辺が45°の直角三角形）○。"]},"variants":["軸の取り方を変える：同じ立体でも切る向きで計算量が数倍変わる。迷ったら2通り試して軽い方を採る","共通部分の体積：立体A ∩ 立体B の断面は (Aの断面) ∩ (Bの断面)。2次元の共通部分を求める問題に落ちる","回転体でも断面積で処理できる：回転体の公式 πr² は、断面が円である場合の特殊例にすぎない","斜回転体：回転軸が座標軸でないときは、座標を回転させてから通常の回転体に帰着する（複素数平面の回転が使える）","カヴァリエリの原理：断面積が等しい立体は体積も等しい。答えの検算や、難しい立体を易しい立体に置き換えるのに使える"],"pitfalls":["3次元の形を頭で把握しようとして手が止まる（断面という2次元問題に落とす手続きを踏む）","断面の形が t の範囲で変わるのに、1つの式で押し通す（東大はここを狙って出す）","断面積を求める際に、断面が回転体の一部だと思い込んで円だと決めつける","座標設定が対称性を無視しており、式が汚くなったまま突き進む","積分区間を立体の存在範囲ではなく、なんとなくの範囲で取る"],"todaiUse":"東大理系で毎年のように出題される最大配点帯のテーマ。特に『2つの立体（円柱・球・正四面体など）の共通部分』の形が頻出。切る向きの選択と、断面の場合分けの2点が採点上の分岐になる。","check":["半径1の2つの円柱 x² + y² ≦ 1 と x² + z² ≦ 1 の共通部分の体積を求めよ（断面は正方形になる）","上の問題で、断面が正方形になる理由を、x = t を代入して説明せよ"],"stretch":"回転体と非回転体の融合。領域を回転させた立体を、さらに別の平面で切る問題。断面を求める段階で回転を考える必要があり、最難問クラスになる。"},{"nodeId":"m3-int-recur","title":"定積分と漸化式","core":"I_n = ∫ (n を含む式) の形の定積分は、直接計算しようとしても n が一般のままでは原始関数が書けない。そこで部分積分を1回だけ行い、I_n を I_{n-1} や I_{n-2} で表す関係式（漸化式）を作る。個別の値を求めるのではなく、値どうしの関係を作ってから初期値で下ろす、という発想の転換がこの単元の全てである。さらに東大はここで止めず、作った漸化式から不等式評価や極限へ繋げてくる。","trigger":["積分の中に自然数 n が指数として入っている（sinⁿx, xⁿeˣ, (log x)ⁿ など）→ 漸化式を作る","『I_n を I_{n-2} で表せ』という誘導がある → 部分積分ほぼ確定","(1) で漸化式を作らせ (2) で極限 → 最後ははさみうち","n乗の積分で n が偶数か奇数かで答えが変わりそう → 2つ飛びの漸化式（I_n と I_{n-2}）"],"procedure":["1. I_n を定義通りに書き、部分積分の形に分ける（何を微分側・積分側に置くかを決める）","2. 一度部分積分し、出てきた積分を I_{n-1} または I_{n-2} の形に整理する","3. 整理の途中で sin²x = 1 - cos²x などを使い、同じ I_n が右辺に現れたら移項してまとめる","4. 初期値 I_0, I_1 を直接計算する","5. 漸化式を繰り返し適用して一般項を出す（n の偶奇で分かれることが多い）","6. 極限が問われていれば、0 ≦ I_n ≦ (評価しやすい式) を作ってはさみうち"],"worked":{"problem":"I_n = ∫[0→π/2] sinⁿx dx (n は 0 以上の整数) について、I_n を I_{n-2} で表し、lim[n→∞] I_n を求めよ。","solution":["n ≧ 2 とする。sinⁿx = sinⁿ⁻¹x · sinx と分け、sinx を積分側に取る。","I_n = [-sinⁿ⁻¹x · cosx]₀^(π/2) + ∫[0→π/2] (n-1)sinⁿ⁻²x · cos²x dx","第1項は x = π/2 で cos = 0、x = 0 で sinⁿ⁻¹ = 0 (n ≧ 2) より 0。","cos²x = 1 - sin²x を代入すると","I_n = (n-1)∫[0→π/2] sinⁿ⁻²x dx - (n-1)∫[0→π/2] sinⁿx dx = (n-1)I_{n-2} - (n-1)I_n","移項して n·I_n = (n-1)I_{n-2}、すなわち I_n = ((n-1)/n) I_{n-2}","初期値は I_0 = π/2、I_1 = 1。","極限について：0 ≦ x ≦ π/2 で 0 ≦ sinx ≦ 1 だから sinⁿ⁺¹x ≦ sinⁿx、よって I_n は単調減少で I_n > 0。","漸化式より I_n = ((n-1)/n)I_{n-2} で、係数 (n-1)/n < 1 が掛かり続ける。","n·I_n·I_{n-1} = (n-1)I_{n-2}·I_{n-1} より数列 n·I_n·I_{n-1} は一定で、I_1·I_0·1 = π/2。","よって I_n·I_{n-1} = π/(2n) → 0。I_n は単調減少で正だから I_n² ≦ I_n·I_{n-1} = π/(2n) → 0。","∴ lim[n→∞] I_n = 0"]},"variants":["部分積分を2回使って元の I_n に戻し、移項して解く型（eˣsinx の積分など）","積分の中身を評価してから積分する（漸化式を作らずに、はさみうちだけで極限を出す）","置換で別の漸化式に化ける場合がある。x → π/2 - x の置換で cosⁿx の積分と等しいことが分かる","(log x)ⁿ 型は log を微分側に置くのが定石。xⁿeˣ 型は xⁿ を微分側に置く"],"pitfalls":["部分積分で微分側・積分側の選択を誤り、次数が下がらない","漸化式は作れたが、初期値 I_0 と I_1 の両方を出さない（偶奇で必要）","極限で『(n-1)/n < 1 だから 0 に収束する』と書いてしまう（1に近づく係数を無限回掛けても 0 とは限らないので、評価が必要）","はさみうちの下側 0 ≦ I_n を書かない","移項が必要な形で、右辺に出た I_n を見落として計算を続ける"],"todaiUse":"東大が構造的に好むテーマ。(1) 漸化式を作らせ、(2) 不等式を示させ、(3) その不等式で極限を出す、という3段の誘導で出る。誘導を使わずに解こうとすると詰まるように設計されているので、前問の結果を必ず使う。","check":["J_n = ∫[0→1] xⁿeˣ dx について J_n を J_{n-1} で表し、lim[n→∞] J_n を求めよ","K_n = ∫[1→e] (log x)ⁿ dx について漸化式を作れ"],"stretch":"漸化式から一般項を出さずに、不等式評価だけで極限の速さ（何のオーダーで 0 に近づくか）を求める問題。理三の最上位帯。"},{"nodeId":"ma-prob-def","title":"確率の定義（同様に確からしい・根元事象の設定）","core":"確率の問題で落ちる原因は、公式ではなく『何を1つの根元事象と見るか』の設定にある。確率が場合の数の比として計算できるのは、数えている一つ一つの場合が同じ起こりやすさを持つときに限られる。同じ色の玉を区別せずに数えると、この前提が壊れて答えが変わってしまう。だから確率では、見た目で区別がつかないものも全部区別して数える。これは技術ではなく定義の要請であり、ここを曖昧にしたまま先の単元へ進むと、確率漸化式でも期待値でも同じ場所で崩れる。","trigger":["『同じ色の玉』『同じ大きさの球』『同じ形のカード』→ 全部に番号を振って区別する","『サイコロを同時に3個投げる』→ 同時でも3個を区別して数える（区別しないと同様に確からしくない）","分母と分子で『順序を考えるか』が揃っているかを毎回確認する","『少なくとも1つ』→ 余事象を疑う","設定が複雑で数えにくい → 全事象の取り方をもっと素朴な単位に取り直せないか考える"],"procedure":["1. 登場する物すべてに番号を振り、区別できる状態にする","2. 全事象の個数を数える（これが分母）","3. 条件を満たす場合を、分母と同じ基準で数える（これが分子）","4. 分母・分子で『並べたか/選んだか』が揃っているか点検する","5. 答えが 0 以上 1 以下に収まるか、極端な場合（全部同じ色など）で検算する"],"worked":{"problem":"赤玉3個、白玉2個の計5個が入った袋から同時に2個取り出す。2個とも赤である確率を求めよ。","solution":["5個の玉に 1〜5 の番号を振り、すべて区別して考える（見た目が同じでも区別する）。","全事象は5個から2個を選ぶ組合せで C(5,2) = 10 通り。これらは同様に確からしい。","2個とも赤である場合は、赤3個から2個を選ぶ C(3,2) = 3 通り。","∴ 求める確率は 3/10。","","【区別しないとどうなるか】","玉を色でしか区別しないと、取り出し方は『赤赤』『赤白』『白白』の3通りに見え、確率は 1/3 となる。","しかしこの3つは起こりやすさが等しくない（赤赤は3通り、赤白は6通り、白白は1通りに対応する）。","同様に確からしくないものを数えて比を取っているので、この 1/3 は誤り。","検算：赤白の確率は 3×2/10 = 6/10、白白は 1/10。3/10 + 6/10 + 1/10 = 1 ○"]},"variants":["順列で数えても組合せで数えても、分母分子の基準が揃っていれば同じ答えになる。これは強力な検算手段（上の問題を順列で数えると 3·2/(5·4) = 3/10 で一致する）","余事象を取る（『少なくとも1個は赤』は『1個も赤でない』の余事象）","1個ずつ順番に取り出すと考えて、条件付き確率の積で書く（3/5 × 2/4 = 3/10）","対称性：どの玉も選ばれる確率は等しい、という性質を使うと数えずに済む場合がある"],"pitfalls":["同じ色の玉を区別せずに数え、分母を壊す（この単元の失点のほぼ全て）","分母は順列、分子は組合せ、と基準がずれる","『同時に投げる』を『区別しない』と読み違える","確率なのに場合の数を答えてしまう／和が1になる確認をしない"],"todaiUse":"東大の確率は設定が複雑で、根元事象の取り方を誤ると以降の議論が全て崩れる。(1) で小さい場合を具体的に数えさせ、そこで採用した数え方を (2)(3) でも使わせる誘導が多い。つまり (1) の数え方の設計そのものが採点対象になっている。","check":["サイコロを2個同時に投げるとき、出た目の和が7になる確率を求めよ","上の問題を『2個を区別しない』で数えるとどこが壊れるか説明せよ","赤3白2から2個取るとき、色が異なる確率を2通りの方法で求めて一致を確かめよ"],"stretch":"『同様に確からしい』が成り立たない設定（歪んだサイコロ、重みつきのくじ）では、比では計算できず、与えられた確率から積と和で組み立てるしかない。定義に戻る訓練になる。"},{"nodeId":"td-t-prob","title":"【東大型】確率の状態設計","core":"東大の確率は、何を状態と見るかを自分で決めさせてくる。そして状態の分類さえ正しく決まれば、残りの計算は易しいことがほとんどである。良い分類の条件は2つしかない。第一に、互いに排反で網羅的であること。第二に、同じ状態に属するなら、そこから先の遷移確率が等しいこと。第二の条件を満たさない粗い分類が最大の敗因で、これは『分類したつもりで、実は違うものを混ぜている』という形で現れる。逆に、対称性を使えば状態を大幅に減らせることが多く、ここに気づけるかどうかで計算量が数倍変わる。","trigger":["同じルールの操作が n 回繰り返される → 状態と遷移で捉える","『n回後に〜である確率』『ちょうどn回目に初めて〜』→ 漸化式","状態が多そうに見える → まず対称性で潰せないか考える（正多面体、円形配置、色の入れ替え）","直前だけでなく履歴に依存しそう → 状態に情報を足して履歴依存を消す","『初めて到達する』→ 到達済みを吸収状態として分ける"],"procedure":["1. n=1, 2 を実際に書き出し、何が起こりうるかを掴む","2. 『ここから先の動き方が同じ』ものをまとめて1つの状態にする","3. 状態が互いに排反かつ網羅的か確認する（確率の和が1になるか）","4. 遷移図を描き、各状態から出る矢印と確率を全部書く","5. 漸化式を立てる（状態が3つ以上なら連立、和=1で1本消せる）","6. 対称性でさらに状態を減らせないか、ここでもう一度考える","7. 解いたあと n=1, 2 を代入し、手で数えた値と一致するか検算する"],"worked":{"problem":"正四面体 ABCD の頂点上を点Pが動く。1回の操作で、Pは今いる頂点と辺で結ばれた3つの頂点のいずれかへ等確率で移動する。最初 A にいるとき、n回の操作後に A にいる確率 p_n を求めよ。","solution":["正四面体では、どの頂点も他の3頂点すべてと辺で結ばれている。","また B, C, D は A から見て完全に対等なので、『A にいる』『A 以外にいる』の2状態で足りる（対称性）。","n回後に A にいる確率を p_n とすると、A 以外にいる確率は 1 - p_n。","","A にいるとき：次の1手で必ず A を出るので、A に留まる寄与は 0。","A 以外にいるとき：その頂点から移動できる3頂点のうち A はちょうど1つなので、A へ移る確率は 1/3。","","よって p_(n+1) = (1/3)(1 - p_n)、p_0 = 1。","特性方程式 α = (1/3)(1 - α) より 3α = 1 - α、α = 1/4。","p_(n+1) - 1/4 = -(1/3)(p_n - 1/4) となり、p_n - 1/4 = (3/4)·(-1/3)^n。","","∴ p_n = 1/4 + (3/4)(-1/3)^n","","検算：p_0 = 1/4 + 3/4 = 1 ○。p_1 = 1/4 - 1/4 = 0 ○（1回で必ず A を出る）。","p_2 = 1/4 + (3/4)(1/9) = 1/4 + 1/12 = 1/3 ○（A以外の頂点から3つのうち1つが A）。","n→∞ で p_n → 1/4。4頂点が対等になるので直感とも合う。"]},"variants":["対称性が使えない設定では素直に状態を増やし、連立漸化式にする。p+q+r=1 で1本消して2元にするのが定石","一般項が出せない形なら、n=1,2,3 を書き出して予想し、数学的帰納法で示す（東大はこちらを要求することがある）","期待値の線形性を使うと、漸化式を立てずに済む場合がある（『何回目に初めて』ではなく『平均何回か』を聞かれたとき）","立方体・正八面体などでは『頂点までの距離』を状態に取ると、状態数が一気に減る"],"pitfalls":["分類が粗く、同じ状態の中に遷移確率の異なるものが混ざっている（最大の敗因）","逆に状態を増やしすぎて、立った漸化式が解けなくなる","対称性の確認を怠り、本来まとめられる状態を分けたまま計算する","確率の和が1になる検算をしない","p_0 で立てた漸化式に p_1 の初期条件を入れて添字が1ずれる"],"todaiUse":"サイコロ、カードの並べ替え、格子上や多面体上の点の移動、トーナメントなど、設定を変えて繰り返し出題される東大の主力テーマ。(1) 小さい n の具体値 →(2) 漸化式 →(3) 極限、という3段の誘導が定番で、(1) の数え方がそのまま (2) の状態設計のヒントになっている。","check":["立方体の8頂点を辺に沿って移動する点について、n回後に元の頂点にいる確率を求めよ（状態を『元の頂点からの距離 0,1,2,3』に取る）","上の正四面体の問題で、n回後に特定の頂点 B にいる確率を求めよ","サイコロを n 回投げ、出た目の和が3の倍数になる確率を求めよ（状態は和を3で割った余り）"],"stretch":"状態の個数が n に依存して増える設定では漸化式が立たない。その場合は直接数え上げるか、別のパラメータについて漸化式を立て直す。どちらも無理なら、実験して予想し帰納法で示す。"},{"nodeId":"ma-int-bound","title":"範囲で絞る（不等式評価で有限化）","core":"整数問題の手段は合同式・因数分解・評価の3つで、このうち評価は最も発想を要求する。やっていることは単純で、無限にある候補を不等式で有限個に閉じ込め、あとは全部調べるだけである。鍵になるのは、対称性のある方程式で『a ≦ b ≦ c としてよい』と大小を仮定し、最も小さい文字の上界を出すこと。この一言を置くかどうかで、調べる場合の数が数十分の一になる。逆にこれを置かないと、いつまでも場合が減らずに手が止まる。","trigger":["1/x + 1/y + 1/z = 1 のような分数の和が整数 → 大小を仮定して最小の文字を絞る","『自然数解をすべて求めよ』で、因数分解も合同式も効かない","式が対称式（文字を入れ替えても変わらない）→ 大小関係を仮定してよい","『〜を満たす組は有限個であることを示せ』→ 評価そのものが答え","文字の一つが極端に大きいと成り立たない構造が見える → 上界が取れる"],"procedure":["1. 対称性があれば a ≦ b ≦ c と仮定する（一般性を失わない、と根拠つきで書く）","2. 最小の文字に注目し、不等式で上界を出す（最小のものが最も大きく効くことを使う）","3. 有限個に絞れたら、各値について全部調べる","4. 各場合で残りの文字を決定する","5. 最後に仮定を外し、並べ替えをすべて書き出す"],"worked":{"problem":"1/x + 1/y + 1/z = 1 を満たす自然数の組 (x, y, z) をすべて求めよ。","solution":["式は x, y, z について対称なので、x ≦ y ≦ z としてよい（最後に並べ替えを考える）。","","【x の範囲を絞る】","x ≦ y ≦ z より 1/x ≧ 1/y ≧ 1/z だから、1 = 1/x + 1/y + 1/z ≦ 3/x。よって x ≦ 3。","また 1/x < 1 が必要（他の項が正なので）だから x ≧ 2。∴ x = 2 または 3。","","【x = 2 のとき】1/y + 1/z = 1/2。","y ≦ z より 1/2 ≦ 2/y、よって y ≦ 4。また 1/y < 1/2 より y > 2。∴ y = 3 または 4。","  y = 3 → 1/z = 1/2 - 1/3 = 1/6、z = 6","  y = 4 → 1/z = 1/2 - 1/4 = 1/4、z = 4","","【x = 3 のとき】1/y + 1/z = 2/3。","y ≦ z より 2/3 ≦ 2/y、よって y ≦ 3。また y ≧ x = 3。∴ y = 3。","  1/z = 2/3 - 1/3 = 1/3、z = 3","","∴ x ≦ y ≦ z のもとで (x,y,z) = (2,3,6), (2,4,4), (3,3,3)","  一般には、これらの並べ替えがすべて解。","","検算：1/2+1/3+1/6 = 3/6+2/6+1/6 = 1 ○　1/2+1/4+1/4 = 1 ○　1/3×3 = 1 ○"]},"variants":["因数分解で閉じ込める：1/x + 1/y = 1/n を (x-n)(y-n) = n² の形に変形すると、約数を調べるだけで済む","合同式で候補を減らしてから評価する（3手段は排他的ではなく、組み合わせて使う）","上界を出す不等式は複数ある。緩い評価だと調べる場合が増えるので、できるだけ強い評価を選ぶ","無限降下法：評価で最小の解を取り、そこからより小さい解を作って矛盾を出す"],"pitfalls":["大小の仮定を置かず、場合が無限に増えて手が止まる（この単元の失敗のほぼ全て）","『一般性を失わない』と書ける根拠（式の対称性）を確認せずに使う","最後に並べ替えを書き忘れ、解を数え落とす","不等号の向きを取り違える（最小の文字だから 1/x が最大、という対応を間違える）","等号成立の場合（y = z など）を重複して数える"],"todaiUse":"東大の整数は誘導が薄く、3手段のどれを使うかの選択から問われる。評価は最も発想を要するため差がつきやすい。単独の大問として出るほか、確率や数列との融合問題で『有限個であること』を示す部分に埋め込まれることもある。","check":["1/x + 1/y = 1/3 を満たす自然数の組をすべて求めよ（因数分解でも評価でも解けるので、両方試すこと）","x ≦ y ≦ z を満たす自然数で xyz = x + y + z となるものをすべて求めよ","上の問題で、大小の仮定を置かずに解こうとするとどうなるか試してみよ"],"stretch":"評価と無限降下の組み合わせ。『解が存在するとすれば、より小さい解が必ず作れる』という構造を見つけると、自然数の整列性から矛盾が出る。x²+y²=3z² の非存在証明がその典型。"},{"nodeId":"td-t-integer","title":"【東大型】整数の論証","core":"東大の整数は『解を求めよ』より『存在しないことを示せ』『〜であることを示せ』の比重が大きい。つまり証明として完結させる力を測っており、具体例をいくつか確認しただけでは点にならない。使える手段は合同式・因数分解・評価の3つで、どれを選ぶかは問題の形がほぼ決めている。手が止まるのは発想が足りないからではなく、この対応表を持っていないか、小さい場合の実験を飛ばしているかのどちらかである。","trigger":["『割った余り』『倍数である』『存在しない』→ 合同式（法をいくつに取るかが本体）","『積 = 定数』の形に変形できる → 因数分解して約数を調べる","『解をすべて求めよ』で候補が無限にある → 評価で有限化","『すべての自然数 n について』→ 数学的帰納法","素数が絡む → 素数の定義（p が ab を割るなら p は a か b を割る）に戻る","平方数が絡む → mod 3, 4, 8 を試す（平方数の取りうる余りが限られる）"],"procedure":["1. 何を示すのかを確定する（存在／非存在／すべての解／ある性質）","2. n = 1, 2, 3 で実験し、構造を掴む（ここを飛ばすと手段を選べない）","3. 3手段のどれが効くか試す。1つで決まらなければ組み合わせる","4. 証明として書く。仮定から結論への流れを切らさない","5. 『〜としてよい』『〜だから〜である』と書いた箇所すべてに根拠があるか点検する"],"worked":{"problem":"n を自然数とするとき、n² + n + 1 は 5 の倍数にならないことを示せ。","solution":["5 の倍数かどうかが問題なので、n を 5 で割った余りで分類する。","n ≡ 0, 1, 2, 3, 4 (mod 5) のいずれかであり、それぞれについて n² + n + 1 を mod 5 で計算する。","","n ≡ 0 のとき：0 + 0 + 1 ≡ 1","n ≡ 1 のとき：1 + 1 + 1 ≡ 3","n ≡ 2 のとき：4 + 2 + 1 = 7 ≡ 2","n ≡ 3 のとき：9 + 3 + 1 = 13 ≡ 3","n ≡ 4 のとき：16 + 4 + 1 = 21 ≡ 1","","いずれの場合も n² + n + 1 ≢ 0 (mod 5)。","∴ n² + n + 1 は 5 の倍数にならない。（証明終）","","【なぜ mod 5 か】問われているのが 5 の倍数性だから。ここは迷う余地がない。","【なぜ5通りで尽くせるか】どんな整数も 5 で割った余りは 0〜4 のいずれかであり、","合同式は積と和を保つので、余りだけで n²+n+1 の余りが決まる。ここが合同式を使う理由そのもの。"]},"variants":["合同式で決まらないときは法を変える（mod 3 で駄目なら mod 4, 8, 9 を試す）","因数分解して積の形にし、約数を全部調べる","評価で有限化してから、残りを合同式で潰す","背理法 ＋ 無限降下（『最小の解を取る』と宣言してから議論を始める）","数学的帰納法。示したい命題が弱すぎて回らないときは、より強い命題を立てて帰納する"],"pitfalls":["具体例で確認して満足し、一般の証明を書かない（東大では点にならない）","『x² が3の倍数 ⇒ x が3の倍数』に、3 が素数であることの言及がない","mod の取り方を1つ試して諦める","場合分けが網羅的であることを示さない","合同式で両辺を割ってしまう（法と互いに素なときしか割れない）"],"todaiUse":"単独の大問になる年が多く、誘導が薄いのが特徴。(1) で小さい場合を実験させ、(2) で一般の証明を書かせる構成が典型。(1) は答えを出すための問いではなく、(2) の方針を発見させるために置かれている。","check":["n³ - n が 6 の倍数であることを示せ","連続する2つの整数は互いに素であることを示せ","n² を 4 で割った余りは 0 か 1 に限ることを示し、それを使って x² + y² = 2003 に整数解がないことを示せ"],"stretch":"複数の法を同時に使って絞る。mod 4 と mod 9 の両方の条件を並べると候補が急激に減る。中国剰余定理は範囲外だが、条件を並べて絞るだけなら高校範囲で書ける。"},{"nodeId":"m2-locus","title":"軌跡（動点の条件を式にする）","core":"軌跡の問題でやることは決まっている。動く点を (x, y) と置き、条件をすべて式にし、余分な文字を消去する。難しさは消去そのものではなく、消去したあとに残る条件を落とさないことにある。消去した文字が実数として存在できる範囲、分母が 0 になる点、図形が退化する点。これらを書かずに『きれいな方程式が出た』で終えると、答えは必ず広すぎるものになる。軌跡は方程式を出す問題ではなく、点の集合を過不足なく決める問題である。","trigger":["『点Pが〜を満たしながら動くとき、Pの軌跡を求めよ』→ 定石の手順に乗せる","『〜の中点』『〜を m:n に内分する点』→ 元の点を文字で置いて、その条件を使う","媒介変数が入っている → 消去したうえで、その変数の存在条件を残す","『2点からの距離の比が一定』→ アポロニウスの円","条件に『垂直』『距離』が出る → ベクトルや距離の式で書ける"],"procedure":["1. 軌跡上の点を (x, y) と置く（動点と定点で文字を必ず分ける）","2. 条件に出てくる他の動点を s, t などで置く","3. 与えられた条件をすべて式に翻訳する","4. s, t を消去して x, y の関係式を作る","5. 消去した文字が実数として存在する条件を、x, y の条件として残す","6. 除外点を調べる（分母が0、2点が一致する、図形が退化する場合）","7. 十分性を確認する（求めた図形上の点がすべて条件を満たすか）"],"worked":{"problem":"円 x² + y² = 4 上を点Qが動くとき、定点 A(6, 0) と Q を結ぶ線分 AQ を 1:2 に内分する点Pの軌跡を求めよ。","solution":["Q の座標を (s, t) とおくと、Q は円上にあるので s² + t² = 4 …①","","P は線分 AQ を 1:2 に内分するので、内分点の公式より","P = ( (2·6 + 1·s)/3 , (2·0 + 1·t)/3 ) = ( (12 + s)/3 , t/3 )","","P の座標を (x, y) とおくと","x = (12 + s)/3 　より　 s = 3x - 12","y = t/3 　　　　より　 t = 3y","","これを①に代入して","(3x - 12)² + (3y)² = 4","9(x - 4)² + 9y² = 4","(x - 4)² + y² = 4/9","","∴ 中心 (4, 0)、半径 2/3 の円","","【十分性】逆に、この円上の任意の点 (x, y) に対して s = 3x-12, t = 3y と定めれば","①を満たす点 Q が存在し、P はその内分点になる。よって除外点はない。","","検算：Q が (2, 0) のとき P = ((12+2)/3, 0) = (14/3, 0)。","中心 (4,0) からの距離は |14/3 - 4| = 2/3 ○"]},"variants":["媒介変数表示のまま処理する：円上の点を Q(2cosθ, 2sinθ) と置き、θ を消去する","図形的に見る：この問題は A を中心とする相似変換（比 1/3）なので、円が円に写ることが即座に分かる。半径も 2×(1/3)=2/3 と暗算できる","ベクトルで処理する：OP = (2/3)OA + (1/3)OQ","複素数平面で処理する。回転が絡む条件のときは、これが圧倒的に短い"],"pitfalls":["消去して方程式が出た時点で終わりにし、実数条件や除外点を落とす（最頻出の失点）","動点 (x, y) と、条件に出てくる別の点を同じ文字で書いて論理が壊れる","十分性（逆の確認）を書かない","分母を払うときに、分母が 0 になる場合を落とす","『軌跡は円』と答えて、中心と半径を書かない"],"todaiUse":"軌跡が単独で大問になることは少なく、通過領域や面積計算の前段として出る。軌跡を求めさせたあとに、その曲線で囲まれた図形の面積を出させる、あるいは軌跡の存在範囲を問う構成が定番。つまりここでの除外点の扱いが、後半の答えに直結する。","check":["放物線 y = x² 上の2点 A(a, a²), B(b, b²) が ab = -1 を満たしながら動くとき、線分ABの中点の軌跡を求めよ","上の問題で、a, b が実数として存在する条件が中点の軌跡にどんな制約を与えるか確かめよ","2点 A(-1,0), B(2,0) からの距離の比が 1:2 である点の軌跡を求めよ"],"stretch":"軌跡が『求めた方程式の一部だけ』になる場合。存在条件によって範囲が制限されるケースを意識すると、通過領域の問題に自然に接続する。"},{"nodeId":"m2-region","title":"不等式の表す領域・領域上の最大最小","core":"領域の問題は2段構えになっている。前半は不等式を図示すること、後半はその領域上で何かを最大化することである。後半の鍵は視点の転換にあって、求めたい量を k と置き、k を含む図形（直線や円）を動かして、領域と共有点を持つような k の範囲を調べる。つまり k を『動かす図形のパラメータ』として扱う。最大値を与える点は、多くの場合、領域の頂点か、境界との接点のどちらかに現れる。","trigger":["『領域Dにおける ax + by の最大値』→ 直線 ax+by=k を平行移動する","『x² + y² の最大』→ 原点中心の円の半径を動かす","『y/x の最大』→ 原点を通る直線の傾きと読む","『(x-a)² + (y-b)² の最大』→ 点 (a,b) を中心とする円","境界が曲線 → 接する場合を必ず調べる（頂点だけでは足りない）","領域が非有界 → 最大値や最小値が存在しない可能性を疑う"],"procedure":["1. 領域を図示する。境界を含むか（実線/破線）を明示する","2. 最大化したい量を k と置き、k を含む図形を書く","3. その図形を動かし、領域と共有点を持つ k の範囲を調べる","4. 候補は領域の頂点と、境界への接点","5. 接する場合は判別式、または点と直線の距離で条件を出す","6. 境界を含まない場合、その値が最大値として『取れるか』を確認する"],"worked":{"problem":"領域 D: x ≧ 0, y ≧ 0, x + 2y ≦ 8, 2x + y ≦ 10 において、x + y の最大値を求めよ。","solution":["まず領域の頂点を求める。","・原点 (0, 0)","・x軸との交点：2x + y = 10 で y = 0 → (5, 0)（x + 2y ≦ 8 も満たす：5 ≦ 8 ○）","・y軸との交点：x + 2y = 8 で x = 0 → (0, 4)（2x + y ≦ 10 も満たす：4 ≦ 10 ○）","・2直線の交点：x + 2y = 8 と 2x + y = 10 を連立","　　x + 2y = 8 を2倍して 2x + 4y = 16、これから 2x + y = 10 を引いて 3y = 6、y = 2","　　x = 8 - 4 = 4　∴ (4, 2)","","領域 D は (0,0), (5,0), (4,2), (0,4) を頂点とする四角形（境界を含む）。","","x + y = k とおくと、これは傾き -1 の直線。k を大きくすると直線は右上へ平行移動する。","領域と共有点を持つ最大の k は、直線が領域から離れる直前の位置、すなわちどれかの頂点を通るとき。","","各頂点での x + y の値：","　(0,0) → 0　　(5,0) → 5　　(4,2) → 6　　(0,4) → 4","","∴ 最大値は 6（点 (4, 2) のとき）","","検算：(4,2) は x+2y = 4+4 = 8 ○、2x+y = 8+2 = 10 ○ で、2本の境界の交点上にある。","傾き -1 の直線が、傾き -1/2 と傾き -2 の2直線に挟まれた角の頂点で最大になるのは整合的。"]},"variants":["境界が曲線のときは接線条件（判別式 = 0 または点と直線の距離 = 半径）を使う","分数式 (y - b)/(x - a) は、定点 (a, b) を通る直線の傾きと読む","予選決勝法：一方の変数を固定して最大値を求め、そのあとで固定した変数を動かす","通過領域の問題と表裏の関係にある。逆像法で得た不等式は、そのまま領域の条件として使える"],"pitfalls":["境界を含む/含まないの処理を落とし、最大値が存在しないのに答えてしまう","頂点だけ調べて、曲線境界への接点を見落とす","領域が非有界なのに最大値を求めようとする","図を描かずに式だけで処理し、どこで最大になるかを見誤る","k の範囲を求めたあと、その k が実際に達成可能かを確認しない"],"todaiUse":"単独より融合で出る。数IIIの関数の値域と組み合わせたり、通過領域を求めさせたうえでその領域上の最大最小を問うたりする形が多い。線形計画法そのものを問う出題は少なく、『k を動かす』という考え方が使えるかを見ている。","check":["上の領域 D において 2x + 3y の最大値を求めよ（最大を与える頂点が変わることを確認する）","x² + y² ≦ 1 において x + y の最大値を求めよ（接線条件を使う）","x ≧ 0, y ≧ 0, x + y ≦ 1 において y/(x+2) の最大値を求めよ"],"stretch":"領域の定義に文字定数が含まれ、最大値がその定数によって変わる問題。場合分けの網羅性がそのまま採点対象になる。"},{"nodeId":"td-t-region","title":"【東大型】通過領域・存在条件","core":"通過領域は『∃t の条件に翻訳する』問題として説明されることが多いが、東大が本当に問うているのはその一段手前にある。∀（すべての t で）と ∃（ある t が存在して）を読み分ける力、そしてどちらの変数を先に固定するかを設計する力である。同じ問題でも、点 (x, y) を固定して t の存在条件を見る（逆像法）か、t を固定して x ごとの y の範囲を求めてから合併する（順像法）かで、難易度が何倍も変わる。方針の選択そのものが得点差になる、数少ないテーマの一つ。","trigger":["パラメータが2次以下で範囲が実数全体 → 逆像法（判別式）が最速","パラメータに範囲がついている → 逆像法だが、解の配置の問題になる","パラメータが三角関数や指数の中にあって整理しにくい → 順像法が有利","パラメータが2つ → 1つずつ処理する。どちらを先に動かすかで難易度が変わる","『すべての t で成り立つ』→ ∀。最小値・最大値の問題に翻訳する","『ある t が存在して』『通過する』→ ∃。解の存在条件に翻訳する"],"procedure":["1. ∀ か ∃ かを最初に確定する（ここを誤ると以降の作業がすべて無駄になる）","2. ∃ の場合：点を (X, Y) と固定し、t についての方程式と見て解の存在条件を求める","3. あるいは：t を固定して x ごとの y の範囲を出し、t を動かして合併する","4. t に範囲があれば、解の配置（軸の位置・端点の値）で処理する","5. 得られた条件を図示し、境界を含むかを判定する","6. 検算：領域内の点を1つ取り、対応する t を実際に求めて確認する"],"worked":{"problem":"実数 t が全実数を動くとき、放物線 y = x² - 2tx + 2t² が通過する領域を図示せよ。","solution":["【逆像法】点 (X, Y) が通過領域に属する条件は、Y = X² - 2tX + 2t² を満たす実数 t が存在すること。","t について整理すると　2t² - 2Xt + (X² - Y) = 0","これを t の2次方程式と見る（X, Y は定数）。実数解 t が存在する条件は判別式 ≧ 0。","D/4 = X² - 2(X² - Y) = -X² + 2Y ≧ 0","∴ Y ≧ X²/2","","求める領域は、放物線 y = x²/2 とその上側（境界を含む）。","","【順像法（別解）】x を固定し、y = 2t² - 2xt + x² を t の関数と見る。","= 2(t - x/2)² + x²/2　より、t が全実数を動くとき y の最小値は x²/2（t = x/2 のとき）。","y はいくらでも大きくなれるので、y ≧ x²/2。同じ答えが出る。","","検算：t = 0 のとき放物線は y = x²。点 (1, 1) は Y ≧ X²/2 すなわち 1 ≧ 1/2 を満たす ○","境界上の点 (2, 2) については、t = 1 のとき y = 4 - 4 + 2 = 2 ○（t = X/2 = 1 で境界に達する）"]},"variants":["逆像法：点を固定してパラメータの存在条件に落とす。パラメータが低次のとき最速","順像法：パラメータを固定して値域を求め、合併する。パラメータに範囲があるとき、または式が整理しにくいとき有利","上の問題のように両方で解けることは多い。試験場では計算が軽い方を選び、時間が許せばもう一方で検算する","包絡線として捉える（高校範囲外だが、答えの検算に使える。接線族なら包絡線が境界になる）"],"pitfalls":["∀ と ∃ を取り違える（答えが正反対になる。下の確認問題で必ず体感しておくこと）","パラメータの範囲の制約を落とし、余分な領域まで塗る","逆像法で判別式だけ見て、解が許された範囲にあるかの確認（解の配置）を飛ばす","境界を含むかどうかの判定を書かない","動点と固定点を同じ文字で書く"],"todaiUse":"東大の最重要テーマの一つ。数IIIの関数と組み合わせて『曲線群の通過領域』として出し、そのうえで領域の面積を計算させる2段構成が定番。誘導が薄く、逆像法と順像法のどちらを選ぶかから任される年もある。","check":["t が 0 ≦ t ≦ 1 を動くとき、直線 y = 2tx - t² の通過領域を求めよ（範囲がつくと解の配置が必要になることを体感する）","『すべての実数 t に対して y ≧ 2tx - t² が成り立つような点 (x, y)』の範囲を求めよ。∃版（y ≦ x²）と答えがどう違うか確認せよ","t が実数全体を動くとき、円 (x - t)² + y² = 1 の通過領域を求めよ"],"stretch":"パラメータが2つ (s, t) ある場合。片方を固定してもう片方で処理し、最後に固定した方を動かす。処理の順序を変えると難易度が大きく変わるので、両方の順序を試してから書き始める。"},{"nodeId":"ma-count-basic","title":"数え上げの原則（和の法則・積の法則・辞書式）","core":"数え上げで最初にすべきことは、公式を選ぶことではなく数える枠組みを決めることである。原理は2つしかない。排反な場合に分けて足す（和の法則）と、独立な選択を順に掛ける（積の法則）。順列も組合せも、この2つの帰結にすぎない。東大の確率で分母が作れない人は、この枠組みを持たずにいきなり C や P を使っている。数が小さければ辞書式に全部書き出す、という手が結局いちばん確実で、実験としても機能する。","trigger":["場合分けできる → 和の法則（ただし互いに排反であることを確認する）","段階に分けられる → 積の法則（各段階の選択肢数が、前の選択に依存しないことを確認する）","制約のある位置がある（先頭が0でない、一の位が奇数など）→ 制約のある場所から先に決める","数が小さい → 辞書式に全部書き出す。実験にもなる","『〜でない』が多い → 余事象","直接数えにくい → 1対1に対応する別のものを数える"],"procedure":["1. 何を1つと数えるのかを決める（区別する／しないをここで確定させる）","2. 段階に分けられるか、場合分けが必要かを判断する","3. 積の法則を使うときは、各段階の選択肢数が前の選択に依らないか確認する","4. 依存するなら、制約の強い段階を先に持ってくる","5. 和の法則を使うときは、場合が互いに排反か確認する","6. n を小さくして書き出し、答えと一致するか検算する"],"worked":{"problem":"1, 2, 3, 4, 5 の5個の数字から異なる3個を選んで3桁の整数を作る。奇数は何個できるか。","solution":["一の位が奇数であることが条件なので、制約の強い一の位から先に決める。","","一の位：1, 3, 5 のいずれかで 3 通り","百の位：残り4個から選んで 4 通り","十の位：残り3個から選んで 3 通り","","積の法則より 3 × 4 × 3 = 36 個","","【なぜ一の位を先に決めるか】","百の位から決めると、それが奇数か偶数かによって一の位の選択肢数が変わってしまい、","積の法則がそのまま使えなくなる。制約のある場所を先に固定するのが原則。","","検算：3桁の整数は全部で 5×4×3 = 60 個。","偶数は一の位が 2, 4 の 2 通りなので 2×4×3 = 24 個。36 + 24 = 60 ○"]},"variants":["余事象で数える（偶数を数えて全体から引く）","1対1対応をつけて、数えやすい別のものに置き換える","小さい場合を全部書き出して規則を見つけ、一般化する（東大では実験そのものが誘導になっていることが多い）","樹形図を描く。場合分けの構造が視覚化され、漏れに気づきやすい"],"pitfalls":["制約のある位置を後回しにして、選択肢数が前の選択に依存してしまう（最頻出）","和の法則で排反性を確認せず、重複して数える","区別する／しないを決めないまま数え始める","0 を含む問題で、先頭に 0 が来る場合を除き忘れる"],"todaiUse":"単独で問われることはないが、確率の分母を作る作業として毎回必要になる。東大の確率が難しいのは確率の理論ではなく、この数え上げの設計が複雑だから。誘導の (1) で小さい場合を数えさせるのは、ここで枠組みを作らせるため。","check":["0, 1, 2, 3, 4 から異なる3個を選んで3桁の整数を作るとき、何個できるか（先頭に0が来ない）","上の問題で偶数は何個か（一の位が0のときとそうでないときで場合分けが必要）","3桁の整数のうち、各位の数字がすべて異なるものは何個か"],"stretch":"数えにくいものを、1対1対応で数えやすいものに翻訳する技術。最短経路の総数を『右と上の並べ方』に読み替えるのがその典型で、東大の格子点問題にも直結する。"},{"nodeId":"ma-perm","title":"順列・組合せ","core":"P と C の違いは『並べるか、選ぶか』という言葉の違いではなく、順序の違いを別のものと数えるかどうかにある。C(n,r) = P(n,r)/r! という関係が示しているのは、組合せとは順列を r! 個ずつまとめて1つと見たものだ、ということである。この『まとめて割る』という見方を持っておくと、円順列でもじゅず順列でも、何個ずつまとめているのかを考えるだけで処理できる。公式を覚える対象ではなく、導ける対象にしておくこと。","trigger":["並び順に意味がある（座席、桁、順位、役職）→ P","選ぶだけで順序に意味がない（メンバー、部分集合）→ C","迷ったら P で数えてから、何個ずつ重複しているかを考えて割る","『少なくとも1人』→ 余事象","C(n, r) = C(n, n−r) を使うと計算が軽くなることが多い"],"procedure":["1. 順序に意味があるかを判定する","2. あるなら P(n,r) = n!/(n−r)!、ないなら C(n,r) = n!/{r!(n−r)!}","3. 判断に迷ったら、まず順序つきで数える","4. そのあと、同じものが何個ずつ重複しているかを考えて割る","5. n を小さくして書き出し、検算する"],"worked":{"problem":"8人の中から (1) 3人の委員を選ぶ方法 (2) 委員長・副委員長・書記を1人ずつ選ぶ方法 は、それぞれ何通りか。","solution":["(1) 誰が選ばれるかだけが問題で、順序に意味はない。","　C(8,3) = 8·7·6 / (3·2·1) = 56 通り","","(2) 同じ3人でも、誰が委員長かで別のものと数える。順序に意味がある。","　P(8,3) = 8·7·6 = 336 通り","","【2つの関係】","336 = 56 × 6 = 56 × 3!","同じ3人組に対して、役職の割り当て方が 3! = 6 通りある。","つまり順列は、組合せを 3! 倍に細分したもの。逆に C = P / r! と書けるのはこのため。","この対応を理解していれば、公式を忘れても復元できる。"]},"variants":["P で数えてから r! で割って C を得る（公式を忘れたときの復元法）","余事象を使う（『少なくとも1人は女子』は『全員男子』を引く）","パスカルの関係 C(n,r) = C(n−1,r−1) + C(n−1,r) を使う（着目した1人を含むか含まないかで分ける）","二項定理と結びつける（C(n,r) は (a+b)ⁿ の展開係数）"],"pitfalls":["区別の有無が曖昧なまま公式を選ぶ","『少なくとも』を直接数えようとして場合分けが爆発する","C(n,r) の計算で約分を先にせず、大きな階乗を計算してミスする","選んだあとに並べる問題で、選ぶ段階と並べる段階を混ぜてしまう"],"todaiUse":"道具として使う単元で、単独の出題はない。ただし東大の確率では『分母をどう数えるか』の選択が本体なので、P と C のどちらで数えるかを分母・分子で揃える判断が毎回必要になる。","check":["男子5人、女子4人から4人を選ぶとき、女子が少なくとも1人含まれる選び方は何通りか","8人を A, B の2つの部屋に分ける（どちらも空でない）方法は何通りか","C(10,3) と C(10,7) が等しいことを、意味から説明せよ"],"stretch":"二項係数の恒等式（C(n,0)+C(n,1)+…+C(n,n) = 2ⁿ など）を、数え方を変えて同じものを数えるという方法で証明する。組合せ論的証明の考え方は、東大の論証問題でも効く。"},{"nodeId":"ma-samekind","title":"同じものを含む順列・円順列・じゅず順列","core":"『割る』という操作の意味は、同値類で数えているということに尽きる。同じものを含む順列で n!/(p!q!…) と割るのは、全部区別して並べたあと、区別を消すと同じになるものが p!q!… 個ずつ現れるからである。円順列で n! を n で割るのも、回転して一致するものが n 個ずつあるから。この見方があれば公式は不要になり、さらに重要なことに、割ってはいけない場合（回転しても一致しないものが混ざる場合）を自分で判断できるようになる。","trigger":["同じ文字・同じ色が含まれる → 全部区別して並べ、同じものの個数の階乗で割る","円形に並べる → 回転を同一視。n で割る、または1つを固定する","裏返しても同じ（じゅず、ネックレス）→ さらに 2 で割る","『1つを固定する』方法のほうが、割り算より事故が少ない","最短経路の数え上げ → 『右3回・上2回』の並べ方に読み替える"],"procedure":["1. まず全部を区別して並べる（n! 通り）","2. 区別を消したとき、何個ずつが同じものになるかを数える","3. その個数で割る","4. 円順列は『1人を固定して残りを並べる』と考えると、割り算が不要になる","5. 小さい場合を書き出して検算する"],"worked":{"problem":"文字 A, A, B, B, B, C を1列に並べる方法は何通りか。","solution":["【解法1：区別して並べてから割る】","6文字を全部区別して並べると 6! = 720 通り。","ここで A 2個の区別を消すと、同じ並びが 2! = 2 個ずつ現れる。","同様に B 3個の区別を消すと 3! = 6 個ずつ現れる。","よって 720 / (2! × 3!) = 720 / 12 = 60 通り","","【解法2：位置を選ぶ】","6個の位置のうち、A を置く2箇所を選ぶ： C(6,2) = 15","残り4箇所から B を置く3箇所を選ぶ： C(4,3) = 4","残り1箇所に C が入る： 1","15 × 4 × 1 = 60 通り","","2通りの数え方が一致した。数え上げでは、この二重確認が最も確実な検算になる。"]},"variants":["位置を選ぶ方式（解法2）。同じものが3種類以上でも同じ手順で処理できる","円順列は1つを固定する（(n−1)! と覚えるのではなく、固定すると考える）","最短経路：右に p 回、上に q 回進む並べ方 (p+q)!/(p!q!) に帰着する","同じものを含む円順列は単純に割れないことがある（回転で自分自身に戻る配置が存在するため）"],"pitfalls":["回転して一致しないものが混ざっているのに、機械的に n で割る","じゅず順列で、左右対称な配置まで 2 で割ってしまう","同じものの個数を数え間違える","円順列で『1つ固定』と『n で割る』を両方やってしまう"],"todaiUse":"単独出題は少ないが、確率の分母として、また格子上の最短経路の数え上げとして頻出する。特に最短経路は、東大の格子点問題や確率の移動問題の下地になっている。","check":["碁盤の目状の道路で、左下から右上（右へ3区画、上へ2区画）へ行く最短経路は何通りか","男子3人と女子3人が円卓に座るとき、男女が交互になる並び方は何通りか","SUUGAKU の7文字を並べる方法は何通りか"],"stretch":"回転や裏返しで一致するものを正しく数える一般論（バーンサイドの補題）は高校範囲外だが、『自分自身と一致する配置は割れない』という感覚だけは持っておくと、色の塗り分け問題で事故を防げる。"},{"nodeId":"ma-partition","title":"組分け・重複組合せ（仕切り）","core":"組分けで迷うのは、2つの軸を意識していないからである。分けられる側（人・ボール）に区別があるか、分ける先（組・箱）に区別があるか。この2つを最初に確定させれば、あとは機械的に処理できる。組にラベルがあるなら割らない、なければ同じ大きさの組の個数の階乗で割る。一方、重複組合せはこれとは別の問題で、区別しないものを区別する箱に入れる数え方であり、仕切りを使って順列に帰着させる。この2つを混同しないことが第一歩になる。","trigger":["『A組・B組に分ける』→ 組に区別あり。割らない","『2つの組に分ける』（名前なし）→ 組に区別なし。同数の組の個数の階乗で割る","組の人数がすべて異なる → 入れ替わりようがないので割らない","『区別しないものを区別する箱に入れる』→ 重複組合せ（仕切り）","『x + y + z = n の非負整数解の個数』→ 重複組合せそのもの"],"procedure":["1. 分けられる側に区別があるか確認する","2. 分ける先（組・箱）に区別があるか確認する","3. 両方に区別あり → 順に選んでいく（積の法則）","4. 組に区別がない → 区別ありで数えてから、同じ大きさの組の個数の階乗で割る","5. 要素に区別がなく箱に区別あり → 仕切りを使う（重複組合せ）","6. 小さい場合で書き出して検算する"],"worked":{"problem":"6人を2人ずつ3つの組に分ける。(1) 組に A, B, C の名前がある場合 (2) 組に名前がない場合、それぞれ何通りか。","solution":["(1) 組に区別があるので、順に選んでいけばよい。","　A組に入る2人： C(6,2) = 15","　B組に入る2人： C(4,2) = 6","　C組に入る2人： C(2,2) = 1","　15 × 6 × 1 = 90 通り","","(2) 組に名前がないので、3つの組を入れ替えたものは同じ分け方になる。","　3つの組はすべて2人ずつで大きさが同じなので、入れ替え方は 3! = 6 通り。","　90 / 3! = 90 / 6 = 15 通り","","【注意：割ってよいのは大きさが同じ組どうしだけ】","たとえば6人を1人・2人・3人に分ける場合、3つの組は大きさが違うので入れ替わりようがない。","この場合は名前がなくても割ってはいけない： C(6,1)·C(5,2)·C(3,3) = 6·10·1 = 60 通り。"]},"variants":["重複組合せ：区別しない n 個を区別する k 箱に入れる方法は C(n+k−1, k−1) 通り。○ を n 個と仕切り | を k−1 本並べる問題に読み替える","x + y + z = 10 の非負整数解の個数は C(12, 2) = 66（○10個と仕切り2本の並べ方）","各箱に1個以上という条件があるときは、先に各箱に1個ずつ配ってから残りを配る","組分けを『各人がどの組に行くか』で数える方法（組に区別があるときのみ有効）"],"pitfalls":["組に区別があるのに割ってしまう（最頻出）","大きさの異なる組まで含めて階乗で割ってしまう","重複組合せと組分けを混同する","『空の組を許すか』の条件を読み落とす"],"todaiUse":"確率の分母、整数解の個数、多項式の係数など、いろいろな装いで現れる。東大では『区別があるかないか』を問題文から読み取らせる形で出るので、条件文の読解そのものが得点差になる。","check":["6人を1人・2人・3人の組に分ける方法は何通りか（組に名前はない）","x + y + z = 8 を満たす非負整数の組は何通りあるか","区別しないボール10個を、区別する3つの箱に、各箱1個以上入れる方法は何通りか"],"stretch":"分けられる側にも分ける先にも区別がない場合（自然数の分割）は、高校範囲の公式では扱えない。この場合は書き出すか漸化式を立てるしかない、という限界を知っておくこと。"},{"nodeId":"ma-incl","title":"包除原理・余事象で数える","core":"数えにくいものを直接数えないという判断が、数え上げの実力を最も分ける。『少なくとも1つ』は余事象、『A または B』は包除原理。包除原理の本質は、重複して数えた分を引き、引きすぎた分を足す、という交互の補正である。集合が3つなら、単独の和 − 2つの共通部分の和 + 3つすべての共通部分、という形になる。符号を間違えないための最も確実な方法は、ベン図を描いて各領域が何回数えられているかを確認することである。","trigger":["『少なくとも1つ』『1つ以上』→ まず余事象を検討する","『A または B』『どちらかを満たす』→ 包除原理","『どれも満たさない』→ 全体から包除原理の結果を引く","条件が3つ以上 → 符号に注意（ベン図で確認）","『誰も自分のものを受け取らない』（完全順列）→ 包除原理の典型","直接数えると場合分けが爆発する → 包除に切り替える合図"],"procedure":["1. 直接数えるのと余事象を数えるのとで、どちらが楽か比べる","2. 余事象を使うなら、全体の個数を確定させてから引く","3. 包除原理は |A∪B| = |A| + |B| − |A∩B|","4. 3つなら |A∪B∪C| = (単独の和) − (2つの共通の和) + |A∩B∩C|","5. ベン図で、各領域がちょうど1回ずつ数えられているか確認する"],"worked":{"problem":"1 から 100 までの整数のうち、2 でも 3 でも割り切れないものは何個か。","solution":["A を 2 の倍数の集合、B を 3 の倍数の集合とする。","","|A| = ⌊100/2⌋ = 50","|B| = ⌊100/3⌋ = 33","|A∩B| = 6 の倍数の個数 = ⌊100/6⌋ = 16","","|A∪B| = 50 + 33 − 16 = 67　（2 または 3 で割り切れるもの）","","求めるのはその余事象なので","100 − 67 = 33 個","","【なぜ 16 を引くのか】","6 の倍数は A でも B でも数えられており、2回数えられている。","1回分を引いて、ちょうど1回になるように補正している。","","検算：100以下で 2 でも 3 でも割り切れない数は、6 で割った余りが 1 または 5 のもの。","1〜96 に 16 周期ぶんで各2個 = 32 個、97〜100 では 97 と 100 のうち 97 のみ（97 = 6·16+1）。","32 + 1 = 33 ○"]},"variants":["余事象を取る（『少なくとも1つ』は 1 − 『1つもない』）","3つ以上の集合への一般化（符号が交互に入れ替わる）","完全順列（撹乱順列）の個数を包除原理で求める","確率でも同じ形が成り立つ：P(A∪B) = P(A) + P(B) − P(A∩B)"],"pitfalls":["3つ以上のとき符号を間違える（引きすぎ・足しすぎ）","余事象を取ったのに、元の条件のまま計算を続ける","『または』を排反だと思い込んで単純に足す","全体の個数を確定させないまま引き算を始める"],"todaiUse":"東大では、色の塗り分けや条件つきの数え上げで使う。直接数えると場合分けが爆発する設定をわざと作ってあり、包除原理や余事象に切り替えられるかどうかで所要時間が数倍変わる。","check":["1 から 100 までで、2, 3, 5 のいずれでも割り切れない整数は何個か","4人が自分の帽子を1つずつ持ち寄り、ランダムに1つずつ取るとき、全員が自分以外の帽子を取る場合は何通りか","3種類の文字 a, b, c を使って長さ4の文字列を作るとき、3種類すべてが現れるものは何通りか"],"stretch":"包除原理を確率で使う形（P(A∪B∪C) の展開）。さらに、条件が n 個ある場合の一般形と、そこから完全順列の個数が n!·Σ(−1)^k/k! と表せることを追ってみると、極限 1/e との関係まで見えてくる。"},{"nodeId":"ma-prob-indep","title":"独立試行・反復試行","core":"独立とは、一方の結果が他方の確率を変えないということであり、このとき確率は掛け算になる。反復試行の公式 C(n,k)·pᵏ·(1−p)ⁿ⁻ᵏ は暗記するものではなく、2つの部分の積として読むものである。C(n,k) は n 回のうちどの k 回で成功するかの選び方、pᵏ(1−p)ⁿ⁻ᵏ はその並び1つが起こる確率。この分解ができていれば、『初めて成功するのが k 回目』のように C がつかない類題にも自然に対応できる。","trigger":["『同じ試行を n 回繰り返す』→ 反復試行","『ちょうど k 回起こる』→ C(n,k)·pᵏ·qⁿ⁻ᵏ","『少なくとも1回』→ 余事象（1 −『1回も起こらない』）","『初めて成功するのが k 回目』→ 前の k−1 回は失敗、k 回目に成功。C はつかない","玉を戻すか戻さないか → 戻せば独立、戻さなければ独立でない（条件付き確率へ）"],"procedure":["1. 各回の試行が独立か確認する（前の結果が次の確率を変えないか）","2. 『どの回で起こるか』の場合の数を数える","3. その並び1つが起こる確率を計算する","4. 2 と 3 を掛ける","5. 『少なくとも』が出てきたら、余事象のほうが楽でないか必ず比べる"],"worked":{"problem":"1個のサイコロを4回投げる。(1) 1の目がちょうど1回出る確率 (2) 1の目が少なくとも1回出る確率 を求めよ。","solution":["各回の試行は独立で、1の目が出る確率は毎回 1/6。","","(1) ちょうど1回","　どの回で出るかの選び方： C(4,1) = 4 通り","　その並び1つが起こる確率： (1/6)¹ · (5/6)³ = 125/1296","　よって 4 × 125/1296 = 500/1296 = 125/324","","(2) 少なくとも1回","　直接数えると『1回・2回・3回・4回』の4通りを足すことになる。","　余事象『1回も出ない』を使うほうが速い。","　1回も出ない確率 = (5/6)⁴ = 625/1296","　よって 1 − 625/1296 = 671/1296","","検算：(1) の 125/324 = 500/1296 は (2) の 671/1296 より小さい。","『ちょうど1回』は『少なくとも1回』に含まれるので、大小関係は整合的 ○"]},"variants":["余事象を使う（『少なくとも』はほぼ常にこちらが速い）","『初めて成功するのが k 回目』は (1−p)^(k−1)·p。どの回かは選ばないので C がつかない","戻さない抽出（非復元）は独立でないので、条件付き確率の積で処理する","成功回数の期待値だけなら、線形性から np と即座に出る（分布を求める必要がない）"],"pitfalls":["独立でないのに掛け算する（玉を戻さない場合が典型）","『初めて〜』の問題に C をつけてしまう","『少なくとも1回』を直接数えて場合分けが増える","(5/6)³ のような累乗の計算ミス。約分は最後にまとめて行う"],"todaiUse":"単独では易しいので、他の要素と組み合わせて出る。特に確率漸化式では、各ステップの遷移確率を求める部分がこの反復試行の考え方になっている。ここが不安定だと、状態設計が正しくても答えが合わない。","check":["コインを5回投げて、表がちょうど3回出る確率を求めよ","サイコロを投げ続けるとき、初めて1の目が出るのが3回目である確率を求めよ","サイコロを4回投げて、1の目が2回以上出る確率を求めよ（余事象を使う）"],"stretch":"反復試行の確率 C(n,k)pᵏqⁿ⁻ᵏ を k の関数と見て、最大になる k を求める問題。隣接する項の比を取って 1 との大小を調べる、という手法は数列の最大項の議論と共通している。"},{"nodeId":"ma-prob-cond","title":"条件付き確率・原因の確率","core":"条件付き確率 P(B|A) = P(A∩B)/P(A) が意味しているのは、全体を A に縮めてから、その中で B の占める割合を測るということである。分母が全体から A に変わる、ただそれだけの操作にすぎない。難しく感じる原因はほぼ一つで、問題文のどちらが条件でどちらが結果かを取り違えることにある。『〜であったとき』と書かれているほうが条件、つまり分母になる。この読み取りさえ正確なら、あとは割り算である。","trigger":["『〜であったとき、〜である確率』→ 前者が条件（分母）","『〜と分かった。では〜だった確率は』→ 原因の確率。全確率の公式で分母を作る","玉を戻さずに続けて取り出す → 条件付き確率の積で処理する","状態を分けて考える必要がある → 確率漸化式への入口","検査の陽性・不良品の混入など、原因を逆算する設定 → ベイズ型"],"procedure":["1. どちらが条件（分母）かを問題文から確定させる","2. P(A∩B) と P(A) をそれぞれ求める","3. P(B|A) = P(A∩B) / P(A) で割る","4. 原因を逆算する型では、全確率の公式 P(A) = ΣP(Aかつ各原因) で分母を作る","5. 検算：条件付き確率も 0 以上 1 以下に収まるか確認する"],"worked":{"problem":"袋に赤玉3個、白玉2個が入っている。玉を1個ずつ2回続けて取り出す（取り出した玉は戻さない）。2回目が赤であったとき、1回目も赤であった確率を求めよ。","solution":["事象を A：2回目が赤、B：1回目が赤 とおく。求めるのは P(B|A)。","","【分子 P(A∩B)：1回目も2回目も赤】","　(3/5) × (2/4) = 6/20 = 3/10","","【分母 P(A)：2回目が赤】","　1回目が赤のとき： (3/5)×(2/4) = 3/10","　1回目が白のとき： (2/5)×(3/4) = 6/20 = 3/10","　これらは排反なので P(A) = 3/10 + 3/10 = 6/10 = 3/5","","【割る】","　P(B|A) = (3/10) ÷ (3/5) = (3/10) × (5/3) = 1/2","","∴ 1/2","","検算：P(A) = 3/5 は『1回目が赤である確率』と同じ値になっている。","何回目に取り出しても赤である確率は変わらない（対称性）ので、これは正しい。"]},"variants":["樹形図を描き、条件に当てはまる枝の確率の比を取る（視覚的で間違えにくい）","全確率の公式で分母を作る（原因が3つ以上あるときはこれが必須）","ベイズの定理は公式として覚える必要はない。定義から2行で導ける","対称性を使う（上の問題では『2回目が赤』の確率が1回目と等しいことがすぐ分かる）"],"pitfalls":["条件と結果を取り違え、分母を間違える（この単元の失点のほぼ全て）","非復元抽出なのに独立として掛け算する","分母を全体のままにしてしまい、条件で絞るのを忘れる","P(A∩B) と P(B|A) を混同する"],"todaiUse":"条件付き確率が単独で大問になることは少ないが、確率漸化式の立式は実質的にこの計算になっている。『n回後に状態Xにいるとき、次に状態Yへ移る確率』はまさに条件付き確率であり、ここが曖昧だと遷移図が書けない。","check":["2個のサイコロを投げ、出た目の和が偶数であったとき、両方とも偶数である確率を求めよ","上の袋の問題で、1回目が赤であったとき2回目も赤である確率を求めよ（答えを見比べると面白い）","袋Aには赤2白1、袋Bには赤1白3が入っている。袋を等確率で選んで1個取り出したら赤だった。袋Aを選んでいた確率を求めよ"],"stretch":"3つ以上の原因がある場合の逆算。全確率の公式で分母を作る手順が本質的に効いてくる。医療検査の偽陽性の議論（有病率が低いと陽性でも実際に病気である確率は低い）は、この計算の最も有名な応用。"},{"nodeId":"ma-prob-exp","title":"期待値（線形性）","core":"期待値の最大の武器は線形性である。E[X + Y] = E[X] + E[Y] は、X と Y が独立でなくても常に成り立つ。この事実を知っているかどうかで、解ける問題の範囲が大きく変わる。複雑な量を『起これば1、起こらなければ0』という小さな変数の和に分解し、各々の期待値（＝その事象が起こる確率）を足すだけでよい。全体の分布を求める必要がまったくない。東大では、まともに分布を求めると手に負えないが線形性を使えば数行で終わる、という形で出題される。","trigger":["『平均していくつか』『期待値を求めよ』","分布を求めるのが大変そうだ、と感じた瞬間 → 線形性で分解する","『〜の個数の期待値』→ 各要素に『含まれるなら1』の変数を割り当てて和にする","反復試行の成功回数の期待値 → 線形性から即座に np","分解できないときだけ、定義通り Σ(値 × 確率) を計算する"],"procedure":["1. 求めたい量が『何かの個数』や『合計』なら、小さな部分に分解できないか考える","2. 各部分について、起これば 1・起こらなければ 0 をとる変数を置く","3. その変数の期待値を求める（＝その事象が起こる確率そのもの）","4. 全部足す（独立でなくてよい。ここが線形性の強さ）","5. 分解できないなら、定義通り Σ(値 × 確率) を計算する"],"worked":{"problem":"1 から n までの番号がついた n 枚のカードを無作為に1列に並べる。左から k 番目に番号 k のカードが来ることを『的中』と呼ぶとき、的中する枚数の期待値を求めよ。","solution":["的中枚数の分布そのものを求めようとすると、完全順列（1枚も的中しない場合の数）が必要になり、","包除原理を使う重い計算になる。しかし期待値だけなら線形性で一瞬で出る。","","各 k (= 1, 2, …, n) に対して、変数 Xₖ を次のように定める。","　Xₖ = 1（k 番目に番号 k が来る）、Xₖ = 0（来ない）","","求める的中枚数は X = X₁ + X₂ + … + Xₙ。","","番号 k のカードが k 番目に来る確率は、どの位置も等確率だから 1/n。","よって E[Xₖ] = 1 × (1/n) + 0 × (1 − 1/n) = 1/n","","線形性より","　E[X] = E[X₁] + … + E[Xₙ] = n × (1/n) = 1","","∴ 的中枚数の期待値は、n によらず 1","","【ここが要点】X₁, …, Xₙ は互いに独立ではない（1枚が的中すると他の確率が変わる）。","それでも線形性は成り立つので、独立性を気にせず足してよい。","","検算：n = 2 のとき、並べ方は (1,2) と (2,1) の2通り。的中枚数は 2 と 0。","期待値は (2 + 0)/2 = 1 ○"]},"variants":["定義通り Σ(値 × 確率) を計算する（分解できないときの基本形）","反復試行の成功回数は np（各回に 0/1 の変数を置いて足すだけ）","状態ごとの期待値を未知数にして、期待値の漸化式を立てる（『平均何回で終わるか』型）","最大値・最小値の期待値は分解できないので、P(X ≧ k) を使うか定義通り計算する"],"pitfalls":["『独立でないから線形性は使えない』と誤解する（和については常に使える）","積の期待値を期待値の積にしてしまう（これは独立なときしか成り立たない）","期待値が実際に取りうる値である必要はないことに戸惑う（サイコロの目の期待値は 3.5）","分布を律儀に求めようとして、計算量に潰される"],"todaiUse":"単独でも出題されるが、線形性を使えば一瞬・使えなければ手に負えない、という形で差をつけてくる。カードの並べ替え、玉の取り出し、格子上の移動など、設定を変えて繰り返し現れる。","check":["サイコロを3回投げたとき、出た目の和の期待値を求めよ","5人が自分の帽子を持ち寄り、無作為に1つずつ取るとき、自分の帽子を取る人数の期待値を求めよ","2個のサイコロを投げたとき、出た目の最大値の期待値を求めよ（これは分解できないので定義通り計算する）"],"stretch":"期待値の漸化式。『ある状態から終了までに平均何回かかるか』を状態ごとに未知数として立て、連立方程式を解く。確率漸化式と同じ状態設計の技術がそのまま使える。"},{"nodeId":"m3-ineq-diff","title":"微分を用いた不等式の証明","core":"不等式 f(x) ≧ g(x) を示す手順は決まっている。差 h(x) = f(x) − g(x) を作り、h の最小値が 0 以上であることを微分で示す。手順自体は単純だが、実力が出るのは h′(x) の符号がすぐに決まらない場面である。そこで止まらずに h″(x) へ進み、h′ の増減から h′ の符号を決め、それから h の増減を決める——この二段階、必要なら三段階の階段を昇れるかどうかで差がつく。そしてこの技術の本当の価値は、はさみうちの材料を自分で作れるようになることにある。数IIIの極限問題の多くは、実はこの力に支えられている。","trigger":["『〜を示せ』の形で不等式が与えられている","相加相乗やコーシーでは処理できない（対数・指数・三角が混ざっている）","極限を求めたいが直接計算できない → 挟むための不等式を自分で作る","h′(x) の符号が determined しない → ためらわず h″(x) を調べる","n を含む不等式 → 微分ではなく帰納法かもしれない、と一度疑う"],"procedure":["1. 差 h(x) =（左辺）−（右辺）を作る","2. 定義域を確認する（対数なら真数条件、分数なら分母 ≠ 0）","3. h′(x) を計算し、符号を調べる","4. 符号が決まらなければ h″(x) を調べ、h′ の増減を出す。h′ の値が分かる点（多くは端点）と組み合わせて h′ の符号を確定させる","5. h の増減表を書き、最小値または端点での値を求める","6. 最小値 ≧ 0 を示す。等号成立条件も必ず述べる"],"worked":{"problem":"x > 0 のとき、e^x > 1 + x + x²/2 が成り立つことを示せ。","solution":["h(x) = e^x − 1 − x − x²/2 とおく。示したいのは x > 0 で h(x) > 0。","","【1回目の微分】","h′(x) = e^x − 1 − x","この符号は一目では決まらない。そこでもう一段進む。","","【2回目の微分】","h″(x) = e^x − 1","x > 0 のとき e^x > 1 なので h″(x) > 0。","よって h′(x) は x > 0 で単調増加。","","【h′ の符号を確定させる】","h′(0) = e⁰ − 1 − 0 = 0","h′ は単調増加で h′(0) = 0 だから、x > 0 では h′(x) > 0。","","【h の符号を確定させる】","よって h は x > 0 で単調増加。","h(0) = 1 − 1 − 0 − 0 = 0","したがって x > 0 では h(x) > 0。","","∴ x > 0 のとき e^x > 1 + x + x²/2　（証明終）","","【構造】微分するたびに『0 での値が 0』という情報が使えて、符号が1段ずつ確定していく。","この階段を降りていく形は、e^x の多項式による評価では常に現れる。","同じ手順で e^x > 1 + x + x²/2 + x³/6 も示せる。"]},"variants":["凹凸を使う：凸関数は接線の上側にあるので、接線の式との比較で不等式が出る","平均値の定理を使う（区間の設定と c の存在範囲の明示が必要）","相加相乗平均やコーシー・シュワルツで処理できないか先に検討する（使えれば微分より速い）","n を含む不等式は数学的帰納法。微分と併用することもある","両辺の対数を取ってから微分する（積や累乗の形のとき）"],"pitfalls":["1回微分で符号が決まらないところで止まってしまう（この単元の最大の壁）","定義域の端点での値を調べず、最小値の議論が完結しない","等号成立条件を書かない","『単調増加だから正』と書くだけで、起点の値（h(0) = 0 など）に触れない","定義域を確認せず、対数の真数が負になる範囲まで議論してしまう"],"todaiUse":"単独でも出るが、より多いのは極限問題の (1) として出る形。『(1) この不等式を示せ → (2) 極限を求めよ』という誘導では、(1) がはさみうちの材料そのものになっている。(1) を飛ばして (2) を解こうとすると、まず解けない設計になっている。","check":["x > 0 のとき log(1 + x) < x を示せ","x > 0 のとき x − x²/2 < log(1 + x) を示せ（2段階の微分が必要）","上の2つを合わせて lim[x→0] log(1+x)/x を求めよ（はさみうちの材料として使う）"],"stretch":"3回以上微分が必要な不等式。また、示したい不等式が弱すぎて挟めないときに、より強い不等式を自分で立て直す判断。東大の最上位帯はここを要求してくる。"},{"nodeId":"m3-int-ineq","title":"積分と不等式（面積比較・評価）","core":"求まらない量を、求まる量で挟む。これが理三で最も差がつく技術である。積分の値が初等関数で書けなくても、被積分関数の大小を評価すれば、面積の大小として不等式が作れる。特に重要なのが和と積分の比較で、Σ 1/k と log n の関係はその代表例になる。階段状の和と滑らかな曲線の下の面積を比べる、という図が頭にあるかどうかで見通しが変わる。ただし論証としては、被積分関数の単調性を先に示すことが必須で、これを抜かすと面積の大小を主張する根拠がなくなる。","trigger":["『〜を示せ』の対象に、直接計算できない積分や和が含まれている","Σ と ∫ が同じ問題に現れる → 面積比較を疑う","log n が評価の対象 → 1/x の積分と調和級数の比較","はさみうちの材料が要る → 積分で作れないか考える","『(1) 不等式を示せ → (2) 極限を求めよ』の誘導 → (1) が挟む道具","被積分関数が単調 → 区間の両端の値で挟める"],"procedure":["1. 被積分関数 f の単調性を調べる（微分するか、明らかなら理由を一言）","2. 区間 [k, k+1] 上で、f が減少なら f(k+1) ≦ f(x) ≦ f(k)","3. 各辺を [k, k+1] で積分する（幅が1なので、両端の値がそのまま不等式になる）","4. k について足し合わせ、Σ と ∫ の大小関係を作る","5. 求めたい量がその不等式の中央に来るよう整理する","6. 両端の極限を計算し、一致すればはさみうちで確定する"],"worked":{"problem":"n を 2 以上の整数とするとき、次を示せ。\n　　1/2 + 1/3 + … + 1/n < log n < 1 + 1/2 + … + 1/(n−1)","solution":["f(x) = 1/x は x > 0 で単調減少（f′(x) = −1/x² < 0）。","","【区間ごとの評価】","k ≦ x ≦ k+1 のとき、単調減少性より 1/(k+1) ≦ 1/x ≦ 1/k（等号は端点のみ）。","","各辺を x について k から k+1 まで積分する。区間の幅が 1 なので","　1/(k+1) < ∫[k→k+1] dx/x < 1/k","（f は定数でないので、狭義の不等号になる）","","【足し合わせる】","k = 1, 2, …, n−1 について足すと、中央の積分は繋がって ∫[1→n] dx/x = log n。","","左辺の和： 1/2 + 1/3 + … + 1/n","右辺の和： 1 + 1/2 + … + 1/(n−1)","","∴ 1/2 + 1/3 + … + 1/n < log n < 1 + 1/2 + … + 1/(n−1)　（証明終）","","【この不等式が効く場面】","右側から Σ[k=1..n] 1/k > log n が言えるので、n → ∞ で調和級数が発散することが従う。","また両側から、Σ[k=1..n] 1/k と log n の差が有界であることも分かる。","","検算：n = 2 のとき 1/2 < log 2 < 1。log 2 ≒ 0.693 なので成立 ○"]},"variants":["向きを逆にする：積分を和で評価する（数値積分の誤差評価と同じ発想）","台形で近似すると、長方形より精密な評価が得られる","被積分関数が単調でないときは、増減表を書いて区間を分ける","積分区間を平行移動・対称移動して、既知の積分に帰着させる","定積分と漸化式（I_n を I_(n−2) で表す）と組み合わせて、極限のオーダーを出す"],"pitfalls":["単調性を示さずに面積の大小を主張する（論証として成立しない）","区間の取り方（k から k+1 か、k−1 から k か）を誤り、和の範囲がずれる","等号の有無を検討せず、狭義／広義を取り違える","和の項数と積分区間の対応がずれる（n−1 項なのか n 項なのか）","評価が甘くて両端の極限が一致せず、挟めないまま進む"],"todaiUse":"理三の合否がここに出る、最上位帯のテーマ。単独で出るというより、(1) で不等式を作らせ、(2) でその不等式を使って極限や評価を求めさせる形で出る。誘導の意図を読めるかどうかが問われており、(1) を独立した小問だと思って解くと (2) で行き詰まる。","check":["上の不等式を使って、Σ[k=1..n] 1/k が n → ∞ で発散することを示せ","0 < ∫[0→1] xⁿ/(1+x) dx < 1/(n+1) を示し、n → ∞ の極限を求めよ","Σ[k=1..n] 1/√k と 2√n の大小を、同じ方法で比較せよ"],"stretch":"和と積分の差そのものを評価する（オイラー・マスケローニ定数に繋がる話）。高校範囲では定数の存在までは示せないが、差が単調で有界であることは示せる。東大の最難問はこの一歩手前まで踏み込んでくる。"},{"nodeId":"td-symmetry","title":"対称性を利用して場合を減らす","core":"「a ≦ b ≦ c としてよい」「原点を中心に取ってよい」——この一言で計算量が数分の一になる。東大の問題は、対称性を使うことを前提に難易度が設定されていることが多く、気づかずに全場合を計算すると時間内に終わらないよう作られている。ただし使えるのは対称性が実際に存在する場合だけで、根拠を書かずに「一般性を失わない」と宣言すると減点される。何を入れ替えても状況が変わらないのかを、書く前に一度確認する習慣をつけること。","trigger":["式が文字の入れ替えで変わらない（対称式）→ 大小関係を仮定してよい","図形に対称軸や対称中心がある → 座標をそこに合わせて取る","確率で複数の対象が対等 → 状態をまとめて数を減らせる","積分区間が原点対称 → 偶関数・奇関数で処理できないか見る","積分区間が [0, a] で被積分関数に a−x の構造がある → x → a−x の置換","回転対称な図形 → 複素数平面で回転として書ける"],"procedure":["1. 何を入れ替えても状況が変わらないかを確認する","2. 『〜としてよい』と書く根拠（対称性の所在）を明示する","3. 仮定を置いて調べる場合を減らす","4. 計算を進める","5. 最後に仮定を外し、対称な場合をすべて書き出す","6. 図形なら、対称性が最も活きる座標の取り方を選ぶ"],"worked":{"problem":"定積分 ∫[0→π] x·sin x / (1 + cos²x) dx を求めよ。","solution":["そのまま部分積分すると計算が重い。積分区間 [0, π] の対称性に注目する。","","求める値を I とおく。x → π − x と置換する（dx は符号が変わるが区間も入れ替わる）。","sin(π − x) = sin x、cos(π − x) = −cos x なので cos²(π − x) = cos²x。","つまり被積分関数のうち、x 以外の部分は置換で変わらない。","","I = ∫[0→π] (π − x)·sin x / (1 + cos²x) dx","","元の式と足し合わせると x の項が消える。","2I = ∫[0→π] {x + (π − x)}·sin x / (1 + cos²x) dx = π ∫[0→π] sin x / (1 + cos²x) dx","","残った積分は u = cos x と置換できる。du = −sin x dx、x: 0 → π のとき u: 1 → −1。","∫[0→π] sin x/(1 + cos²x) dx = ∫[−1→1] du/(1 + u²)","","さらに u = tanθ と置換すると du = dθ/cos²θ、1 + u² = 1/cos²θ、u: −1 → 1 で θ: −π/4 → π/4。","= ∫[−π/4→π/4] dθ = π/2","","よって 2I = π × (π/2) = π²/2","","∴ I = π²/4","","【要点】x → π − x で被積分関数の『x 以外の部分』が不変であることを見抜くのが全て。","この構造に気づけば3行、気づかなければ計算が終わらない。"]},"variants":["整数問題：対称式なら a ≦ b ≦ c と仮定し、最後に並べ替えを戻す","図形：対称軸を座標軸に取る、対称中心を原点に取る","確率：対等な対象をまとめて1つの状態にする（正四面体の頂点など）","積分：偶関数・奇関数、x → a−x の置換、周期性の利用","複素数平面：回転対称な配置は 1 の n 乗根で表す"],"pitfalls":["対称性が実際にはないのに『一般性を失わない』と書く","根拠を書かずに仮定だけ置く（東大は根拠の明示を見ている）","最後に仮定を外して並べ替えを書くのを忘れる","等号成立の場合（a = b など）を重複して数える","対称性に気づかず、力任せに計算して時間切れになる"],"todaiUse":"単独のテーマではないが、整数・確率・図形・積分のすべてに顔を出す。特に東大の空間図形と積分では、対称性を使うことを前提に計算量が設定されていることが多い。使えば10分、使わなければ40分、という差が現実に生じる。","check":["∫[0→π/2] sin x/(sin x + cos x) dx を、x → π/2 − x の置換で求めよ","∫[−1→1] x³/(1 + x²) dx を、被積分関数の偶奇から即答せよ","a + b + c = 3 を満たす正の実数について abc の最大値を求めよ（対称性から a = b = c を予想し、証明する）"],"stretch":"対称性が『ほぼ』ある場合。完全に対称ではないが、片方を固定すればもう片方に対称性が現れる、という構造を見抜く。予選決勝法（一方を固定して最大最小を取る）はこの考え方の一種。"},{"nodeId":"td-t-volume","title":"【東大型】立体の体積","core":"東大の体積は毎年のように出る最大配点帯であり、勝負どころは3つに集約される。座標の取り方、断面の把握、そして場合分けである。特に『2つの立体の共通部分』は東大が繰り返し出す形で、これは断面同士の共通部分を取る2次元の問題に落ちる。立体を3次元のまま想像しようとすると必ず詰まるので、x = t で切った瞬間に2次元の問題になるという手続きを身体に入れておくこと。そして最も落としやすいのが場合分けで、t の範囲によって断面の形が変わる設定を、東大は意図的に作ってくる。","trigger":["『2つの立体の共通部分の体積』→ 断面同士の共通部分を取る","球と円柱、円柱と円柱、球と円錐 → 断面はどちらも円か正方形。半径の大小で場合分けが生じる","回転軸が座標軸でない → 座標を回転させてから通常の回転体に帰着させる","『線分が通過する部分』→ 通過領域の3次元版。断面で通過領域を求める","断面の形が t によって変わりそう → 変わる境目の t を先に求めておく"],"procedure":["1. 対称性が最も活きるように座標を設定する","2. 切る向きを決める（迷ったら2通り試し、断面が単純なほうを採る）","3. 平面 x = t で切り、断面を y-z 平面上の2次元の図として描く","4. 断面の形が変わる境目の t を求め、場合分けを確定させる","5. 各場合で断面積 S(t) を求める","6. 区間ごとに積分して足す","7. 検算：端で S(t) = 0 になるか、既知の立体の体積と比べて妥当か"],"worked":{"problem":"原点を中心とする半径 1 の球と、z 軸を軸とする半径 1/2 の円柱がある。球の内部にあり、かつ円柱の外部にある部分の立体の体積を求めよ。","solution":["z 軸に垂直な平面 z = t で切る。断面は2次元の図形になる。","","【断面を求める】","球 x² + y² + z² ≦ 1 を z = t で切ると、x² + y² ≦ 1 − t²。","　→ 半径 √(1 − t²) の円（|t| ≦ 1 のとき）","円柱 x² + y² ≦ 1/4 を z = t で切ると、x² + y² ≦ 1/4。","　→ 半径 1/2 の円（t によらず一定）","","求める立体の断面は「球の断面から円柱の断面を除いた部分」＝ 円環。","","【場合分け】","球の断面の半径 √(1 − t²) と、円柱の半径 1/2 の大小で形が変わる。","　√(1 − t²) ≧ 1/2 　⇔ 　1 − t² ≧ 1/4 　⇔ 　t² ≦ 3/4 　⇔ 　|t| ≦ √3/2","","(i) |t| ≦ √3/2 のとき：円環になり、S(t) = π(1 − t²) − π/4","(ii) √3/2 < |t| ≦ 1 のとき：球の断面が円柱の中に完全に入るので、除いた残りは空。S(t) = 0","","【積分する】","V = ∫[−√3/2 → √3/2] {π(1 − t²) − π/4} dt = π∫[−√3/2 → √3/2] (3/4 − t²) dt","","偶関数なので 2 倍して 0 から積分できる。","= 2π [ (3/4)t − t³/3 ]₀^(√3/2)","= 2π { (3/4)(√3/2) − (1/3)(3√3/8) }","= 2π { 3√3/8 − √3/8 }","= 2π · (2√3/8) = 2π · √3/4","","∴ V = (√3/2)π","","検算：球全体の体積は 4π/3 ≒ 4.19。求めた値は (√3/2)π ≒ 2.72。","円柱に抜かれた分が約 1.47 で、球の3分の1程度。半径 1/2 の円柱が貫いていることを考えると妥当 ○","","【落とし穴】(ii) の場合分けを忘れて積分区間を [−1, 1] のままにすると、","S(t) が負になる領域まで足してしまい、答えが小さくなる。"]},"variants":["切る向きを変える（この問題では z 軸に垂直が最善だが、常にそうとは限らない）","円柱の側から考え、球から円柱内部の体積を引く（バームクーヘン型の分割）","カヴァリエリの原理：断面積が等しい立体は体積も等しい。検算に使える","回転体として処理できる部分と、できない部分を分ける","斜めの回転軸は、複素数平面の回転を使って座標変換してから処理する"],"pitfalls":["断面の形が変わる場合分けを落とす（東大が最も狙ってくる箇所）","立体を3次元で把握しようとして手が止まる","断面が円だと決めつける（2円柱の共通部分の断面は正方形）","積分区間を、立体が実際に存在する範囲ではなく、片方の立体の範囲で取る","座標設定が対称性を無視しており、式が汚いまま突き進む"],"todaiUse":"東大理系で毎年のように出題される最重要テーマ。共通部分・通過領域・斜回転が三大パターンで、いずれも『断面を2次元で捉える』一点に帰着する。配点が大きいので、ここを確実に取れるかどうかが理三の合否に直結する。","check":["2つの円柱 x² + y² ≦ 1 と x² + z² ≦ 1 の共通部分の体積を求めよ（断面が正方形になる）","上の問題で、断面が正方形になる理由を x = t の代入から説明せよ","半径 1 の球を、中心から距離 1/2 の平面で切ったときの小さい方の体積を求めよ"],"stretch":"線分や図形が動いて通過する部分の体積。断面を取ったうえで、その断面内での通過領域を求める必要があり、2次元の通過領域の技術と体積が合流する。東大の最難問はこの形で出る。"},{"nodeId":"td-t-eval","title":"【東大型】評価と極限の融合","core":"「(1) で不等式を示し、(2) でその不等式を使って極限を出す」——東大が最も好む構造である。ここで理解すべきは、(1) は独立した小問ではなく、(2) のために置かれているということ。だから (1) が解けたら必ず (2) で使う。逆に (2) で手が止まったら、まず (1) の結果を見返す。この誘導の読み方が身についているかどうかが、そのまま得点差になる。誘導を無視して (2) を正面から解こうとすると、まず解けないように設計されている。","trigger":["『(1) 不等式を示せ → (2) 極限を求めよ』の構成 → (1) をはさみうちに使う","I_n のように n が入った積分や数列 → 漸化式を作るか、評価して挟む","直接計算できない量が出てくる → 挟む以外に道はない","(1) で作った漸化式が (2) の和や極限に繋がる","『〜より小さいことを示せ』→ その評価が後で効く"],"procedure":["1. (1) の結論を正確に書き留める（これが後で使う道具）","2. (2) の対象が、その不等式の中央に来るように整理する","3. 両端の極限を計算する","4. 一致すればはさみうちの原理で確定（『はさみうちの原理より』と明記する）","5. 一致しなければ評価が甘い。より強い不等式を作り直す","6. 漸化式が与えられている場合は、それを繰り返し使って和や一般項に持ち込む"],"worked":{"problem":"I_n = ∫[0→1] xⁿ/(1 + x) dx （n = 0, 1, 2, …）とする。\n(1) 0 < I_n ≦ 1/(n+1) を示せ。\n(2) I_n + I_(n+1) = 1/(n+1) を示せ。\n(3) lim[n→∞] { 1 − 1/2 + 1/3 − … + (−1)^(n−1)/n } を求めよ。","solution":["(1) 0 ≦ x ≦ 1 のとき 1 ≦ 1 + x ≦ 2 だから、xⁿ ≧ 0 より","　　0 ≦ xⁿ/(1 + x) ≦ xⁿ","　積分して 0 ≦ I_n ≦ ∫[0→1] xⁿ dx = 1/(n+1)。","　被積分関数は x > 0 で正なので I_n > 0。よって 0 < I_n ≦ 1/(n+1)。","","(2) I_n + I_(n+1) = ∫[0→1] (xⁿ + x^(n+1))/(1 + x) dx","　　　　　　　　 = ∫[0→1] xⁿ(1 + x)/(1 + x) dx","　　　　　　　　 = ∫[0→1] xⁿ dx = 1/(n+1)","　分子が分母で割り切れる、という一点だけの計算。","","(3) まず I₀ = ∫[0→1] dx/(1 + x) = [log(1 + x)]₀¹ = log 2。","","　(2) の関係 I_(n+1) = 1/(n+1) − I_n を繰り返し使う。","　　I₁ = 1/1 − I₀ = 1 − log 2","　　I₂ = 1/2 − I₁ = log 2 − (1 − 1/2)","　　I₃ = 1/3 − I₂ = (1 − 1/2 + 1/3) − log 2","","　ここで S_n = 1 − 1/2 + 1/3 − … + (−1)^(n−1)/n とおくと、上の形から","　　log 2 − S_n = (−1)ⁿ I_n","　が成り立つ（n についての帰納法で示せる）。","","　(1) より 0 < I_n ≦ 1/(n+1) であり、1/(n+1) → 0。","　はさみうちの原理より I_n → 0。したがって |log 2 − S_n| = I_n → 0。","","　∴ lim[n→∞] S_n = log 2","","【誘導の構造】(1) は挟むための道具、(2) は和を作るための道具。","どちらも (3) のために置かれており、単独では意味を持たない。","検算：S₁ = 1、S₂ = 0.5、S₃ ≒ 0.833、S₄ ≒ 0.583 … log 2 ≒ 0.693 の周りで振動しながら収束 ○"]},"variants":["漸化式を作ってから極限へ（部分積分で I_n と I_(n−2) を結ぶ）","評価だけで極限を出す（漸化式を作らずに、上下から挟む）","区分求積と組み合わせる（和の極限を積分に翻訳してから評価する）","平均値の定理で不等式を作る","(1) の不等式が甘くて挟めないときは、被積分関数の評価を精密にし直す"],"pitfalls":["(1) を独立した小問だと思い、(2)(3) で使わない（最大の失点原因）","はさみうちを使ったのに『はさみうちの原理より』と書かない","下からの評価（0 < I_n）を書かず、上からだけで極限を主張する","係数が 1 に近いことを理由に極限が 0 だと決めつける","n の偶奇で符号が変わる構造を見落とす"],"todaiUse":"理三で最も差がつく最上位テーマ。3段構成の誘導で出るのが典型で、(1) と (2) は易しく作られていることが多い。つまり (1)(2) を確実に取り、(3) に手を伸ばすのが正しい戦い方であり、完答できなくても部分点で大きく稼げる。","check":["J_n = ∫[0→1] xⁿ e^x dx について 0 < J_n < e/(n+1) を示し、極限を求めよ","上の I_n について、n·I_n の極限を予想し、数値で確かめよ","I_n が単調減少であることを示せ"],"stretch":"極限が 0 になる速さ（オーダー）まで求めさせる問題。n·I_n や n²·I_n の極限を問う形で、より精密な評価が必要になる。ここまで来ると挟む不等式を自分で設計する力が問われる。"},{"nodeId":"td-reduce","title":"未知を既知に帰着させる（言い換えの技術）","core":"東大は初見の設定を出してくる。しかしその中身は、ほぼ必ず既習の型である。だから問題文の言葉のまま処理しようとすると手が止まり、設定を剥がして『これは何の問題か』を見抜けば、すでに持っている道具で解ける。この翻訳作業こそが受験数学の最上位の技術であり、パターン暗記だけで来た人が最後に止まるのもここである。逆に言えば、翻訳の引き出しを増やすことが、そのまま得点力になる。","trigger":["見たことのない設定 → 装飾を剥がし、何を求めるのかだけを抜き出す","『〜が存在する』→ 方程式の解の存在条件（判別式・値域）に翻訳","『すべての〜で成り立つ』→ 最小値・最大値の問題に翻訳","図形の条件 → 座標・ベクトル・複素数・面積のどれかに翻訳","数えにくい → 1対1に対応する別のものを数える","規則が見えない → n = 1, 2, 3 で実験する"],"procedure":["1. 問題文から装飾（物語・ゲーム・実験の設定）を全部剥がす","2. 何が変数で、何が定数で、何を求めるのかを書き出す","3. 条件をすべて数式にする","4. 『これは何の型か』を判定する（解の存在条件／最大最小／数え上げ／漸化式）","5. 既知の型に落ちたら、その型の手順で処理する","6. 落ちなければ、小さい場合を実験して構造を探す"],"worked":{"problem":"1辺の長さが 1 の正三角形 ABC の内部の点 P から、3辺に下ろした垂線の長さをそれぞれ p, q, r とする。p + q + r の値を求めよ。","solution":["垂線の足の位置を求めようとすると、点 P の座標を置くことになり計算が重くなる。","しかしこの問題は、幾何の問題ではなく面積の問題に翻訳できる。","","【翻訳】点 P と各頂点を結ぶと、三角形 ABC は3つの三角形に分割される。","　△PBC、△PCA、△PAB","この3つの面積の和が、元の三角形の面積に等しい。","","各三角形について、底辺は正三角形の1辺（長さ 1）、高さがそれぞれ p, q, r。","　(1/2)·1·p + (1/2)·1·q + (1/2)·1·r = （正三角形 ABC の面積）","","正三角形の面積は (√3/4)·1² = √3/4 なので","　(1/2)(p + q + r) = √3/4","","∴ p + q + r = √3/2","","【要点】P がどこにあっても値が変わらない（一定である）ことが結論。","座標を置いて計算しても出せるが、面積に翻訳すれば3行で終わる。","『長さの和』を『面積の和』に読み替えた、という一点がこの問題の全て。","","検算：P が重心のとき、p = q = r = 内接円の半径 = √3/6。","3倍して √3/2 ○"]},"variants":["図形 → 座標（計算で押し切る）／ベクトル（内積で角と長さ）／複素数（回転が絡むとき）／面積・体積（和が一定のとき）","数え上げ → 1対1対応（最短経路を『右と上の並べ方』に読み替える等）","『存在する』→ 判別式、値域、中間値の定理","『一定である』→ 具体的な位置で値を求めて予想し、一般に示す","整数 → 合同式・因数分解・評価のどれかに翻訳"],"pitfalls":["問題文の言葉のまま処理しようとして、計算が膨張する","設定に引きずられ、本質でない部分を丁寧に計算してしまう","既知の型に落ちているのに気づかず、一から考え直す","翻訳した先の条件が、元の条件と同値でない（必要条件だけになっている）","実験を飛ばして、いきなり一般の議論を始める"],"todaiUse":"東大の問題は『初見の設定 × 既習の型』という設計で作られている。誘導が薄い年ほどこの力が要求され、逆に誘導が丁寧な年は、その誘導自体が翻訳の道筋を示している。過去問を解くときは、答えが合ったかよりも『何に翻訳したか』を記録していくと蓄積になる。","check":["正四面体の内部の点から4つの面に下ろした垂線の長さの和は一定であることを示せ（体積で翻訳する）","n 個のさいころを同時に投げたとき、出た目の最大値が k である確率を求めよ（『最大値 ≦ k』から引く）","整数 x, y が x² + y² = z² を満たすとき、x, y の少なくとも一方は偶数であることを示せ（mod で翻訳する）"],"stretch":"翻訳の候補が複数あるとき、どれが最も軽いかを事前に見積もる判断。座標・ベクトル・複素数のどれで書くかで計算量が数倍変わることがあり、書き始める前に30秒考える価値がある。"},{"nodeId":"td-time","title":"150分の運用（大問の選択と撤退の判断）","core":"東大理系数学は6問150分。ここで理解しておくべきなのは、全問完答は必要ないということである。理三でも4完＋部分点で十分に戦える。したがって本番で問われるのは解く力だけではなく、どれを解きどれを捨てるかの判断でもある。最も多い失敗は、1問に40分を溶かして他が白紙になることで、これは実力の問題ではなく運用の失敗である。時間配分は知識ではなく訓練なので、9月以降に必ず実戦形式で練習しておくこと。","trigger":["開始直後 → まず全6問に目を通す。いきなり第1問から解き始めない","25分経って方針が立たない → 一旦離れる（後で戻る）","完答できそうにない → (1) だけでも解いて部分点を取る","残り15分 → 新しい問題に手を出さず、見直しと書き足しに使う","計算が異常に汚い → 方針が違う可能性を疑う"],"procedure":["1. 0〜5分：全6問を読み、A（すぐ解ける）B（時間をかければ解ける）C（手が出ない）に分類する","2. 5〜100分：A から順に処理する。1問あたり25分で打ち切り、次へ移る","3. 100〜135分：残した問題に戻る。または部分点の書き足しに回る","4. 135〜150分：計算の見直しと、答案の体裁の点検","5. C に分類した問題も、(1) だけは必ず手をつける"],"worked":{"problem":"本番の時間配分を、A2問・B2問・C2問と見積もった場合で組み立ててみる。","solution":["【0〜5分】全問を読む","　第1問 A（確率・見覚えのある型）","　第2問 C（見たことのない設定）","　第3問 B（体積・計算が重そう）","　第4問 A（微分・標準）","　第5問 B（整数・方針は立ちそう）","　第6問 C（複素数・条件が複雑）","","【5〜50分】A の2問を確実に取る（1問20分強）","　ここで確実に2完。焦らず、検算までやる。","","【50〜100分】B の2問に取り組む（1問25分）","　完答できれば4完。片方が途中で止まっても、そこまでの過程は書き切る。","","【100〜135分】C の2問の (1) に手をつける","　完答は狙わない。(1) が取れれば十分。手が出なければ、B の見直しに回る。","","【135〜150分】全体の見直し","　『とおく』の宣言、場合分けの網羅、結論の明示を確認する。","　計算ミスは別の方法で検算する（同じ計算を繰り返さない）。","","【この配分の考え方】","・4完＋部分点で理三の水準に届く。6完は狙わない。","・最も避けたいのは、C に40分かけて A の見直しができないこと。","・25分で撤退するルールを、模試で必ず一度は試しておくこと。","　本番で初めてやろうとしても、心理的にできない。"]},"variants":["得意分野から始めて勢いをつける（心理的な効果を重視する場合）","全問の (1) を先に片付けてから (2) 以降に戻る（部分点最大化に振る戦略）","難問を最初に読んでおき、他を解きながら頭の片隅で考えさせる","分野で決め打ちしない（『確率は得意』という思い込みで難問に突っ込まない）"],"pitfalls":["1問に固執して時間を溶かす（最も多い失敗）","試験中に時計を見ない","解けそうにないからと白紙で出す（方針だけでも部分点になり得る）","見直しの時間を確保しない","難易度の見積もりを最初にせず、第1問から順に解く"],"todaiUse":"本番そのもの。過去問演習では答えが合ったかだけでなく、各問に何分かけたかを必ず記録すること。時間の使い方は記録しない限り改善しない。","check":["過去問1年分を150分の通しで解き、各問にかけた時間を記録せよ","『25分で撤退』を実際にやってみて、心理的な抵抗の大きさを確認せよ","自分の答案を、方針・計算・記述のどこで失点したかに分類せよ"],"stretch":"分野ごとの得点期待値を自分で把握しておくこと。過去問での分野別正答率を記録すると、本番でのA/B/Cの見積もり精度が上がる。見積もりが当たるようになると、運用は一気に安定する。"},{"nodeId":"td-goal","title":"理三の合格ライン（数学で何点を取りにいくか）","core":"東大理系数学は6問150分、120点満点。ここで持つべき目標は満点ではない。理三合格者でも全問完答は稀で、実際には4完＋部分点、おおむね100点前後を取りにいくのが現実的な戦い方になる。この目標設定を誤ると、『全範囲を均一に完璧にしないと』という終わりのない状態から抜け出せなくなる。やるべきことは全部やることではなく、確実に取れる問題を落とさないことと、差がつく最上位テーマに手を伸ばせる状態を作ることの2つである。","trigger":["『全部やらないと不安』という状態 → 目標設定を見直す合図","数学が易しい年は差がつかない → 落とさないことが全て","数学が難しい年に差がつく → 評価・体積・論証の最上位技術が効く","苦手分野をゼロにするより、得意分野を確実にするほうが期待値が高い","直前期に新しい分野に手を出したくなる → やらない"],"procedure":["1. 目標を『6完』ではなく『4完＋部分点』に設定する","2. 確実に取れる標準問題を、絶対に落とさない状態にする（計算と記述の精度）","3. 差がつくテーマ（評価と極限、立体の体積、整数の論証、確率の状態設計）に手を伸ばす","4. 出題頻度の低い分野（データの分析、統計的推測、n進法）は割り切って捨てる","5. 直前期は新規ではなく、既習の精度を上げることに時間を使う"],"worked":{"problem":"配点から逆算して、どこで点を取るかを設計する。","solution":["【前提】6問 × 20点 = 120点満点（配点は公表されていないので、均等と仮定した目安）","","【4完＋部分点の内訳イメージ】","　完答4問　　　　　80点","　部分点2問（各10点程度）　20点","　　　　　　　　合計 約100点","","【この点を取るために必要なこと】","1. 標準問題を確実に完答する","　　→ 計算ミスをしない、場合分けを漏らさない、記述で減点されない","　　→ ここは知識ではなく精度の問題。メタ技能の項目が効く","","2. 難問で部分点を拾う","　　→ (1) を取る、方針だけでも書く","　　→ 白紙で出さない習慣","","3. 差がつくテーマに手が届く状態にしておく","　　→ 評価と極限、立体の体積、整数の論証、確率の状態設計","　　→ この4つは東大が繰り返し出すので、投資効率が高い","","【やらなくてよいこと】","・データの分析、統計的推測（二次では実質出ない）","・n進法などの低頻度テーマに時間をかけること","・全分野を均一の深さまで仕上げること","","【注意】ここに書いた点数はあくまで目安。","配点は非公表で、合格最低点も年によって大きく動く。","数値そのものより、『満点を狙わない』『落とさないことを優先する』という","設計の考え方を持ち帰ってほしい。"]},"variants":["得意科目で稼ぐ戦略（数学を80点に抑え、理科や英語で補う）","数学を武器にする戦略（100点超を狙い、他科目の変動を吸収する）","どちらを選ぶかは、他科目の状況で決まる。数学だけで決めない"],"pitfalls":["満点を目標にして、全範囲を均一に固めようとし時間切れになる","苦手分野をゼロにすることに時間を使いすぎる","難問ばかり練習して、標準問題の精度が落ちる","直前期に新しい参考書に手を出す","1回の模試の結果で戦略を変える（模試の判定は分散が大きい）"],"todaiUse":"これは解法ではなく、戦略の項目。過去問を解くたびに『この年なら何点取れたか』『どこを落としたか』を記録し、目標との差を確認する。差が『難問が解けないから』なのか『標準問題を落としているから』なのかで、次にやることが変わる。","check":["過去問1年分を解き、実際に何完できたかを数えよ","落とした点が「難問」由来か「計算ミス・記述」由来かに分類せよ","後者が多いなら、新しい分野より精度の訓練に時間を回すべきである"],"stretch":"他科目との配分。数学に投じる時間の限界効用が、理科や英語に投じた場合を下回っていないかを定期的に見直す。数学の点数を10点上げるコストと、他科目で10点上げるコストを比べる視点を持つこと。"},{"nodeId":"td-experiment","title":"実験する手癖（n=1,2,3 を書き出す）","core":"東大の問題は、方針が見えない状態から始まる。そして手を動かして規則を見つける以外に入口がない問題が、毎年のように出る。10分考えて紙が白いままなら、それは考えているのではなく実験を飛ばしている。小さい場合を書き出すことは泥臭い手段ではなく、正規の第一手である。実際、誘導の (1) は多くの場合この実験そのもので、出題者は『まず手を動かせ』と言っている。","trigger":["n を含む一般の主張が問われている → n = 1, 2, 3 を実際に書く","設定が複雑で全体像が見えない → 最小のケース（点2個、サイコロ1回、n=1）を作る","漸化式が型に当てはまらない → 数列を4〜5項書き出す","『〜であることを示せ』で構造が見えない → 具体例で構造を掴む","図形問題 → 正確な図を描く。これも実験のうち","誘導の (1) が『n = 1 のとき求めよ』→ そこに方針が埋まっている"],"procedure":["1. パラメータを最小にする（n = 1、点を2個、操作を1回）","2. 頭の中でやらず、実際に紙に書き出す","3. n = 2, 3 と増やし、何がどう変化するかを見る","4. 規則を予想する（数列なら一般項、確率なら状態の個数）","5. 予想を数学的帰納法か直接証明で示す","6.
