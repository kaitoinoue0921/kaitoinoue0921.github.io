    <p style="font-size:12.5px;color:var(--dim)">この判定は「解けたなら前提もできている」という推定によるものなので、
      やや甘めに出ます。診断で埋めた項目は ${PL.grantedHalfLife} 日で復習対象に浮上するので、
      本当は身についていない箇所はそこで炙り出されます。</p>
    <button class="btn" id="plgo">ここから始める</button>`;
  pl = null;
  $('#plgo').onclick = () => { closeDp(); view = 'next'; render(); };
  render();
}

/* ---------- 俯瞰マップ（単元レベル） ----------
   138項目を一度に出すと読めないので、単元（27個）に集約して全体を1枚に収める。
   単元間の矢印は、項目レベルの前提関係を単元単位に畳んだもの。 */
let mapMode = 'unit';
let mapFit = false;

function unitGraph(){
  const units = [...new Set(N.map(n => n.unit))];
  const dep = new Map(units.map(u => [u, new Set()]));
  for (const n of N) for (const p of n.prereq || []){
    const a = byId.get(p).unit, b = n.unit;
    if (a !== b) dep.get(b).add(a);
  }
  return { units, dep };
}
function unitDepth(u, dep, memo = new Map(), seen = new Set()){
  if (memo.has(u)) return memo.get(u);
  if (seen.has(u)) return 0;                    // 単元どうしが相互に依存する場合の保険
  seen.add(u);
  const ps = [...dep.get(u)];
  const d = ps.length ? Math.max(...ps.map(x => unitDepth(x, dep, memo, seen))) + 1 : 0;
  seen.delete(u); memo.set(u, d);
  return d;
}

function toggleHTML(){
  return `<div class="maptoggle">
    <button data-m="unit" class="${mapMode==='unit'?'on':''}">単元で俯瞰する</button>
    <button data-m="node" class="${mapMode==='node'?'on':''}">項目まで開く</button>
    ${mapMode === 'unit' ? `<button data-fit class="${mapFit?'on':''}"
      style="margin-left:8px">${mapFit ? '実寸で見る' : '画面に収める'}</button>` : ''}
  </div>`;
}

function drawUnitMap(){
  const { units, dep } = unitGraph();
  const memo = new Map();
  const info = new Map(units.map(u => {
    const ns = N.filter(n => n.unit === u);
    const done = ns.filter(n => isDone(n.id)).length;
    const les  = ns.filter(n => LES.has(n.id)).length;
    const ret_ = done ? ns.filter(n => isDone(n.id)).reduce((s,n) => s + ret(n.id), 0) / done : 0;
    return [u, { total: ns.length, done, les, ret: ret_, field: ns[0].field,
                 mon: (MON.get(u) || {}).stages?.[2] || '📘' }];
  }));

  // 東大レイヤー（分野をまたぐ総合項目）は深さが極端に大きく、横に間延びする原因になる。
  // 実質的にすべての後にくるものなので、右端の1列にまとめる。
  const TD = new Set(N.filter(n => n.field === '東大レイヤー').map(n => n.unit));
  const normal = units.filter(u => !TD.has(u));
  const maxD = Math.max(...normal.map(u => unitDepth(u, dep, memo)));
  const cols = new Map();
  for (const u of units){
    const d = TD.has(u) ? maxD + 1 : unitDepth(u, dep, memo);
    if (!cols.has(d)) cols.set(d, []);
    cols.get(d).push(u);
  }
  // 同じ列の中は分野順に並べると読みやすい
  const fieldOrder = [...new Set(N.map(n => n.field))];
  for (const arr of cols.values())
    arr.sort((a,b) => fieldOrder.indexOf(info.get(a).field) - fieldOrder.indexOf(info.get(b).field));

  const W = 172, H = 58, GX = 48, GY = 13;
  const maxRow = Math.max(...[...cols.values()].map(a => a.length));
  const width  = (Math.max(...cols.keys()) + 1) * (W + GX) + 40;
  const height = maxRow * (H + GY) + 40;
  const pos = new Map();
  for (const [d, arr] of cols) arr.forEach((u,i) => pos.set(u, { x: 20 + d*(W+GX), y: 20 + i*(H+GY) }));

  let edges = '', nodes = '';
  for (const u of units) for (const p of dep.get(u)){
    const a = pos.get(p), b = pos.get(u);
    if (!a || !b) continue;
    edges += `<path class="ue" d="M${a.x+W} ${a.y+H/2} C${a.x+W+GX/2} ${a.y+H/2}, ${b.x-GX/2} ${b.y+H/2}, ${b.x} ${b.y+H/2}"/>`;
  }
  for (const u of units){
    const p = pos.get(u), v = info.get(u);
    const pct = v.total ? v.done / v.total : 0;
    const col = pct === 0 ? 'var(--line)' : pct < .5 ? 'var(--hot)' : pct < 1 ? 'var(--warn)' : 'var(--ok)';
    const name = u.length > 10 ? u.slice(0,9) + '…' : u;
    nodes += `<g class="u ${v.les === v.total ? 'full' : ''}" data-u="${esc(u)}" transform="translate(${p.x},${p.y})">

/* ---------- つながり図（項目レベル） ---------- */
function drawMap(){
  const list = filtered();
  if (!list.length){ $('#view').innerHTML = '<div class="empty">該当なし</div>'; return; }
  const ids = new Set(list.map(n => n.id)), cols = new Map();
  for (const n of list){ const d = depth(n.id); if(!cols.has(d)) cols.set(d, []); cols.get(d).push(n); }
  const W=168, H=30, GX=66, GY=12;
  const maxRow = Math.max(...[...cols.values()].map(a => a.length));
  const width = (Math.max(...cols.keys())+1)*(W+GX)+40, height = maxRow*(H+GY)+40;
  const pos = new Map();
  for (const [d,arr] of cols) arr.forEach((n,i) => pos.set(n.id, {x:20+d*(W+GX), y:20+i*(H+GY)}));
  let e='', g='';
  for (const n of list) for (const p of n.prereq||[]){
    if (!ids.has(p)) continue;
    const a=pos.get(p), b=pos.get(n.id), hi = sel===n.id||sel===p ? ' hi':'';
    e += `<path class="e${hi}" d="M${a.x+W} ${a.y+H/2} C${a.x+W+GX/2} ${a.y+H/2}, ${b.x-GX/2} ${b.y+H/2}, ${b.x} ${b.y+H/2}"/>`;
  }
  for (const n of list){
    const p = pos.get(n.id), t = n.title.length>20 ? n.title.slice(0,19)+'…' : n.title;
    g += `<g class="n ${state(n)}${sel===n.id?' sel':''}" data-id="${n.id}" transform="translate(${p.x},${p.y})">
      <rect width="${W}" height="${H}"/><text x="7" y="13">${esc(t)}</text>
      <text x="7" y="24" style="font-size:8.5px;opacity:.6">${esc(n.unit)} · ★${n.todai} · この先${desc(n.id)}</text></g>`;
  }
  $('#view').innerHTML = toggleHTML() + `<p style="color:var(--dim);font-size:13px;margin:0 0 10px">
    左が前提、右がその上に乗る内容。矢印を左に辿れば「分からない理由」に必ず行き着く。
    上のフィルタで分野を絞ると読みやすくなります。</p>
    <div id="map"><svg width="${width}" height="${height}">${e}${g}</svg></div>`;
  $('#view').querySelectorAll('.n').forEach(x => x.onclick = () => open(x.dataset.id));

  for (const r of GM.gachaTable){ if (x < r.rate){ hit = r; break; } x -= r.rate; }
  const name = hit.items[Math.floor(Math.random()*hit.items.length)];

/* 入力のゆらぎを吸収する。
   日本語入力がオンのまま打つと全角（ｘ＾２）になるので、半角に直してから比較する。 */
function normalizeAnswer(v){
  return String(v)
    .replace(/[Ａ-Ｚａ-ｚ０-９＋－＊／＾（）．，＝]/g,          // 全角英数記号 → 半角
             c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/[−–—ー]/g, '-')                                   // 各種マイナス・長音 → ハイフン
    .replace(/[÷]/g, '/').replace(/[×]/g, '*')
    .replace(/√/g, 'root').replace(/[ππ]/g, 'pi')               // √ と π は綴りに寄せる
    .replace(/²/g, '^2').replace(/³/g, '^3')
    .replace(/\s|　/g, '')                                      // 空白（全角も）を除去
    .replace(/^\((.*)\)$/, '$1')                               // 全体を囲む括弧を外す
    .toLowerCase();
}

function bindDetail(id){

  });
  $('#fg') && ($('#fg').onclick = () => { learn(id, false); save(); open(id); render(); });
  $('#ch') && ($('#ch').onclick = () => {
    const c = S.box.find(b => b.kind === 'charm' && !b.used);
    if (!c) return;
    c.used = true;
    S.charms[id] = Date.now() + (c.name.includes('永久') ? 30 : 7) * DAY;
    save(); open(id); render();
  });
  $('#dpc').querySelectorAll('[data-go]').forEach(c => c.onclick = () => open(c.dataset.go));
}

function startQuiz(id){
  quiz = { id, i: 0, wrong: 0 };
  showQ();
}
function showQ(){
  const q = QZ.get(quiz.id), it = q.items[quiz.i], n = byId.get(quiz.id);
  $('#dpc').innerHTML = `<h2>${esc(n.title)}</h2>
    <div class="prog">習得テスト　${quiz.i+1} / ${q.items.length}
      ${it.type==='choice'?'方針の選択':it.type==='error'?'誤りの発見':'値の一致'}</div>
    <div class="qq">${esc(it.q)}</div>
    <div id="qa">${
      it.type === 'number'
        ? `<div class="anslabel">↓ ここに答えを入力してください</div>
           <div class="ansrow">
             <input class="qin" id="qnum" placeholder="答えを入力（半角）" autocomplete="off"
                    autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done">
             <button class="btn" id="qok">決定</button>
           </div>
           <div class="anshint">日本語入力はオフにしてください。全角で打っても判定はしますが、半角のほうが確実です。</div>`
        : it.options.map((o,i) => `<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')
    }</div><div id="qfb"></div>`;
  if (it.type === 'number'){
    const go = () => answer($('#qnum').value.trim());
    $('#qok').onclick = go;
    $('#qnum').onkeydown = e => { if (e.key === 'Enter' && !isComposing(e)) go(); };
    setTimeout(() => $('#qnum') && $('#qnum').focus(), 60);
  } else {
    $('#qa').querySelectorAll('.opt').forEach(b => b.onclick = () => answer(+b.dataset.i));
  }
}
function answer(a){
  const q = QZ.get(quiz.id), it = q.items[quiz.i];
  const norm = normalizeAnswer;
  const ok = it.type === 'number'
    ? (it.accept || [it.answer]).some(x => norm(x) === norm(a))
    : a === it.answer;
  if (!ok) quiz.wrong++;
  if (it.type !== 'number'){
    $('#qa').querySelectorAll('.opt').forEach((b,i) => {
      if (i === it.answer) b.classList.add('ok');
      else if (i === a)    b.classList.add('ng');
      b.onclick = null;
    });
  } else {
    $('#qok').disabled = true; $('#qnum').disabled = true;
  }
  $('#qfb').innerHTML = `<div class="fb ${ok?'ok':'ng'}">
      <b>${ok ? '正解' : '不正解'}</b>${it.type==='number' && !ok ? `　答え: ${esc(it.answer)}` : ''}<br>${esc(it.explain)}</div>
    <button class="btn" id="qnx">${quiz.i+1 < q.items.length ? '次へ' : '結果を見る'}</button>`;
  $('#qnx').onclick = () => { quiz.i++; quiz.i < q.items.length ? showQ() : finish(); };
}
function finish(){
  const n = byId.get(quiz.id), q = QZ.get(quiz.id);
  const wrong = quiz.wrong, pass = wrong === 0, first = !isDone(quiz.id);
  const e = pass ? wt(n) * (first ? 10 : 3) : 0, g = pass ? (first ? 3 : 1) : 0;
  if (pass){ learn(quiz.id, true); gain(e, g); }
  else if (isDone(quiz.id)) { learn(quiz.id, false); save(); }
  const id = quiz.id; quiz = null;
  $('#dpc').innerHTML = `<h2>${esc(n.title)}</h2>
    <div class="fb ${pass?'ok':'ng'}" style="font-size:15px">
      <b>${pass ? '全問正解 — 習得' : `不合格（${wrong} 問ミス）`}</b><br>
      ${pass ? `EXP +${Math.round(e)}　💎 +${g}　次の復習は約 ${S.rec[id].s} 日後`
             : '1問でも誤ると習得になりません。落とし穴を読み直して、もう一度。'}</div>
    <button class="btn" id="again">もう一度</button>
    <button class="btn sec" id="back">解説に戻る</button>`;
  $('#again').onclick = () => startQuiz(id);
  $('#back').onclick  = () => open(id);
  render();
}

const closeDp = () => { quiz = null; pl = null; $('#ov').classList.remove('on'); $('#dp').classList.remove('on'); };

/* ---------- 過去問の分類と分析 ----------
   問題文は載せない（著作権）。載せるのは「何年の第何問が何のテーマか」という分類だけ。
   これだけで、頻度・周期・自分の手つかず領域が定量的に見える。 */
const allExams = () => [...PE.exams, ...(S.exams || [])];

function themeStat(){
  const ex = allExams();
  const nowY = new Date().getFullYear();
  return PE.themes.map(t => {
    const hit = ex.filter(e => e.themes.includes(t.id));
    const years = [...new Set(hit.map(e => e.year))].sort((a,b) => b-a);
    const recent = hit.filter(e => e.year >= nowY - 10).length;      // 直近10年の出題数
    // 出題された年の間隔（何年おきに出ているか）
    const gaps = years.slice(1).map((y,i) => years[i] - y);
    const avgGap = gaps.length ? gaps.reduce((a,b)=>a+b,0)/gaps.length : null;
    const ns = t.nodes.filter(id => byId.has(id));
    const done = ns.filter(id => isDone(id)).length;
    return { ...t, count: hit.length, recent, last: years[0] || null, years, avgGap,
             done, total: ns.length, ready: ns.length ? done/ns.length : 0 };
  }).sort((a,b) => b.count - a.count || (b.last||0) - (a.last||0));
}

function pastHTML(){
  const ex = allExams();
  const st = themeStat();
  const nowY = new Date().getFullYear();
  const rows = st.map(t => {
    if (t.obsolete) return `<div class="exrow" style="opacity:.45">
      <span class="cnt">${t.count}</span>
      <span class="th">${esc(t.name)} <span style="font-size:11px;color:var(--dim)">現行課程では範囲外</span></span>
      <span class="last">最後 ${t.last}年</span><span class="mast" style="color:var(--dim)">対策不要</span></div>`;
    // 頻出なのに手つかず＝最優先で埋めるべき穴
    const gap = t.recent >= 3 && t.ready < 0.5;
    const col = t.ready === 1 ? 'var(--ok)' : t.ready >= .5 ? 'var(--warn)' : 'var(--hot)';
    const since = t.last ? nowY - t.last : null;
    // 平均間隔より長く出ていない＝そろそろ来る
    const due = t.avgGap && since !== null && since > t.avgGap * 1.5 && t.count >= 4;
    return `<div class="exrow ${gap?'gap':''}">
      <span class="cnt">${t.count}</span>
      <span class="th">${esc(t.name)}
        ${gap ? '<span style="color:var(--hot);font-size:11px">← 直近10年で'+t.recent+'回出ているのに手つかず</span>' : ''}
        ${due ? '<span style="color:var(--warn);font-size:11px">← 平均'+t.avgGap.toFixed(1)+'年おきだが'+since+'年出ていない</span>' : ''}</span>
      <span class="last">直近10年 <b>${t.recent}</b>回${t.last ? ` / 最後 ${t.last}年` : ''}</span>
      <span class="mast" style="color:${col}">習得 ${t.done}/${t.total}</span>
    </div>`;
  }).join('');

  const byYear = {};
  for (const e of ex) (byYear[e.year] ??= []).push(e);
  const years = Object.keys(byYear).sort((a,b) => b-a);
  const list = years.map(y => `<div class="yearblk"><b>${y}年</b>${
    byYear[y].sort((a,b)=>a.no-b.no).map(e => `<span class="exchip ${e.verified?'v':''}"
      title="${esc((e.orig||[]).join('・') || e.summary || '')}">第${e.no}問 ${e.themes.map(id => esc((PE.themes.find(t=>t.id===id)||{}).name||id)).join('・')}${e.verified?' ✓':''}</span>`).join('')
  }</div>`).join('') || '<div class="empty">まだ記録がありません</div>';

  return `<div class="doc">
    <div class="warnbox"><b>問題文は載せていません。</b>入試問題の文章には著作権があるためです。
      ここに記録するのは「何年の第何問が、何のテーマだったか」という分類だけ。
      それでも、頻度・周期・自分の穴を出すには十分です。<br>
      <b>✓ が付いているものは出典で確認済み</b>。それ以外は自分で入力した記録です。</div>

    <div class="exform">
      <div style="font-weight:700;margin-bottom:4px">過去問を記録する</div>
      <div style="font-size:12.5px;color:var(--dim)">赤本を開いて、各大問のテーマを選ぶだけ。1問10秒、25年分でも30分ほどで埋まります。</div>
      <div class="r">
        <input id="exYear" type="number" placeholder="年度" value="${nowY - 1}">
        <span>年　第</span><input id="exNo" type="number" placeholder="1" value="1" style="width:64px"><span>問</span>
        <select id="exTheme">${PE.themes.map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select>
        <select id="exTheme2"><option value="">（2つ目のテーマ・任意）</option>
          ${PE.themes.map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select>
        <button class="btn" id="exAdd" style="margin:0">記録する</button>
      </div>
    </div>

    <h3>テーマ別の出題（記録 ${ex.length} 問 / ${Math.min(...ex.map(e=>e.year))}〜${Math.max(...ex.map(e=>e.year))}年）</h3>
    <p style="color:var(--dim);font-size:12.5px;margin:0 0 10px">
      左の数字は全期間の出題回数。<b style="color:var(--hot)">赤い行＝直近10年で3回以上出ているのに、項目を半分も習得していない</b>もの。ここが最優先の穴です。<br>
      <b style="color:var(--warn)">黄色の注記＝平均の出題間隔より長く出ていない</b>テーマ。周期から見てそろそろ来る可能性があります。</p>
    ${rows}

    <h3>年度別の記録</h3>
    ${list}
    ${S.exams && S.exams.length ? `<button class="btn sec" id="exClear">自分で入力した記録を消す（${S.exams.length}件）</button>` : ''}

    <h3>この表の使い方</h3>
    <ul>
      <li>回数が多く、最後に出てから年数が経っているテーマは、次に出る可能性が高い</li>
      <li>赤い行（頻出なのに手つかず）から順に、その項目を習得していくのが最短</li>
      <li>記録は「進捗を書き出す」でJSONに含まれるので、端末を変えても引き継げます</li>
    </ul>
    <p style="color:var(--dim);font-size:12px">${esc(PE.policy.copyright)}</p>
    ${PE.policy.source ? `<h3>出典</h3>
      <p style="font-size:12.5px">分野の分類は <b>${esc(PE.policy.source)}</b>。<br>
      ${esc(PE.policy.sourceNote || '')}</p>` : ''}
  </div>`;
}

function bindPast(){
  const add = $('#exAdd');
  if (add) add.onclick = () => {
    const y = +$('#exYear').value, no = +$('#exNo').value;
    if (!y || !no) return;
    const th = [$('#exTheme').value, $('#exTheme2').value].filter(Boolean);
    S.exams = S.exams || [];
    S.exams.push({ year: y, no, themes: th, verified: false });
    save(); render();
  };
  const clr = $('#exClear');
  if (clr) clr.onclick = () => {
    if (confirm('自分で入力した過去問の記録を全て消しますか？')) { S.exams = []; save(); render(); }
  };
}
