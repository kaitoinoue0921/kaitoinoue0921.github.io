予想が立たなければ n = 4, 5 まで伸ばす。たいていそこで見える"],"worked":{"problem":"a₁ = 1、a_(n+1) = a_n / (1 + a_n) で定まる数列 {a_n} の一般項を求めよ。","solution":["この漸化式は等比型でも特性方程式型でもなく、既知の型に当てはまらない。","そこで実際に書き出す。","","a₁ = 1","a₂ = 1 / (1 + 1) = 1/2","a₃ = (1/2) / (1 + 1/2) = (1/2) / (3/2) = 1/3","a₄ = (1/3) / (1 + 1/3) = (1/3) / (4/3) = 1/4","","【予想】a_n = 1/n","","【数学的帰納法で証明】","n = 1 のとき a₁ = 1 = 1/1 で成立。","n = k で a_k = 1/k と仮定すると","　a_(k+1) = (1/k) / (1 + 1/k) = (1/k) / ((k+1)/k) = 1/(k+1)","よって n = k+1 でも成立。ゆえにすべての自然数 n で a_n = 1/n。","","【別解：逆数を取る】","漸化式の両辺の逆数を取ると","　1/a_(n+1) = (1 + a_n)/a_n = 1/a_n + 1","b_n = 1/a_n とおくと b_(n+1) = b_n + 1、b₁ = 1。つまり公差1の等差数列で b_n = n。","∴ a_n = 1/n","","【要点】別解のほうが鮮やかだが、逆数を取るという発想は実験で 1, 1/2, 1/3, 1/4 という並びを","見たあとなら自然に出てくる。実験は答えを予想するだけでなく、方針そのものを教えてくれる。"]},"variants":["実験 → 予想 → 帰納法（最も汎用的な流れ）","実験で置き換えのヒントを得る（逆数、対数、差を取る）","確率なら n = 1, 2 の場合を樹形図で書き、状態の分類を発見する","整数なら小さい値を代入し、mod をいくつに取るかの当たりをつける","図形なら特殊な位置（正三角形、直角、中点）で試して予想を立てる"],"pitfalls":["実験を飛ばして一般の議論から入り、手が止まる（この項目の存在理由そのもの）","頭の中だけで計算して、間違ったまま予想を立てる","n = 1, 2 だけで打ち切り、規則を見誤る（n = 3, 4 まで伸ばす）","予想を書いただけで証明を書かない（実験は証明ではない）","実験の計算ミスに気づかず、存在しない規則を追いかける"],"todaiUse":"東大は誘導の (1) を実験に充てることが多い。『n = 1 のときを求めよ』『具体的に書き出せ』という小問は、点を取らせるためではなく、(2) 以降の方針を発見させるために置かれている。逆に誘導がない年は、自分で実験を始められるかどうかが分かれ目になる。","check":["a₁ = 2、a_(n+1) = 2a_n/(a_n + 1) の一般項を、実験して予想し帰納法で示せ","1 から n までの整数の3乗の和を n = 1, 2, 3, 4 で計算し、規則を予想せよ","サイコロを n 回投げて出た目の積が偶数になる確率を、n = 1, 2 で数えてから一般化せよ"],"stretch":"実験しても規則が見えない場合。見方を変える（差を取る、比を取る、階差の階差を見る、素因数分解する）と現れることがある。この『見方の引き出し』は経験の蓄積そのもの。"},{"nodeId":"td-argument","title":"場合分けを漏らさない・同値性を保つ記述","core":"東大の採点は論理の飛躍に厳しく、答えが合っていても過程で落ちる。押さえるべきは2点しかない。場合分けが排反かつ網羅的であること、そして式変形が同値であることである。特に危ないのが、両辺を2乗する・両辺に文字を掛ける・分母を払うといった操作で、これらは同値ではない。必要条件だけで進んだのなら、最後に必ず十分性を確認する。この確認を書くかどうかが、そのまま点差になる。","trigger":["絶対値・平方根・対数が出てきた → 場合分けか条件（真数条件など）","両辺を2乗した → 同値でない。符号の確認が必要","両辺に文字を掛けた／割った → その文字が 0 の場合を分ける","分母を払った → 分母 ≠ 0 を条件として残す","『⇒』の向きにだけ進んだ → 逆が言えるか確認する","図形で点の位置によって形が変わる → その境目で場合分け"],"procedure":["1. 場合分けの基準を明示する（『x < 0 のとき』のように見出しを立てる）","2. 排反か（重複していないか）を確認する","3. 網羅的か（漏れがないか）を確認する。境界値をどちらに入れたかも明示","4. 同値でない変形をしたら、その場に印をつけておく","5. 最後に十分性を確認する（求めた解を元の式に戻す）","6. 各場合の結論を統合して、最終的な答えを書く"],"worked":{"problem":"方程式 √(x + 2) = x を解け。","solution":["【よくある答案】","両辺を2乗して x + 2 = x²","x² − x − 2 = 0、(x − 2)(x + 1) = 0","よって x = 2, −1　　← ここで終えると誤り","","【なぜ誤りか】","「A = B」から「A² = B²」は言えるが、逆は言えない（A = −B でも A² = B² になる）。","つまり2乗は同値変形ではなく、必要条件しか得られていない。","実際 x = −1 を元の式に代入すると √1 = 1 だが右辺は −1 で、成り立たない。","","【正しい書き方その1：十分性を確認する】","2乗して得た候補 x = 2, −1 を元の式に代入して確かめる。","　x = 2 のとき √4 = 2 ○","　x = −1 のとき √1 = 1 ≠ −1 ✕","∴ x = 2","","【正しい書き方その2：最初から同値変形にする】","√(x+2) = x  ⇔  x ≧ 0 かつ x + 2 = x²　（左辺は 0 以上なので右辺も 0 以上が必要）","　　　　　　⇔  x ≧ 0 かつ (x − 2)(x + 1) = 0","　　　　　　⇔  x = 2","","この書き方なら十分性の確認が要らない。東大の答案としてはこちらが望ましい。","（真数条件 x + 2 ≧ 0 は x = x² − 2 ≧ 0 から自動的に従う）"]},"variants":["同値記号（⇔）で繋いで書く（最も安全。ただし本当に同値か毎回確認すること）","必要条件で候補を絞り、最後に十分性を確認する（計算は軽いが確認を忘れやすい）","場合分けを表にまとめる（3つ以上の条件が絡むとき）","『少なくとも』『すべての』が出たら、∀ と ∃ を明示的に書き分ける"],"pitfalls":["2乗したあと十分性を確認しない（最頻出）","場合分けの境界値をどちらに入れたか書かない","『x ≠ 0 のとき』で割ったのに、x = 0 の場合を扱わない","必要条件で出した答えを、そのまま最終解答にする","場合分けの見出しを立てず、地の文に混ぜて書く（採点者が追えない）"],"todaiUse":"東大は同値性の意識を直接測ってくる。特に軌跡・領域・方程式の解の議論では、必要条件だけで進むと必ず余分な解が混じる設計になっている。答えが合っているのに点が来ないという経験の大半は、ここが原因。","check":["√(2x + 3) = x を解け（十分性の確認まで書くこと）","|x − 1| + |x − 3| = 4 を解け（場合分けの網羅性を意識すること）","方程式 x + 1/x = a が実数解を持つ a の条件を、同値変形で求めよ"],"stretch":"同値でない変形を意図的に使い、あとで十分性を確認するほうが速い場面もある。どちらが速いかを判断できるようになると、時間の使い方が変わる。"},{"nodeId":"td-writing","title":"減点されない答案の書き方","core":"同じ実力でも、答案の書き方だけで15〜25点は変わる。採点者は読み手であり、書いた本人の頭の中は見えない。だから必要なのは、宣言・根拠・結論の3つを揃えることに尽きる。文字を置いたら『〜とおく』と宣言し、使った定理には名前を書き、最後に『∴』で結論を明示する。計算だけが並んでいる答案は、たとえ正しくても何を求めているのかが伝わらず、部分点を拾えない。","trigger":["文字を新しく置いた → 『〜とおく』と宣言する","座標を設定した → どこを原点に取ったかを明示する","図形問題 → 図を描く（採点者に状況が伝わる）","定理を使った → 名前を書く（はさみうちの原理、平均値の定理、中間値の定理）","場合分けした → 見出しを立てる","答えが出た → 『∴』で結論を書く","完答できなかった → 方針だけでも書く（部分点になる）"],"procedure":["1. 問題文の条件を自分の記号に翻訳し、置いた文字をすべて宣言する","2. 図が描けるなら描く。座標設定の根拠（対称性など）も一言添える","3. 方針を最初に1行書く（『〜を示すため、差を取って微分する』）","4. 場合分けは見出しを立て、各場合の結論を書く","5. 使った定理の名前を明記する","6. 最後に『∴』で結論を書く。単位や範囲も忘れずに"],"worked":{"problem":"同じ内容を、伝わらない答案と伝わる答案で書き比べてみる。題材は「x > 0 で x > log(1+x) を示せ」。","solution":["【伝わらない答案】","　f' = 1 − 1/(1+x) = x/(1+x) > 0","　f(0) = 0","　よって成り立つ","","→ f が何なのか宣言されていない。x > 0 という条件をどこで使ったかも不明。","　計算は合っているが、読み手には論理が追えない。","","【伝わる答案】","　f(x) = x − log(1 + x) とおく。定義域は x > −1 であり、以下 x ≧ 0 で考える。","　示したいのは x > 0 で f(x) > 0 である。","","　f′(x) = 1 − 1/(1 + x) = x/(1 + x)","　x > 0 のとき分子・分母ともに正なので f′(x) > 0。","　よって f は x ≧ 0 で単調増加。","","　また f(0) = 0 − log 1 = 0。","　単調増加で f(0) = 0 だから、x > 0 では f(x) > 0。","","　∴ x > 0 のとき x > log(1 + x)　（証明終）","","【違い】","・f を宣言した（何を調べているかが分かる）","・定義域を書いた","・示したいことを最初に述べた","・単調増加と f(0) = 0 を結びつけた（ここが論理の要）","・∴ で結論を明示した","","内容は同じでも、後者は途中で計算を間違えても部分点が来る。前者は来ない。"]},"variants":["方針を冒頭に1行書く（採点者が読む姿勢を作れる）","図・表・増減表を使う（言葉より速く正確に伝わる）","完答できない場合、『ここまでは示せた』と書いて区切る","計算が長くなる部分は、結果だけ書いて別枠で計算する（本筋が読みやすくなる）"],"pitfalls":["文字を宣言せずに使う","定義域・条件を書かない","定理名を書かず『よって』で済ませる","結論を書かずに計算で終わる","解けなかった問題を白紙で出す（方針だけでも部分点の可能性がある）","字が読めない、消しゴムの跡で判別できない"],"todaiUse":"東大の採点基準は非公表だが、開示得点と自己採点のずれの多くはここに由来する。特に論証問題では、結論が合っていることより過程が通っていることが重視される。過去問を解いたら、答え合わせだけでなく『この答案は他人が読めるか』を必ず点検すること。","check":["自分の答案を1週間後に読み返し、宣言・根拠・結論が揃っているか確認せよ","上の証明を、定義域と定理名を入れて自分で書き直せ","完答できなかった過去問について、部分点が来る形で書き直してみよ"],"stretch":"採点者の立場で自分の答案を読む訓練。可能なら他人に読んでもらい、どこで詰まったかを聞く。これが最も効率のよい改善方法になる。"},{"nodeId":"td-calc","title":"計算の設計と検算（次数・単位・特殊値）","core":"理三の失点の最大要因は、難問が解けないことではなく計算ミスである。そして計算ミスを減らす最も効果的な方法は、丁寧に計算することではなく、検算の型を持つことにある。ここで重要なのは、検算とは『もう一度同じ計算をすること』ではないという点。同じ手順を繰り返せば同じ間違いを繰り返す。別の方法で確かめるからこそ意味がある。特殊値の代入、次数の確認、対称性の確認、概算——この4つを習慣にするだけで失点は目に見えて減る。","trigger":["答えが出た → 特殊値（x = 0, 1 など）を代入して確かめる","式が複雑 → 次数が合っているかを見る","対称な問題なのに答えが非対称 → ほぼ間違い","積分の答え → 概算して、面積の見た目と合うか確認する","計算が異常に汚い → 方針が違う可能性を疑う","分数が積み重なった → 通分の前に約分できないか探す"],"procedure":["1. 計算を始める前に、どういう形の答えになるかを予想する","2. 途中式は消さずに残す（どこで間違えたか追える）","3. 答えが出たら特殊値を代入して確認する","4. 次数・符号・対称性を確認する","5. 数値問題なら概算して桁を確かめる","6. 検算は必ず別の方法で行う"],"worked":{"problem":"∫[0→1] x(1 − x)² dx を計算し、4通りの方法で検算する。","solution":["【計算】展開して積分する。","x(1 − x)² = x(1 − 2x + x²) = x − 2x² + x³","∫[0→1] (x − 2x² + x³) dx = [x²/2 − 2x³/3 + x⁴/4]₀¹ = 1/2 − 2/3 + 1/4","= 6/12 − 8/12 + 3/12 = 1/12","","【検算1：符号と大きさ】","0 ≦ x ≦ 1 で被積分関数は 0 以上なので、答えは正。1/12 > 0 ○","","【検算2：概算】","被積分関数の最大値は x = 1/3 のとき (1/3)(2/3)² = 4/27 ≒ 0.148。","区間の幅は 1 なので、積分値は 0.148 より小さいはず。","1/12 ≒ 0.083 で、確かに小さい ○","","【検算3：別の方法で計算する】","1 − x = t と置換すると x = 1 − t、dx = −dt、x: 0→1 で t: 1→0。","∫[1→0] (1 − t)t²(−dt) = ∫[0→1] (t² − t³) dt = 1/3 − 1/4 = 1/12 ○","","【検算4：対称性】","置換で x ↔ 1−x が入れ替わることから、∫x(1−x)² と ∫x²(1−x) は等しいはず。","後者を計算すると 1/3 − 1/4 = 1/12 で一致 ○","","【要点】検算3と4のように、別の経路で同じ値に到達することが本当の検算。","展開の計算をもう一度やり直すのは、同じ間違いを繰り返すだけで検算にならない。"]},"variants":["特殊値の代入（恒等式や因数分解の確認に有効）","次元・次数のチェック（面積なら2次、体積なら3次）","極限の挙動（x → ∞ でどうなるかが直感と合うか）","対称性（対称な問題の答えは対称になるはず）","別解で解き直す（時間があるときの最も確実な検算）"],"pitfalls":["検算と称して同じ計算を繰り返す（同じ間違いを再現するだけ）","途中式を消してしまい、どこで間違えたか追えなくなる","計算が汚いまま突き進む（方針が違うサインを見逃す）","分数を早めに通分して、約分の機会を失う","検算する時間を残さない配分で解く"],"todaiUse":"東大の問題は計算量が多く、途中でミスをすると最後まで気づかない設計になっていることがある。難問を解く力より、標準問題を確実に完答する精度のほうが、合計点への寄与は大きい。過去問で失点したとき、それが『解法が分からなかった』のか『計算を間違えた』のかを必ず分類すること。","check":["∫[0→1] x²(1 − x) dx を計算し、上と同じ4通りで検算せよ","自分の過去問の失点を、方針・計算・記述の3つに分類せよ","計算ミスが最も多く起きる場面（符号、分数、置換の区間など）を書き出せ"],"stretch":"計算の設計。同じ問題でも、どの順に処理するかで計算量が数倍変わる。約分できる形を先に作る、対称性を使って半分だけ計算する、といった工夫を意識的に選べるようになると速度が上がる。"},{"nodeId":"td-t-cplx","title":"【東大型】複素数平面と図形","core":"複素数平面の強みは、回転と拡大を掛け算1つで書けることに尽きる。ベクトルでも座標でも書ける問題を、複素数なら数行で処理できる場面があり、その見極めが得点差になる。特に、回転が絡む図形条件と、|z| や arg で書かれた軌跡は複素数平面の独壇場である。逆に、実部・虚部に分解して計算を始めると式が膨張するので、できるだけ z のまま、あるいは共役 z̄ を使って処理するのが原則になる。","trigger":["回転が出てくる → 掛け算 e^(iθ) で書く","『点 α を中心に θ 回転』→ α + (z − α)e^(iθ)","|z − a| = |z − b| → 2点から等距離、つまり垂直二等分線","|z − a| = r → 中心 a、半径 r の円","|z − a| : |z − b| が一定 → アポロニウスの円","arg((z−a)/(z−b)) が一定 → 円弧（一定角）","1 の n 乗根 → 正 n 角形。和は 0"],"procedure":["1. 図形の条件を、絶対値・偏角・共役のいずれかで書く","2. 実部と虚部に分けたくなっても、まず z のまま処理できないか考える","3. 軌跡なら、w = f(z) を z について解き直し（逆に解く）、z の条件に代入する","4. 得られた w の条件を図形として読む","5. 除外点を確認する（分母が 0 になる点、対応しない点）"],"worked":{"problem":"|z| = 1 かつ z ≠ 1 を満たす複素数 z に対し、w = (z + 1)/(z − 1) とおく。z が動くとき、w はどのような図形を描くか。","solution":["実部・虚部に分けると計算が膨張する。w を z について解き直すのが定石。","","【逆に解く】","w(z − 1) = z + 1","wz − w = z + 1","z(w − 1) = w + 1","w = 1 のときこの式は 0 = 2 となり不合理なので w ≠ 1。よって","　z = (w + 1)/(w − 1)","","【条件 |z| = 1 に代入する】","|(w + 1)/(w − 1)| = 1","すなわち |w + 1| = |w − 1|","","【図形として読む】","これは『w が点 −1 と点 1 から等距離にある』という条件。","つまり w は 2点 −1, 1 を結ぶ線分の垂直二等分線、すなわち虚軸上にある。","","【逆に、虚軸上の点はすべて現れるか（十分性）】","w = it（t は実数）とすると z = (it + 1)/(it − 1)。","|z| = |it + 1| / |it − 1| = √(1 + t²) / √(1 + t²) = 1 となり条件を満たす。","また z = 1 となるのは it + 1 = it − 1、すなわち 1 = −1 のときで、これは起こらない。","よって z ≠ 1 も満たされる。","","∴ w は虚軸全体を描く。","","【要点】w を z で表したまま考えず、z を w で表し直して既知の条件に代入する。","この『逆に解く』手順は、複素数平面の軌跡問題のほぼ全てで使える。"]},"variants":["実部・虚部に分ける（最後の手段。式が膨張しやすい）","共役を使う：|z|² = z·z̄、実数条件は z = z̄、純虚数条件は z + z̄ = 0","回転で書き直す：正三角形の条件は γ − α = (β − α)·e^(±iπ/3)","ベクトルや座標に翻訳する（回転がない問題なら、そのほうが速いこともある）","1 の n 乗根の和が 0 であることを使う（正 n 角形の重心が原点）"],"pitfalls":["実部・虚部に分解して計算量が爆発する","偏角の一般角（+2kπ）を落として、n 乗根の個数を数え違える","軌跡を求めたあと、除外点や十分性の確認をしない","回転の中心を原点に移してから戻す、という手順を飛ばす","|z| = 1 を z = 1 と読み違える"],"todaiUse":"東大では複素数平面が単独の大問になる年と、まったく出ない年がある。出るときは回転か軌跡のどちらかで、いずれも『複素数のまま処理できるか』が問われる。ベクトルや座標でも解けるが計算量が数倍になる、という設計になっていることが多い。","check":["点 1 + i を、点 2 を中心に π/2 だけ回転させた点を求めよ","|z − 1| = 2|z + 1| を満たす z の軌跡を求めよ（アポロニウスの円）","z⁵ = 1 の解をすべて求め、その和が 0 になることを確かめよ"],"stretch":"回転と拡大を組み合わせた変換（1次分数変換）が、円を円または直線に写すという性質。高校範囲では一般論は扱わないが、個別の問題で『円が直線に写った』という現象に出会ったときに驚かなくなる。"},{"nodeId":"td-t-space","title":"【東大型】空間図形の最大最小","core":"空間の最大最小は、ベクトルで立式し、変数を減らし、最後に微分または平方完成で処理する——という長い一本道を最後まで走り切る体力が問われる。途中で計算が汚くなって手が止まるのが典型的な失敗で、その原因はほぼ座標の取り方にある。対称性を活かした座標を選べば式は驚くほど簡単になり、選び損ねれば同じ問題が別物のように重くなる。だから書き始める前に、座標設定に30秒使う価値がある。","trigger":["空間内の2点間の距離の最小 → 両方をパラメータで表し、2変数関数にする","ねじれの位置にある2直線の最短距離 → 共通垂線、または2変数の平方完成","点と平面の距離 → 公式、または垂線の足を内積で求める","正四面体・立方体 → 対称性のよい座標を選ぶ（原点を重心に取ると式が簡単になる）","1変数に落ちたら微分、2変数のままなら平方完成を2回"],"procedure":["1. 対称性が最も活きる座標を設定する（ここで難易度が半分になる）","2. 動く点をパラメータで表す（線分上なら s, t ∈ [0,1]）","3. 求めたい量を、そのパラメータの式で表す","4. 距離なら2乗のまま扱う（√ を残さない）","5. 2変数なら片方ずつ平方完成する。1変数に落ちるなら微分する","6. パラメータの動く範囲内に最小値があるか確認する"],"worked":{"problem":"1辺の長さが 1 の正四面体 ABCD において、点 P は辺 AB 上を、点 Q は辺 CD 上を動く。線分 PQ の長さの最小値を求めよ。","solution":["【座標設定】立方体の頂点を使うと、正四面体の座標が驚くほど簡単になる。","　A(1, 1, 1)、B(1, −1, −1)、C(−1, 1, −1)、D(−1, −1, 1)","各辺の長さは、例えば AB = |(0, −2, −2)| = 2√2。つまりこれは1辺 2√2 の正四面体。","最後に 1/(2√2) 倍して、1辺 1 の場合に直す。","","【点をパラメータで表す】","P は辺 AB 上： P = A + s(B − A) = (1, 1 − 2s, 1 − 2s)　（0 ≦ s ≦ 1）","Q は辺 CD 上： Q = C + t(D − C) = (−1, 1 − 2t, −1 + 2t)　（0 ≦ t ≦ 1）","","【距離の2乗を計算する】√ を付けたまま扱わない。","Q − P = (−2, (1 − 2t) − (1 − 2s), (−1 + 2t) − (1 − 2s))","　　　 = (−2, 2s − 2t, 2s + 2t − 2)","","|PQ|² = 4 + 4(s − t)² + 4(s + t − 1)²","","【最小化する】","第2項と第3項はどちらも 0 以上なので、両方が同時に 0 にできれば最小。","　s − t = 0 かつ s + t − 1 = 0　⇔　s = t = 1/2","これは 0 ≦ s, t ≦ 1 の範囲内にある。","","このとき |PQ|² = 4、つまり |PQ| = 2。","","【1辺 1 に換算する】","1辺 2√2 のとき最小値 2 なので、1辺 1 のときは 2/(2√2) = 1/√2 = √2/2","","∴ 最小値は √2/2","","【確認】s = t = 1/2 は AB と CD の中点。正四面体では対辺の中点を結ぶ線分が","両方の辺に垂直（共通垂線）になるので、幾何的にも整合する。"]},"variants":["共通垂線を幾何的に求める（対称性から中点どうしを結ぶと分かれば計算不要）","ベクトルの内積で垂直条件を2本立てて連立する","1変数に落として微分する（片方の点が固定されている場合）","正四面体は立方体に埋め込むと座標が簡単になる（この問題の要点）","距離ではなく距離の2乗を扱う（√ を最後まで残さない）"],"pitfalls":["座標の取り方が悪く、式が汚いまま突き進む（最大の失敗要因）","√ を付けたまま最小化しようとする","パラメータの範囲（0 ≦ s ≦ 1）を確認せず、範囲外の点で最小値を主張する","2変数の平方完成で、片方を定数扱いしたまま結論を出す","対称性に気づかず、力任せに計算する"],"todaiUse":"東大では、空間ベクトルと微分を組み合わせた最大最小が定期的に出る。計算量が多いので、途中で方針が正しいか不安になるが、座標設定が良ければ式は必ず整理される。式が汚いまま進んでいると感じたら、座標を取り直す判断も含めて訓練しておくこと。","check":["1辺 1 の立方体 ABCD-EFGH で、辺 AB 上の点 P と辺 GH 上の点 Q について PQ の最小値を求めよ","点 (1, 1, 1) と平面 x + y + z = 0 の距離を、公式と垂線の足の両方で求めよ","正四面体の対辺の中点を結ぶ線分が、両方の辺に垂直であることを示せ"],"stretch":"動く点が3つ以上ある場合、または曲面上を動く場合。変数が増えるので、対称性で減らす技術がそのまま得点力になる。"},{"nodeId":"td-t-func","title":"【東大型】関数の決定・不等式の成立条件","core":"『すべての x で成り立つ』と『ある x で成り立つ』は、まったく違う条件である。前者（∀）は最小値・最大値の問題に翻訳され、後者（∃）は解の存在条件に翻訳される。この翻訳ができれば、条件つきの不等式は関数の値域を調べる標準問題に落ちる。東大はこの読み分けを、文章の中に紛れ込ませる形で問うてくる。だから問題文を読んだら、まず ∀ か ∃ かを確定させてから式を書き始めること。","trigger":["『すべての x に対して f(x) ≧ 0』→ f の最小値 ≧ 0","『ある x に対して f(x) ≧ 0』→ f の最大値 ≧ 0","『すべての x で f(x) ≧ g(x)』→ 差 h = f − g の最小値 ≧ 0","定数 a が分離できる → a ≧（何かの最大値）または a ≦（何かの最小値）","変数が2つある → 片方を固定して、もう片方で処理する（予選決勝法）","『成り立つような a の最小値』→ 分離した関数の最大値がそのまま答え"],"procedure":["1. ∀ か ∃ かを確定させる（ここを間違えると全部無駄になる）","2. 定数を分離できるか試す（a ≧ g(x) の形にする）","3. 分離できたら、g の最大値または最小値を求める","4. 分離できなければ、差を取って微分する","5. 定義域の端での挙動（極限）を必ず調べる","6. 等号が成立する点を確認する"],"worked":{"problem":"すべての x > 0 に対して log x ≦ ax が成り立つような正の定数 a の最小値を求めよ。","solution":["【∀ であることを確認】『すべての x > 0 に対して』なので ∀ の問題。","したがって最大値・最小値の問題に翻訳できる。","","【定数を分離する】x > 0 なので両辺を x で割ってよい。","　log x ≦ ax　⇔　(log x)/x ≦ a","これがすべての x > 0 で成り立つ条件は","　a ≧ （関数 f(x) = (log x)/x の最大値）","","【f の最大値を求める】","f(x) = (log x)/x　（x > 0）","f′(x) = { (1/x)·x − (log x)·1 } / x² = (1 − log x)/x²","","f′(x) = 0 　⇔ 　log x = 1 　⇔ 　x = e","　0 < x < e のとき log x < 1 なので f′ > 0（増加）","　x > e のとき log x > 1 なので f′ < 0（減少）","","よって x = e で最大となり、最大値は f(e) = (log e)/e = 1/e。","","【端の挙動も確認しておく】","x → +0 のとき log x → −∞ なので f(x) → −∞。","x → ∞ のとき f(x) → 0（分母のほうが速く増える）。","したがって x = e での値が全体の最大値で間違いない。","","【結論】a ≧ 1/e が条件。","","∴ a の最小値は 1/e","","【確認】a = 1/e のとき、x = e で log e = 1、ax = e/e = 1 となり等号が成立する。","つまり y = x/e は曲線 y = log x の接線になっている。図で見ると納得しやすい。"]},"variants":["∃ の場合：『ある x で f(x) ≧ 0』は f の最大値 ≧ 0","定数分離できないときは、差を取って微分する","変数が2つあるときは予選決勝法（片方を固定 → もう片方を動かす）","接線条件として幾何的に解く（この問題は『y = ax が y = log x の接線になる a』と同じ）","グラフを描いて視覚的に確認する（東大は図的な理解を要求してくる）"],"pitfalls":["∀ と ∃ を取り違える（答えが正反対になる）","定数分離するとき、割る量の符号を確認しない","定義域の端での極限を調べず、最大値の存在を見誤る","等号成立を確認しない（『最小値』を聞かれているのに到達可能か不明のまま）","2変数のとき、片方を固定した段階の結論をそのまま最終解答にする"],"todaiUse":"東大は ∀ と ∃ の読み分けを、問題文の日本語に埋め込んで問う。『任意の』『常に』は ∀、『存在する』『少なくとも1つ』は ∃。数III の関数と組み合わせると難易度が上がるが、翻訳さえできれば増減表を書く標準問題になる。","check":["すべての実数 x に対して x² + 2ax + 3a > 0 が成り立つ a の範囲を求めよ","すべての x > 0 に対して eˣ ≧ ax が成り立つ a の最大値を求めよ","『ある x > 0 で log x ≧ ax』となる a の範囲を求め、∀ の場合と比べよ"],"stretch":"条件が2重になっている場合（『すべての x に対して、ある y が存在して〜』）。∀∃ の順序が入れ替わると意味が変わるので、どちらが外側かを厳密に読む必要がある。"}],"lessonsVerified":false,"quizzes":[{"nodeId":"ma-prob-rec","items":[{"type":"choice","q":"『点Pが毎回ルールに従って移動する。n回後にAにいる確率を求めよ』という問題で、最初にすべきことは？","options":["一般項を予想して数学的帰納法で示す","n回後に起こりうる状況を、排反かつ網羅的な有限個の状態に分類する","期待値を計算して確率に直す","n=1,2,3 の値を求めて等比数列とみなす"],"answer":1,"explain":"状態の分類が決まれば遷移は書けるので、問題は分類の時点で終わっている。ここを飛ばすと必ず途中で詰まる。"},{"type":"error","q":"部屋A,B,Cがあり、点Pは毎回『今いる部屋以外の2部屋』のどちらかへ等確率で移動する。n回後にAにいる確率を p_n として、次の立式の誤りはどれか。\n\n　p_(n+1) = (1/2)p_n + (1/2)(1 - p_n)","options":["初期条件が抜けている","Aにいる状態からAへ留まる確率を 1/2 としているが、次の1手で必ずAを出るのでこの寄与は 0 である","Aにいない確率を 1-p_n としているのが誤り","係数 1/2 が両方とも 1/3 であるべき"],"answer":1,"explain":"正しくは p_(n+1) = (1/2)(1 - p_n)。ルール上Aに留まることは不可能なので、第1項は消える。「その状態から動けない先」を書いてしまうのが最頻出のミス。"},{"type":"number","q":"上と同じ設定で、最初にAにいるとき、2回後にAにいる確率 p_2 を求めよ。（分数で入力。例: 1/3）","answer":"1/2","accept":["1/2","0.5"],"explain":"p_(n+1) = (1/2)(1-p_n)、p_0 = 1 より p_1 = 0、p_2 = 1/2。1回でAを出て、そこからAに戻る確率が 1/2。"}]},{"nodeId":"ma-int-mod","items":[{"type":"choice","q":"x² + y² = 3z² を満たす自然数 x, y, z が存在しないことを示したい。何を法として考えるのが有効か。","options":["mod 2","mod 3","mod 5","mod 7"],"answer":1,"explain":"右辺が3の倍数であること、かつ平方数は mod 3 で 0 か 1 しか取らないことが噛み合う。平方数が絡んだら mod 3, 4, 8 を試すのが定石。"},{"type":"error","q":"次の推論の誤りはどれか。\n\n　6x ≡ 6y (mod 9) である。よって両辺を 6 で割って x ≡ y (mod 9) が成り立つ。","options":["合同式では両辺を足すことしかできない","法と割る数が互いに素でないと割れない。gcd(6,9)=3 なので不可","mod 9 ではなく mod 3 で考えるべきだった","6x と 6y が等しいとは限らない"],"answer":1,"explain":"合同式で自由にできるのは和・差・積のみ。割り算は gcd(a, m) = 1 のときだけ。正しくは両辺と法を3で割って 2x ≡ 2y (mod 3)、さらに gcd(2,3)=1 なので x ≡ y (mod 3)。"},{"type":"number","q":"2¹⁰⁰ を 7 で割った余りを求めよ。","answer":"2","accept":["2"],"explain":"2³ = 8 ≡ 1 (mod 7)。100 = 3·33 + 1 より 2¹⁰⁰ = (2³)³³ · 2 ≡ 1³³ · 2 ≡ 2。周期性を見つけるのが手順。"}]},{"nodeId":"m2-pass-region","items":[{"type":"choice","q":"『t が実数全体を動くとき、直線 y = 2tx - t² が通過する領域を求めよ』。最初の一手はどれか。","options":["いくつかの t で直線を描いて包絡線を予想する","点を (X, Y) と置き、Y = 2tX - t² を t の2次方程式と見て、実数解 t が存在する条件を求める","x で微分して増減を調べる","t を消去して x と y の関係式を作る"],"answer":1,"explain":"『通過する』＝『その点を通るような t が存在する』。幾何の問題を、t についての方程式の解の存在条件という論理の問題に翻訳するのがこのテーマの全て。"},{"type":"number","q":"上の通過領域は「y ≦ x^a」の形になる。a の値を答えよ。","answer":"2","accept":["2"],"explain":"t² - 2Xt + Y = 0 が実数解を持つ条件は D/4 = X² - Y ≧ 0、すなわち Y ≦ X²。この直線群は放物線 y = x² の接線全体。"},{"type":"choice","q":"同じ問題で t の範囲が 0 ≦ t ≦ 1 に制限された場合、判別式 D ≧ 0 だけで答えが出るか。","options":["出る。判別式は t の範囲に依存しない","出ない。0 ≦ t ≦ 1 の範囲に解を持つ条件（解の配置）が必要になる","出る。ただし境界を含まなくなる","判別式ではなく微分で処理する必要がある"],"answer":1,"explain":"判別式が保証するのは『実数解が存在する』ことだけで、その解が許された範囲にあるかは別問題。軸の位置と端点の値で処理する解の配置に変わる。ここを落とすと余分な領域まで塗ることになる。"}]},{"nodeId":"m3-int-riemann","items":[{"type":"choice","q":"lim[n→∞] Σ[k=1..n] n/(n² + k²) を求めたい。最初の一手はどれか。","options":["Σ の公式を使って和を閉じた形にする","分母分子を n² で割り、(1/n)·f(k/n) の形に整形する","はさみうちの不等式を作る","部分分数分解する"],"answer":1,"explain":"区分求積で手が止まる原因はほぼ全て『1/n を括り出す整形ができない』こと。これができれば残りは定積分の計算にすぎない。"},{"type":"number","q":"上の極限値を求めよ。（π を含む形で。例: π/6）","answer":"π/4","accept":["π/4","pi/4","π/4"],"explain":"(1/n)Σ 1/(1+(k/n)²) → ∫[0→1] dx/(1+x²) = π/4。x = tanθ の置換で計算する。"},{"type":"choice","q":"lim[n→∞] (n!/nⁿ)^(1/n) を区分求積で処理するには、まず何をするか。","options":["両辺の逆数を取る","log を取って和の形に変える","スターリングの公式を使う","はさみうちに切り替える"],"answer":1,"explain":"積の極限は log を取ると和になり、区分求積が使える形になる。東大が好む変形で、これを知らないと手が出ない。"}]},{"nodeId":"m3-vol-cross","items":[{"type":"choice","q":"回転体でない立体の体積を求めるとき、最初にすべきことはどれか。","options":["立体の形を3次元で正確に把握する","軸を1本決め、その軸に垂直な平面 x = t で切った断面積 S(t) を t の式で表す","立体を複数の四面体に分割する","重心を求める"],"answer":1,"explain":"体積計算は3次元の把握ではなく、断面という2次元の問題に落とす手続き。頭で立体を想像しようとして止まるのが典型的な失敗。"},{"type":"choice","q":"2つの円柱 x² + y² ≦ 1 と x² + z² ≦ 1 の共通部分を、平面 x = t で切った断面はどんな図形か。","options":["円","正方形","正三角形","楕円"],"answer":1,"explain":"x = t を代入すると y² ≦ 1 - t² かつ z² ≦ 1 - t²。つまり |y| ≦ √(1-t²) かつ |z| ≦ √(1-t²) で、一辺 2√(1-t²) の正方形。共通部分の断面は断面同士の共通部分になる。"},{"type":"number","q":"底面が半径1の円である円柱を、底面の直径を含み底面と45°をなす平面で切る。小さい方の立体の体積を求めよ。（分数で。例: 3/4）","answer":"2/3","accept":["2/3"],"explain":"直径を x 軸に取ると、断面は直角をはさむ2辺が √(1-t²) の直角三角形。S(t) = (1-t²)/2 を -1 から 1 まで積分して 2/3。"}]},{"nodeId":"m3-int-recur","items":[{"type":"choice","q":"I_n = ∫[0→π/2] sinⁿx dx について漸化式を作りたい。どう分けて部分積分するか。","options":["sinⁿx = (sinx)ⁿ のまま n を指数として微分する","sinⁿx = sinⁿ⁻¹x · sinx と分け、sinx を積分側に取る","sinⁿx = sinⁿ⁻²x · sin²x と分け、sin²x を微分側に取る","置換 t = sinx を行う"],"answer":1,"explain":"1つだけ分離して積分側に置くのが定石。cos²x = 1 - sin²x で戻したときに I_n が右辺に現れるので、移項してまとめる。"},{"type":"number","q":"I_n = ((n-1)/n)·I_(n-2)、I_0 = π/2 のとき、I_4 を求めよ。（例: 5π/16）","answer":"3π/16","accept":["3π/16","3pi/16"],"explain":"I_2 = (1/2)I_0 = π/4、I_4 = (3/4)I_2 = 3π/16。偶数番は I_0 から、奇数番は I_1 = 1 から下ろす。"},{"type":"error","q":"次の推論の誤りはどれか。\n\n　I_n = ((n-1)/n)·I_(n-2) であり、係数 (n-1)/n は 1 より小さい。よって I_n → 0 である。","options":["係数が 1 未満でも、1 に近づく係数を無限回掛けたときに 0 に収束するとは限らないので、評価が必要","漸化式が間違っている","I_n は単調増加なので 0 には収束しない","n の偶奇で場合分けしていない点が誤り"],"answer":0,"explain":"例えば Π(1 - 1/n²) は 0 に収束しない。正しくは n·I_n·I_(n-1) が一定であることから I_n·I_(n-1) = π/(2n) → 0 を示し、単調減少性と合わせてはさみうちする。"}]},{"nodeId":"ma-prob-def","items":[{"type":"choice","q":"赤玉3個、白玉2個の入った袋から同時に2個取り出す。確率を求めるために最初にすべきことはどれか。","options":["玉を色で分類し、『赤赤・赤白・白白』の3通りを全事象とする","見た目が同じでも玉すべてに番号を振り、区別して数える","期待値を計算してから確率に直す","取り出す順序を考えて順列で数えることに決める"],"answer":1,"explain":"確率が場合の数の比で計算できるのは、数えている一つ一つが同様に確からしいときだけ。区別できないものも全部区別することで、初めてこの前提が満たされる。"},{"type":"error","q":"次の推論の誤りはどれか。\n\n　取り出し方は『赤赤』『赤白』『白白』の3通りである。よって2個とも赤である確率は 1/3 である。","options":["全事象は4通りである","この3つは起こりやすさが等しくないので、個数の比を確率としてはいけない","赤玉が3個であることを使っていないのが誤り","組合せではなく順列で数えるべきである"],"answer":1,"explain":"玉を区別すると赤赤は3通り、赤白は6通り、白白は1通りに対応する。重みの違うものを1つずつと数えているので比が意味を持たない。正しくは 3/10。"},{"type":"number","q":"赤玉3個、白玉2個から同時に2個取り出すとき、2個の色が異なる確率を求めよ。（分数で。例: 1/5）","answer":"3/5","accept":["3/5","6/10","0.6"],"explain":"赤1個と白1個を選ぶのは C(3,1)×C(2,1) = 6 通り。全事象 C(5,2) = 10 通り。よって 6/10 = 3/5。検算：3/10 + 6/10 + 1/10 = 1。"}]},{"nodeId":"td-t-prob","items":[{"type":"choice","q":"正四面体ABCDの頂点上を、点Pが毎回、辺で結ばれた3頂点のいずれかへ等確率で移動する。n回後にAにいる確率を求めたい。状態の取り方として最も適切なものはどれか。","options":["4つの頂点それぞれを別の状態とし、4元の連立漸化式を立てる","『Aにいる』『A以外にいる』の2状態に分ける","移動した回数の偶奇で分ける","直前にいた頂点がどこかで分ける"],"answer":1,"explain":"B, C, D は A から見て完全に対等（どれもAと辺で結ばれ、互いにも結ばれている）。つまり同じ状態にまとめても遷移確率が変わらない。対称性で状態を潰せるかを必ず先に考える。"},{"type":"number","q":"上の設定で、最初にAにいるとき、2回の操作後にAにいる確率を求めよ。（分数で）","answer":"1/3","accept":["1/3"],"explain":"p_(n+1) = (1/3)(1 - p_n)、p_0 = 1。p_1 = 0（1回で必ずAを出る）、p_2 = (1/3)(1-0) = 1/3。"},{"type":"error","q":"確率漸化式を立てる際、状態を分類したところ「同じ状態に属しているのに、そこから次に移る確率が異なるもの」が混ざっていた。これはなぜ問題か。","options":["遷移確率が一意に定まらないので、そもそも漸化式が立てられない","確率の和が1にならなくなる","初期条件が決まらなくなる","計算量が増えるだけで、答えには影響しない"],"answer":0,"explain":"良い分類の条件は『排反かつ網羅的』と『同じ状態なら以降の遷移が同じ』の2つ。後者を満たさない粗い分類が、この単元で最も多い敗因。"}]},{"nodeId":"ma-int-bound","items":[{"type":"choice","q":"1/x + 1/y + 1/z = 1 を満たす自然数の組をすべて求めたい。最初の一手はどれか。","options":["両辺に xyz を掛けて因数分解の形に持ち込む","x ≦ y ≦ z としてよいと断り、1 ≦ 3/x から x の上界を出す","mod 3 で場合分けする","x = 1 から順に代入していく"],"answer":1,"explain":"対称式なので大小を仮定できる。最小の文字 x について 1/x が最大だから 1 ≦ 3/x、すなわち x ≦ 3 と一気に絞れる。この一言がないと場合が無限に増える。"},{"type":"choice","q":"『x ≦ y ≦ z としてよい』と書ける根拠はどれか。","options":["自然数を扱っているから","与式が x, y, z について対称で、並べ替えても条件が変わらないから","解が有限個だと分かっているから","一般性は失われるが、答えの個数は変わらないから"],"answer":1,"explain":"対称性が根拠。根拠を書かずに使うと減点される。また最後に必ず並べ替えを戻して、すべての解を書き出すこと。"},{"type":"number","q":"1/x + 1/y + 1/z = 1 の自然数解のうち、x ≦ y ≦ z を満たす組は全部で何通りあるか。","answer":"3","accept":["3","3通り"],"explain":"(2,3,6), (2,4,4), (3,3,3) の3通り。x=2 のとき y=3,4、x=3 のとき y=3 に絞られる。"}]},{"nodeId":"td-t-integer","items":[{"type":"choice","q":"「n を自然数とするとき、n² + n + 1 は 5 の倍数にならないことを示せ」。最も有効な手段はどれか。","options":["n を 5 で割った余りで分類し、それぞれ mod 5 で計算する","左辺を因数分解する","n についての数学的帰納法を使う","不等式で評価して n を有限個に絞る"],"answer":0,"explain":"問われているのが5の倍数性なので法は5で確定する。合同式は積と和を保つので、余り0〜4の5通りだけ調べれば、無限個の n すべてについて示したことになる。"},{"type":"number","q":"n ≡ 3 (mod 5) のとき、n² + n + 1 を 5 で割った余りを求めよ。","answer":"3","accept":["3"],"explain":"9 + 3 + 1 = 13 ≡ 3 (mod 5)。他の余りでも 1, 3, 2, 3, 1 となり、いずれも 0 にならない。"},{"type":"error","q":"次の答案の誤りはどれか。\n\n　n = 1, 2, 3, 4, 5 について n² + n + 1 を計算すると 3, 7, 13, 21, 31 となり、いずれも5の倍数でない。よって示された。","options":["有限個の n で確認しただけでは、すべての自然数について示したことにならない","n = 0 を調べていないのが誤り","計算結果が間違っている","mod 5 ではなく mod 25 で調べるべきである"],"answer":0,"explain":"東大の整数は証明として完結させることが要求される。具体例の確認は方針を発見するための実験であって、証明ではない。mod で分類すれば有限通りで全体を尽くせる。"}]},{"nodeId":"m2-locus","items":[{"type":"choice","q":"軌跡の問題で、文字を消去して x, y の関係式が得られた。次にすべきことはどれか。","options":["得られた方程式をそのまま図示して終わる","消去した文字が実数として存在する条件と、除外点を確認する","微分して増減を調べる","判別式を計算して解の個数を求める"],"answer":1,"explain":"軌跡は方程式を出す問題ではなく、点の集合を過不足なく決める問題。存在条件と除外点を落とすと、答えは必ず広すぎるものになる。"},{"type":"number","q":"円 x² + y² = 4 上を点Qが動くとき、定点 A(6,0) と Q を結ぶ線分 AQ を 1:2 に内分する点Pの軌跡は、中心 (4,0) の円になる。その半径を求めよ。（分数で）","answer":"2/3","accept":["2/3"],"explain":"Q(s,t) として s = 3x-12, t = 3y を s²+t²=4 に代入すると (x-4)² + y² = 4/9。A を中心とする比 1/3 の相似変換なので、半径も 2×(1/3) = 2/3 と暗算できる。"},{"type":"choice","q":"軌跡を求める際、動点を (x, y)、条件に現れる別の点を (s, t) と、必ず別の文字で置くのはなぜか。","options":["計算が楽になるから","同じ文字を使うと、どの点についての条件なのか区別できなくなり、論理が壊れるから","慣習的にそう書くことになっているから","消去する順番が決まるから"],"answer":1,"explain":"『動いている点』と『それに連動して動く別の点』を同じ文字で書くと、式が何を意味しているか追えなくなる。ここが崩れると、その後の存在条件の議論も成立しない。"}]},{"nodeId":"m2-region","items":[{"type":"choice","q":"領域 D 上で x + y の最大値を求めたい。とるべき方針はどれか。","options":["直線 x + y = k を平行移動し、D と共有点を持つ最大の k を求める","x を固定して y だけを動かし、順に調べる","D の面積を計算してから比で求める","原点中心の円の半径を動かして考える"],"answer":0,"explain":"求めたい量を k と置き、k を含む図形を動かす。この視点の転換がこの単元の中心。最大を与える点は領域の頂点か境界との接点に現れる。"},{"type":"number","q":"x ≧ 0, y ≧ 0, x + 2y ≦ 8, 2x + y ≦ 10 で表される領域における x + y の最大値を求めよ。","answer":"6","accept":["6"],"explain":"2直線の交点 (4,2) で最大。他の頂点は (0,0)→0、(5,0)→5、(0,4)→4。傾き -1 の直線が2直線に挟まれた角の頂点で離れる。"},{"type":"choice","q":"領域の境界が曲線である場合、頂点だけを調べるのでは不十分なのはなぜか。","options":["曲線上には点が無限にあるから","接点で最大または最小になる場合があるから","頂点が存在しないから","判別式が使えなくなるから"],"answer":1,"explain":"直線境界なら候補は頂点だけだが、曲線境界では動かす図形が接する位置で極値をとる。判別式か点と直線の距離で接する条件を出す。"}]},{"nodeId":"td-t-region","items":[{"type":"choice","q":"パラメータを含む図形の「通過領域」を問われたとき、最初に確定すべきことはどれか。","options":["パラメータの次数","∀（すべての t で成り立つ）なのか ∃（ある t が存在する）なのか","領域が有界かどうか","境界を含むかどうか"],"answer":1,"explain":"∀ と ∃ で答えは正反対になる。ここを取り違えると以降の作業がすべて無駄になるので、式を書き始める前に確定させる。"},{"type":"number","q":"実数 t が全実数を動くとき、放物線 y = x² - 2tx + 2t² が通過する領域は y ≧ x²/a と表される。a の値を求めよ。","answer":"2","accept":["2"],"explain":"t について整理して 2t² - 2xt + (x²-y) = 0。実数 t が存在する条件は D/4 = x² - 2(x²-y) ≧ 0、すなわち y ≧ x²/2。"},{"type":"choice","q":"「あるtが存在して y = 2tx - t² となる点 (x,y)」の集合と、「すべての実数 t に対して y ≧ 2tx - t² が成り立つ点 (x,y)」の集合の関係として正しいものはどれか。","options":["同じ領域になる","前者は y ≦ x²、後者は y ≧ x² で、境界だけを共有する正反対の領域になる","前者は後者に完全に含まれる","どちらも空集合になる"],"answer":1,"explain":"∃版は t²-2xt+y=0 が実数解を持つ条件で D/4 = x²-y ≧ 0 すなわち y ≦ x²。∀版は t²-2xt+y ≧ 0 が全 t で成立する条件で D/4 = x²-y ≦ 0 すなわち y ≧ x²。この対比を一度自分の手で確認しておくこと。"}]},{"nodeId":"ma-count-basic","items":[{"type":"choice","q":"1, 2, 3, 4, 5 から異なる3個を選んで3桁の奇数を作る。数え始めるとき、最初に決めるべき位はどれか。","options":["百の位（左から順に決めるのが自然だから）","一の位（奇数という制約がかかっている位だから）","十の位（真ん中から決めると場合分けが減るから）","どこから決めても同じ"],"answer":1,"explain":"百の位から決めると、それが奇数か偶数かで一の位の選択肢数が変わってしまい、積の法則がそのまま使えない。制約のある位置を先に固定するのが原則。"},{"type":"number","q":"上の条件で作れる3桁の奇数は何個か。","answer":"36","accept":["36","36個"],"explain":"一の位（1,3,5 の3通り）→ 百の位（残り4通り）→ 十の位（残り3通り）で 3×4×3 = 36。検算：全体 60 個、偶数は 2×4×3 = 24 個で、36+24 = 60。"},{"type":"error","q":"次の推論の誤りはどれか。\n\n　3桁の整数は全部で 5×4×3 = 60 個できる。奇数と偶数は半分ずつだから、奇数は 30 個である。","options":["全体の個数 60 が間違っている","一の位に使える数字は奇数が3個・偶数が2個で対称でないため、半分ずつにはならない","3桁の整数の定義を取り違えている","積の法則を使ってはいけない場面である"],"answer":1,"explain":"1〜5 には奇数が3個、偶数が2個しかない。この非対称性のため奇数36個・偶数24個になる。「対称だから半分」は根拠を確認してから使うこと。"}]},{"nodeId":"ma-perm","items":[{"type":"choice","q":"8人から3人の委員を選ぶ方法の数に対して、8人から委員長・副委員長・書記を1人ずつ選ぶ方法の数は何倍か。","options":["3倍","6倍","8倍","同じ"],"answer":1,"explain":"同じ3人組に対して役職の割り当てが 3! = 6 通りある。P(8,3) = C(8,3)×3! という関係そのもので、これが C = P/r! の意味。"},{"type":"number","q":"男子5人、女子4人の合計9人から4人を選ぶとき、女子が少なくとも1人含まれる選び方は何通りか。","answer":"121","accept":["121","121通り"],"explain":"全体 C(9,4) = 126 から、女子が1人もいない（男子だけ）C(5,4) = 5 を引いて 121。「少なくとも」は余事象。"},{"type":"choice","q":"C(10, 3) と C(10, 7) が等しいことの、最も本質的な説明はどれか。","options":["階乗の式に代入すると同じ値になるから","10人から3人を選ぶことは、選ばれない7人を選ぶことと同じだから","パスカルの三角形が左右対称だから","3 + 7 = 10 だから"],"answer":1,"explain":"選ぶ・選ばないの対応が1対1なので個数が等しい。この「対応をつけて数える」考え方は、数え上げ全体で最も応用が利く。"}]},{"nodeId":"ma-samekind","items":[{"type":"number","q":"文字 A, A, B, B, B, C を1列に並べる方法は何通りか。","answer":"60","accept":["60","60通り"],"explain":"6!/(2!·3!) = 720/12 = 60。位置を選ぶ方式でも C(6,2)×C(4,3) = 15×4 = 60 で一致する。"},{"type":"choice","q":"上の計算で 6! を 2!·3! で割るのはなぜか。","options":["同じ文字は並べられないから","区別を消したとき、同じ並びになるものが 2!×3! 個ずつ現れるから","文字が6種類ないから","円順列と同じ理由で1つ固定するから"],"answer":1,"explain":"「割る」は同値類で数えるという意味。この見方があれば円順列やじゅず順列も公式なしで処理でき、割ってはいけない場合も自分で判断できる。"},{"type":"number","q":"碁盤の目状の道路を、左下から右上（右へ3区画、上へ2区画）へ最短で行く経路は何通りか。","answer":"10","accept":["10","10通り"],"explain":"「右右右上上」の並べ方に読み替えて 5!/(3!2!) = 10。最短経路は同じものを含む順列そのもの。"}]},{"nodeId":"ma-partition","items":[{"type":"number","q":"6人を、A組・B組・C組の3つの組に2人ずつ分ける方法は何通りか。","answer":"90","accept":["90","90通り"],"explain":"C(6,2)×C(4,2)×C(2,2) = 15×6×1 = 90。組に名前があるので割らない。"},{"type":"number","q":"同じく6人を2人ずつ3つの組に分けるが、組に名前がない場合は何通りか。","answer":"15","accept":["15","15通り"],"explain":"3つの組はすべて2人で大きさが同じなので、入れ替え 3! = 6 通りが重複している。90/6 = 15。"},{"type":"error","q":"次の推論の誤りはどれか。\n\n　6人を1人・2人・3人の3つの組（名前なし）に分ける。組に名前がないので、C(6,1)·C(5,2)·C(3,3) = 60 を 3! で割って 10 通りである。","options":["C(6,1)·C(5,2)·C(3,3) の計算が間違っている","3つの組は人数が異なるので入れ替わりようがなく、割ってはいけない","組に名前がない場合は常に割る必要がある","2! で割るのが正しい"],"answer":1,"explain":"割ってよいのは大きさが同じ組どうしだけ。1人組と2人組は交換しても別の分け方にならないので、重複していない。正しくは 60 通り。"}]},{"nodeId":"ma-incl","items":[{"type":"number","q":"1 から 100 までの整数のうち、2 でも 3 でも割り切れないものは何個か。","answer":"33","accept":["33","33個"],"explain":"2の倍数50個、3の倍数33個、6の倍数16個。|A∪B| = 50+33−16 = 67。100 − 67 = 33。"},{"type":"choice","q":"3つの集合について |A∪B∪C| を表す式として正しいものはどれか。","options":["|A|+|B|+|C| − |A∩B∩C|","|A|+|B|+|C| − |A∩B| − |B∩C| − |C∩A| + |A∩B∩C|","|A|+|B|+|C| − |A∩B| − |B∩C| − |C∩A| − |A∩B∩C|","|A|+|B|+|C| + |A∩B| + |B∩C| + |C∩A| − |A∩B∩C|"],"answer":1,"explain":"2つの共通部分を引くと、3つ全部に属する要素を引きすぎるので最後に足し戻す。符号が不安なときはベン図で各領域が何回数えられているか確認する。"},{"type":"choice","q":"問題文に「少なくとも1つ」と出てきたとき、最初に検討すべきことはどれか。","options":["場合分けして1つの場合・2つの場合…を全部足す","余事象（1つも起こらない場合）を数えて全体から引けないか考える","包除原理を必ず使う","順列で数え直す"],"answer":1,"explain":"「少なくとも1つ」の否定は「1つもない」という単一の条件になるので、ほぼ常に余事象のほうが軽い。直接数えると場合分けが増える。"}]},{"nodeId":"ma-prob-indep","items":[{"type":"number","q":"1個のサイコロを4回投げるとき、1の目がちょうど1回出る確率を求めよ。（分数で。約分してもしなくてもよい）","answer":"125/324","accept":["125/324","500/1296"],"explain":"C(4,1)×(1/6)×(5/6)³ = 4×125/1296 = 500/1296 = 125/324。「どの回で出るか」と「その並びの確率」の積に分解する。"},{"type":"choice","q":"サイコロを投げ続けるとき、「初めて1の目が出るのが3回目」である確率を表す式はどれか。","options":["C(3,1)×(1/6)×(5/6)²","(5/6)²×(1/6)","(1/6)³","3×(1/6)×(5/6)²"],"answer":1,"explain":"1回目と2回目は失敗、3回目に成功、と回が完全に指定されているので選び方はない。C をつけてしまうのが典型的な誤り。"},{"type":"number","q":"サイコロを4回投げるとき、1の目が少なくとも1回出る確率を求めよ。（分数で）","answer":"671/1296","accept":["671/1296"],"explain":"余事象「1回も出ない」= (5/6)⁴ = 625/1296。1 − 625/1296 = 671/1296。直接数えると4通りの場合を足すことになる。"}]},{"nodeId":"ma-prob-cond","items":[{"type":"choice","q":"「2回目が赤であったとき、1回目も赤である確率」を求めるとき、分母になるのはどれか。","options":["1回目が赤である確率","2回目が赤である確率","1回目も2回目も赤である確率","全事象（1）"],"answer":1,"explain":"「〜であったとき」と書かれているほうが条件であり、分母になる。ここを取り違えることがこの単元の失点のほとんど。"},{"type":"number","q":"赤玉3個、白玉2個の袋から戻さずに2回続けて取り出す。2回目が赤であったとき、1回目も赤であった確率を求めよ。（分数で）","answer":"1/2","accept":["1/2","0.5"],"explain":"分子 = (3/5)(2/4) = 3/10。分母 = (3/5)(2/4) + (2/5)(3/4) = 3/5。割って 1/2。"},{"type":"error","q":"次の推論の誤りはどれか。\n\n　赤3個・白2個の袋から戻さずに2個取り出す。1回目が赤の確率は 3/5、2回目が赤の確率も 3/5 なので、両方赤の確率は (3/5)×(3/5) = 9/25 である。","options":["1回目が赤の確率が 3/5 ではない","戻さないので1回目の結果が2回目の確率を変える。独立でないため単純に掛けられない","2回目が赤の確率は 3/5 ではない","組合せで数えるべき問題である"],"answer":1,"explain":"正しくは (3/5)×(2/4) = 3/10。なお「2回目が赤である確率」自体は 3/5 で正しい（対称性）が、条件つきの 2/4 とは別物。掛けるべきは条件付き確率のほう。"}]},{"nodeId":"ma-prob-exp","items":[{"type":"choice","q":"1〜n の番号のカードを無作為に並べ、k 番目に番号 k が来る枚数（的中枚数）の期待値を求めたい。最短の方法はどれか。","options":["的中枚数の分布を完全順列を使って求め、定義通り計算する","各カードに「的中したら1・しなければ0」の変数を置き、期待値の線形性で足す","全ての並べ方を書き出して平均を取る","反復試行の公式を使う"],"answer":1,"explain":"分布を求めるには完全順列（包除原理）が必要で重い。期待値だけなら線形性で一瞬。「個数の期待値」は0/1変数の和に分解するのが定石。"},{"type":"number","q":"上の的中枚数の期待値を求めよ。（n を含まない値になる）","answer":"1","accept":["1"],"explain":"各カードが自分の位置に来る確率は 1/n。n 枚あるので n×(1/n) = 1。n によらず 1 になる。"},{"type":"error","q":"次の推論の誤りはどれか。\n\n　的中を表す変数 X₁, …, Xₙ は互いに独立ではない。したがって E[X₁+…+Xₙ] = E[X₁]+…+E[Xₙ] は使えない。","options":["和についての期待値の線形性は、独立でなくても常に成り立つ","X₁, …, Xₙ は実際には独立である","期待値ではなく分散を計算すべきである","変数の置き方が間違っている"],"answer":0,"explain":"独立性が必要なのは積の期待値 E[XY] = E[X]E[Y] のほう。和については常に線形性が成り立つ。この違いを押さえておくと解ける問題の幅が大きく広がる。"}]},{"nodeId":"m3-ineq-diff","items":[{"type":"choice","q":"不等式を示すために h(x) =（左辺）−（右辺）とおいて微分したが、h′(x) の符号が一目では決まらない。次にすべきことはどれか。","options":["別の解法に切り替える","h″(x) を調べ、h′ の増減から h′ の符号を確定させる","h(x) を積分する","定義域を狭める"],"answer":1,"explain":"1回微分で止まってしまうのがこの単元の最大の壁。h″ で h′ の増減を出し、h′ の値が分かる点（多くは端点）と組み合わせれば h′ の符号が決まる。"},{"type":"choice","q":"x > 0 で e^x > 1 + x + x²/2 を示すために h(x) = e^x − 1 − x − x²/2 とおいた。h″(x) はどれか。","options":["e^x − 1 − x","e^x − 1","e^x − x","e^x"],"answer":1,"explain":"h′(x) = e^x − 1 − x、h″(x) = e^x − 1。x > 0 で h″ > 0 なので h′ は増加し、h′(0) = 0 と合わせて h′ > 0 が確定する。"},{"type":"error","q":"次の答案の誤りはどれか。\n\n　h′(x) > 0 なので h(x) は単調増加である。よって h(x) > 0 が成り立つ。","options":["単調増加であることの根拠が示されていない","起点の値（h(0) = 0 など）に触れていないため、正であることの根拠になっていない","h′ ではなく h″ を調べるべきである","定義域を書いていない"],"answer":1,"explain":"単調増加なだけでは正とは限らない。h(0) = 0 という起点があって初めて、x > 0 で h(x) > 0 が言える。"}]},{"nodeId":"m3-int-ineq","items":[{"type":"choice","q":"Σ[k=1..n] 1/k と log n の大小を比較したい。最初にすべきことはどれか。","options":["f(x) = 1/x が単調減少であることを示す","Σ の公式を使って和を閉じた形にする","log n をテイラー展開する","n について数学的帰納法を使う"],"answer":0,"explain":"面積の大小を主張する根拠が単調性。ここを飛ばすと論証として成立せず、答えが合っていても点にならない。"},{"type":"choice","q":"k ≦ x ≦ k+1 の範囲で 1/x を評価すると、どうなるか。","options":["1/k ≦ 1/x ≦ 1/(k+1)","1/(k+1) ≦ 1/x ≦ 1/k","1/x ≦ 1/k のみ言える","評価できない"],"answer":1,"explain":"1/x は減少関数なので、区間の右端 k+1 で最小、左端 k で最大。区間の幅が 1 なので、積分するとそのまま両端の値が不等式になる。"},{"type":"error","q":"次の答案の誤りはどれか。\n\n　図より、階段状の和のほうが曲線の下の面積より大きい。よって Σ[k=1..n] 1/k > log n である。","options":["不等号の向きが逆である","「図より」で済ませており、被積分関数の単調性を示していないため、面積の大小の根拠がない","log n の定義が間違っている","n の範囲を書いていない"],"answer":1,"explain":"結論自体は正しいが、論証が抜けている。1/x が単調減少であることを述べ、区間ごとの評価から積分して足し合わせる、という手順を書く必要がある。"}]},{"nodeId":"td-symmetry","items":[{"type":"choice","q":"∫[0→π] x·sin x/(1 + cos²x) dx を求めたい。最も有効な第一手はどれか。","options":["x を微分側にとって部分積分する","x → π − x と置換し、元の式と足し合わせる","cos x = u と置換する","sin x を倍角公式で変形する"],"answer":1,"explain":"x 以外の部分が x → π − x で不変であることを見抜くのが要点。足し合わせると x が消え、残りは u = cos x の置換で処理できる。"},{"type":"number","q":"上の定積分の値を求めよ。（π を含む形で。例: π^2/8 のように入力）","answer":"π^2/4","accept":["π^2/4","π²/4","pi^2/4","π*π/4"],"explain":"2I = π∫[0→π] sin x/(1+cos²x) dx = π × (π/2) = π²/2。よって I = π²/4。"},{"type":"error","q":"次の答案の誤りはどれか。\n\n　（式が a, b, c について対称であることに触れずに）a ≦ b ≦ c としてよい。よって……","options":["対称性という根拠を明示していないため、仮定を置いてよい理由が示されていない","a ≦ b ≦ c ではなく a < b < c とすべきである","対称性は使ってはいけない","文字を3つ使うのが誤りである"],"answer":0,"explain":"対称性があること自体は正しくても、根拠を書かずに「一般性を失わない」と宣言すると減点される。また最後に仮定を外して並べ替えを書き出すことも必要。"}]},{"nodeId":"td-t-volume","items":[{"type":"choice","q":"半径 1 の球（中心が原点）と、z 軸を軸とする半径 1/2 の円柱がある。平面 z = t で切ったとき、球の断面が円柱の断面より大きい（＝断面が円環になる）のはどの範囲か。","options":["|t| ≦ 1/2","|t| ≦ √3/2","|t| ≦ 1/√2","すべての |t| ≦ 1"],"answer":1,"explain":"球の断面の半径は √(1−t²)。これが 1/2 以上となる条件は 1−t² ≧ 1/4、すなわち |t| ≦ √3/2。この境目を先に求めておくことが場合分けの起点になる。"},{"type":"choice","q":"上の設定で「球の内部かつ円柱の外部」の体積はどれか。","options":["√3π/2","π/2","2π/3","√3π/4"],"answer":0,"explain":"S(t) = π(1−t²) − π/4 を |t| ≦ √3/2 で積分して (√3/2)π。|t| > √3/2 では断面が消えるので積分区間に含めない。"},{"type":"error","q":"上の問題で、次の立式の誤りはどれか。\n\n　V = ∫[−1→1] { π(1 − t²) − π/4 } dt","options":["球の断面の半径が違う","積分区間が誤り。|t| > √3/2 では断面が存在しないのに、被積分関数が負の値のまま足されている","円柱の断面積が π/4 ではない","偶関数なので 2 倍する必要がある"],"answer":1,"explain":"場合分けを落とすと、断面が存在しない範囲で被積分関数が負になり、体積が小さく出てしまう。東大が最も狙ってくる箇所。"}]},{"nodeId":"td-t-eval","items":[{"type":"choice","q":"「(1) 不等式を示せ／(2) 極限を求めよ」という構成の問題で、(2) の方針が立たない。まずすべきことはどれか。","options":["(2) を独立した問題として一から考える","(1) で示した不等式を見返し、それではさみうちできないか考える","(1) を飛ばして (3) を見る","ロピタルの定理を使う"],"answer":1,"explain":"東大の誘導では (1) は (2) のために置かれている。独立した小問だと思って使わないのが最大の失点原因。"},{"type":"choice","q":"I_n = ∫[0→1] xⁿ/(1+x) dx について、I_n + I_(n+1) はどれか。","options":["1/(n+1)","1/n","log 2","2/(n+1)"],"answer":0,"explain":"分子が xⁿ + x^(n+1) = xⁿ(1+x) となり分母と約分できるので、∫[0→1] xⁿ dx = 1/(n+1)。この一手だけで漸化式が作れる。"},{"type":"error","q":"次の答案の誤りはどれか。\n\n　I_n ≦ 1/(n+1) であり、1/(n+1) → 0 である。よって I_n → 0。","options":["1/(n+1) の極限が 0 でない","下からの評価（0 < I_n）が書かれていないため、はさみうちが成立していない","I_n ≦ 1/(n+1) が誤り","n の偶奇で場合分けが必要"],"answer":1,"explain":"上から押さえるだけでは、負の方向へ発散する可能性を排除できない。0 < I_n を明示し、「はさみうちの原理より」と書いて初めて論証が閉じる。"}]},{"nodeId":"td-reduce","items":[{"type":"choice","q":"1辺 1 の正三角形の内部の点 P から3辺に下ろした垂線の長さ p, q, r について p + q + r を求めたい。最も軽い方針はどれか。","options":["P の座標を置き、3本の垂線の長さを計算して足す","P と各頂点を結んで3つの三角形に分け、面積の和が全体に等しいことを使う","3辺の方程式を立てて連立する","重心の場合を計算して一般化する"],"answer":1,"explain":"「長さの和」を「面積の和」に読み替えるのが核心。(1/2)(p+q+r) = √3/4 から3行で終わる。座標で押すと計算が重くなる。"},{"type":"number","q":"上の p + q + r の値を求めよ。（√ を含む形で。例: √3/4 のように入力）","answer":"√3/2","accept":["√3/2","root3/2","√3÷2","(√3)/2"],"explain":"(1/2)(p+q+r)·1 = √3/4 より p+q+r = √3/2。P の位置によらず一定になる。検算：重心なら p=q=r=√3/6 で、3倍して √3/2。"},{"type":"choice","q":"「すべての実数 t に対して f(t) ≧ 0 が成り立つ」という条件は、何に翻訳するのが定石か。","options":["f の最小値が 0 以上であること","f が単調増加であること","f の解が存在しないこと","f の値域が実数全体であること"],"answer":0,"explain":"∀（すべての）は最小値・最大値の問題に翻訳する。一方 ∃（存在する）は解の存在条件（判別式・値域）に翻訳する。この2つの読み分けが翻訳技術の中核。"}]},{"nodeId":"td-time","items":[{"type":"choice","q":"東大理系数学（6問150分）で、試験開始直後にまずすべきことはどれか。","options":["第1問から順に解き始める","全6問に目を通し、解けそうな順に分類する","得意分野を探して最後まで読み込む","計算用紙を整える"],"answer":1,"explain":"最初の5分で A（すぐ解ける）B（時間をかければ）C（手が出ない）に分類する。順番に解き始めると、第1問が難問だった年に崩れる。"},{"type":"choice","q":"ある問題に25分かけたが方針が立たない。どうすべきか。","options":["解けるまで粘る","一旦離れて他の問題に移り、時間が余れば戻る","白紙のまま次に進み、二度と戻らない","答えを推測して書く"],"answer":1,"explain":"1問に固執して他が白紙になるのが最も多い失敗。撤退は実力ではなく訓練なので、模試で一度は実際にやっておくこと。"},{"type":"choice","q":"理三志望として、数学で現実的に狙うべき水準はどれか。","options":["6問すべて完答","4完＋部分点","2完で他教科に賭ける","年によ
