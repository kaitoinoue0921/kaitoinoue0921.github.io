<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>思想の系譜 — 大人のための哲学ナレッジマップ</title>
<meta name="description" content="高校倫理の体系を大人の教養として読み直す、東西29人の思想家のナレッジマップ。系譜図・東洋/西洋思想・「幸福」「愛」などのテーマ別に、思想の継承や変遷を視覚的に辿れる。登録不要・完全無料。">
<meta name="theme-color" content="#0a0c12">
<link rel="icon" href="../favicon.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta property="og:title" content="思想の系譜">
<meta property="og:description" content="高校倫理の体系を大人の教養として読み直す、東西29人の思想家のナレッジマップ。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://kaitoinoue0921.github.io/thought-map/">
<meta property="og:site_name" content="思想の系譜">
<meta property="og:locale" content="ja_JP">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="思想の系譜">
<meta name="twitter:description" content="高校倫理の体系を大人の教養として読み直す、東西29人の思想家のナレッジマップ。">
<link rel="canonical" href="https://kaitoinoue0921.github.io/thought-map/">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Noto+Serif+JP:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
  :root{
    --bg:#0a0c12;
    --panel:#12151f;
    --panel-2:#171b28;
    --border:#272c3d;
    --border-soft:#1d2130;
    --ink:#e8e5da;
    --ink-soft:#b5b8c6;
    --ink-mute:#767c92;
    --indigo:#8489f0;
    --indigo-dim:#4a4f83;
    --indigo-glow:rgba(132,137,240,0.22);
    --amber:#d7a154;
    --amber-soft:#e9c78c;
    --amber-glow:rgba(215,161,84,0.20);
    --edge:#333a52;
    --serif-display:'Shippori Mincho', 'Hiragino Mincho ProN', serif;
    --serif-body:'Noto Serif JP', 'Hiragino Mincho ProN', serif;
    --sans:'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  html, body{ height:100%; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--serif-body);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  ::selection{ background:var(--amber-glow); color:var(--ink); }

  a{ color:var(--amber-soft); }

  /* ---------- layout shell ---------- */
  .shell{
    display:flex;
    flex-direction:column;
    height:100vh;
  }

  .topbar{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:16px;
    padding:22px 32px 18px;
    border-bottom:1px solid var(--border-soft);
    flex-wrap:wrap;
  }
  .topbar .brand{
    display:flex;
    align-items:baseline;
    gap:14px;
    flex-wrap:wrap;
  }
  .topbar h1{
    font-family:var(--serif-display);
    font-weight:800;
    font-size:22px;
    letter-spacing:.04em;
    margin:0;
    color:var(--ink);
    white-space:nowrap;
  }
  .topbar .kicker{
    font-family:var(--sans);
    font-size:11px;
    letter-spacing:.18em;
    color:var(--indigo);
    text-transform:uppercase;
  }
  .topbar .tagline{
    font-family:var(--sans);
    font-size:12.5px;
    color:var(--ink-mute);
    letter-spacing:.02em;
  }

  .main{
    display:flex;
    flex:1;
    min-height:0;
  }
  @media (max-width: 920px){
    html, body{ height:auto; }
    body{ overflow:auto; }
    .shell{ height:auto; }
    .main{ flex-direction:column; overflow:visible; }
  }

  /* ---------- left: graph pane ---------- */
  .graph-pane{
    flex:1 1 60%;
    min-width:0;
    display:flex;
    flex-direction:column;
    border-right:1px solid var(--border-soft);
    background:
      radial-gradient(ellipse 60% 50% at 30% 20%, var(--indigo-glow), transparent 60%),
      radial-gradient(ellipse 50% 40% at 80% 75%, var(--amber-glow), transparent 60%),
      var(--bg);
  }
  @media (max-width: 920px){
    .graph-pane{ border-right:none; border-bottom:1px solid var(--border-soft); }
  }

  .mode-switch{
    display:flex;
    gap:4px;
    padding:16px 24px 0;
  }
  .mode-btn{
    font-family:var(--sans);
    font-size:12.5px;
    font-weight:500;
    letter-spacing:.03em;
    color:var(--ink-mute);
    background:transparent;
    border:none;
    border-bottom:2px solid transparent;
    padding:0 4px 12px;
    margin-right:20px;
    cursor:pointer;
    transition:color .15s ease, border-color .15s ease;
  }
  .mode-btn:hover{ color:var(--ink-soft); }
  .mode-btn.active{
    color:var(--ink);
    border-bottom-color:var(--amber);
  }

  .graph-view, .theme-view{ display:flex; flex-direction:column; flex:1; min-height:0; }
  .graph-view.hidden, .theme-view.hidden{ display:none; }

  .theme-view{
    overflow-y:auto;
    padding:22px 24px 32px;
  }
  .theme-intro{
    font-family:var(--sans);
    font-size:12.5px;
    line-height:1.9;
    color:var(--ink-mute);
    padding-bottom:20px;
    margin-bottom:22px;
    border-bottom:1px solid var(--border-soft);
  }
  .theme-grid{
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .theme-card{
    text-align:left;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:20px 22px;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease, transform .15s ease;
  }
  .theme-card:hover{ border-color:var(--indigo); transform:translateY(-1px); }
  .theme-card.active{ border-color:var(--amber); background:var(--panel-2); }
  .theme-card-title{
    font-family:var(--serif-display);
    font-weight:700;
    font-size:19px;
    color:var(--ink);
    margin-bottom:8px;
  }
  .theme-card-teaser{
    font-size:13px;
    line-height:1.8;
    color:var(--ink-soft);
    margin-bottom:12px;
  }
  .theme-card-who{
    font-family:var(--sans);
    font-size:11px;
    letter-spacing:.04em;
    color:var(--ink-mute);
  }
  .theme-card-who span{ color:var(--amber-soft); }

  .filters{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    padding:16px 24px;
    border-bottom:1px solid var(--border-soft);
  }
  .chip{
    font-family:var(--sans);
    font-size:12px;
    letter-spacing:.03em;
    color:var(--ink-soft);
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:100px;
    padding:6px 14px;
    cursor:pointer;
    transition:border-color .15s ease, color .15s ease, background .15s ease;
    white-space:nowrap;
  }
  .chip:hover{ color:var(--ink); border-color:var(--indigo-dim); }
  .chip.active{
    color:var(--bg);
    background:var(--amber-soft);
    border-color:var(--amber-soft);
    font-weight:700;
  }

  .region-filters{ padding-bottom:12px; }
  .chip.region-chip{ font-weight:600; }
  .chip.region-chip.active{
    color:var(--ink);
    background:var(--indigo-dim);
    border-color:var(--indigo);
  }

  .graph-wrap{
    flex:1;
    position:relative;
    min-height:460px;
  }
  .graph-wrap svg{
    width:100%;
    height:100%;
    display:block;
  }

  .lane-label{
    font-family:var(--sans);
    font-size:12px;
    letter-spacing:.1em;
    fill:var(--ink-mute);
    text-anchor:middle;
  }
  .lane-label.dim{ opacity:.25; }

  .node{ cursor:pointer; }
  .node circle.core{
    fill:var(--panel-2);
    stroke:var(--indigo-dim);
    stroke-width:1.6;
    transition:stroke .18s ease, fill .18s ease, filter .18s ease;
  }
  .node.featured circle.core{ stroke:var(--amber); stroke-width:2; }
  .node text.name{
    font-family:var(--sans);
    font-weight:700;
    fill:var(--ink);
    text-anchor:middle;
    pointer-events:none;
  }
  .node text.era{
    font-family:var(--sans);
    fill:var(--ink-mute);
    text-anchor:middle;
    pointer-events:none;
    font-size:9px;
    letter-spacing:.03em;
  }
  .node.dim{ opacity:.22; }
  .node:hover circle.core{ stroke:var(--indigo); filter:drop-shadow(0 0 6px var(--indigo-glow)); }
  .node.selected circle.core{
    fill:var(--panel-2);
    stroke:var(--amber);
    stroke-width:2.6;
    filter:drop-shadow(0 0 10px var(--amber-glow));
  }
  .node.neighbor circle.core{ stroke:var(--indigo); stroke-width:2; }

  .edge{
    fill:none;
    stroke:var(--edge);
    stroke-width:1.3;
    transition:stroke .18s ease, stroke-width .18s ease, opacity .18s ease;
  }
  .edge.dim{ opacity:.12; }
  .edge.active{ stroke:var(--amber); stroke-width:2; }
  .edge-label{
    font-family:var(--sans);
    font-size:9.5px;
    fill:var(--ink-mute);
    text-anchor:middle;
    pointer-events:none;
    transition:fill .18s ease, opacity .18s ease;
  }
  .edge-label.active{ fill:var(--amber-soft); }
  .edge-label.dim{ opacity:.12; }

  .legend{
    display:flex;
    gap:18px;
    flex-wrap:wrap;
    padding:12px 24px 18px;
    font-family:var(--sans);
    font-size:11px;
    color:var(--ink-mute);
    border-top:1px solid var(--border-soft);
  }
  .legend span{ display:inline-flex; align-items:center; gap:6px; }
  .legend i{ width:16px; height:1.5px; background:var(--edge); display:inline-block; }

  /* ---------- right: reading pane ---------- */
  .reading-pane{
    flex:0 0 500px;
    max-width:500px;
    overflow-y:auto;
    padding:0 0 80px;
  }
  @media (max-width: 920px){
    .reading-pane{ flex:1 1 auto; max-width:100%; max-height:none; }
  }

  .article{
    padding:36px 40px;
  }
  @media (max-width: 560px){
    .article{ padding:28px 22px; }
  }

  .intro{
    padding:60px 40px;
    color:var(--ink-soft);
  }
  .intro h2{
    font-family:var(--serif-display);
    font-size:26px;
    color:var(--ink);
    line-height:1.6;
    margin:0 0 18px;
  }
  .intro p{ line-height:2; font-size:14.5px; }

  .art-eyebrow{
    font-family:var(--sans);
    font-size:11px;
    letter-spacing:.16em;
    color:var(--indigo);
    text-transform:uppercase;
  }
  .art-name{
    font-family:var(--serif-display);
    font-weight:800;
    font-size:32px;
    color:var(--ink);
    margin:8px 0 4px;
    line-height:1.3;
    text-wrap:balance;
  }
  .art-era{
    font-family:var(--sans);
    font-size:12.5px;
    color:var(--ink-mute);
    margin-bottom:18px;
  }
  .art-oneliner{
    font-family:var(--serif-body);
    font-size:15.5px;
    line-height:1.95;
    color:var(--ink-soft);
    padding-bottom:22px;
    border-bottom:1px solid var(--border-soft);
    margin-bottom:26px;
  }

  .section{ margin-bottom:32px; }
  .section-title{
    font-family:var(--sans);
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--amber);
    margin-bottom:12px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .section-title::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--border);
  }

  .question-box{
    font-family:var(--serif-body);
    font-size:16px;
    line-height:2;
    color:var(--ink);
    background:var(--panel);
    border-left:2px solid var(--indigo);
    padding:18px 22px;
    border-radius:2px;
  }

  .idea{ margin-bottom:18px; }
  .idea:last-child{ margin-bottom:0; }
  .idea-term{
    font-family:var(--serif-display);
    font-weight:700;
    font-size:15.5px;
    color:var(--ink);
    margin-bottom:6px;
  }
  .idea-desc{
    font-size:14px;
    line-height:1.95;
    color:var(--ink-soft);
  }

  .insight-list{
    margin:0; padding:0;
    list-style:none;
  }
  .insight-list li{
    position:relative;
    padding:0 0 14px 22px;
    font-size:14px;
    line-height:1.9;
    color:var(--ink-soft);
  }
  .insight-list li::before{
    content:"◆";
    position:absolute;
    left:0; top:1px;
    font-size:9px;
    color:var(--amber);
  }

  .timeline-wrap{
    margin-bottom:6px;
  }
  .timeline-wrap svg{
    width:100%;
    height:auto;
    display:block;
    overflow:visible;
  }
  .timeline-node{ cursor:pointer; }
  .timeline-node circle{
    fill:var(--panel-2);
    stroke:var(--indigo-dim);
    stroke-width:1.6;
    transition:stroke .15s ease, filter .15s ease;
  }
  .timeline-node:hover circle{ stroke:var(--amber); filter:drop-shadow(0 0 6px var(--amber-glow)); }
  .timeline-node text.tname{
    font-family:var(--sans);
    font-weight:700;
    font-size:11.5px;
    fill:var(--ink);
    text-anchor:middle;
    pointer-events:none;
  }
  .timeline-node text.tera{
    font-family:var(--sans);
    font-size:9px;
    fill:var(--ink-mute);
    text-anchor:middle;
    pointer-events:none;
  }
  .timeline-edge{
    stroke:var(--edge);
    stroke-width:1.3;
    fill:none;
  }
  .timeline-cap{
    font-family:var(--sans);
    font-size:10.5px;
    fill:var(--ink-mute);
    text-anchor:middle;
  }
  .timeline-arrow{ fill:var(--edge); }

  .perspective{
    padding:20px 0;
    border-top:1px solid var(--border-soft);
  }
  .perspective:first-child{ border-top:none; padding-top:4px; }
  .perspective-who{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:transparent;
    border:none;
    padding:0;
    margin-bottom:10px;
    cursor:pointer;
    font-family:var(--sans);
    font-size:12px;
    color:var(--indigo);
    letter-spacing:.03em;
  }
  .perspective-who:hover{ color:var(--amber-soft); }
  .perspective-who::after{ content:"→"; font-size:11px; }
  .perspective-stance{
    font-family:var(--serif-display);
    font-weight:700;
    font-size:16.5px;
    color:var(--ink);
    line-height:1.6;
    margin-bottom:10px;
    text-wrap:balance;
  }
  .perspective-text{
    font-size:14px;
    line-height:1.95;
    color:var(--ink-soft);
  }

  .theme-closing{
    margin-top:8px;
    font-family:var(--serif-body);
    font-size:15px;
    line-height:2;
    color:var(--ink);
    background:var(--panel);
    border-left:2px solid var(--amber);
    padding:18px 22px;
    border-radius:2px;
  }

  .connections{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .conn-row{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:var(--sans);
    font-size:13px;
  }
  .conn-dir{
    font-size:10px;
    color:var(--ink-mute);
    letter-spacing:.08em;
    width:70px;
    flex:none;
  }
  .conn-btn{
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--ink);
    padding:7px 12px;
    border-radius:6px;
    cursor:pointer;
    font-family:var(--sans);
    font-size:12.5px;
    display:flex;
    align-items:center;
    gap:8px;
    transition:border-color .15s ease, background .15s ease;
  }
  .conn-btn:hover{ border-color:var(--indigo); background:var(--panel-2); }
  .conn-tag{
    font-size:10px;
    color:var(--amber-soft);
    background:rgba(215,161,84,0.12);
    border-radius:4px;
    padding:2px 6px;
  }
  .conn-empty{ font-size:12.5px; color:var(--ink-mute); font-style:italic; }

  .books{
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .book{
    padding:14px 16px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:8px;
  }
  .book-title{
    font-family:var(--serif-display);
    font-weight:700;
    font-size:14.5px;
    color:var(--ink);
    margin-bottom:3px;
  }
  .book-author{
    font-family:var(--sans);
    font-size:12px;
    color:var(--ink-mute);
    margin-bottom:6px;
  }
  .book-note{
    font-size:13px;
    color:var(--ink-soft);
    line-height:1.75;
  }

  .note-area textarea{
    width:100%;
    min-height:120px;
    resize:vertical;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:8px;
    color:var(--ink);
    font-family:var(--serif-body);
    font-size:13.5px;
    line-height:1.9;
    padding:14px 16px;
    outline:none;
  }
  .note-area textarea:focus{ border-color:var(--indigo); }
  .note-area textarea::placeholder{ color:var(--ink-mute); }
  .note-status{
    font-family:var(--sans);
    font-size:10.5px;
    color:var(--ink-mute);
    margin-top:6px;
    height:14px;
  }

  /* scrollbar */
  .reading-pane::-webkit-scrollbar{ width:8px; }
  .reading-pane::-webkit-scrollbar-thumb{ background:var(--border); border-radius:8px; }
  .reading-pane::-webkit-scrollbar-track{ background:transparent; }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="brand">
      <h1>思想の系譜</h1>
      <span class="kicker">A Field Guide to Modern Thought</span>
    </div>
    <div class="tagline">高校「倫理」の体系を、大人の教養として読み直すナレッジマップ</div>
  </div>

  <div class="main">
    <div class="graph-pane">
      <div class="mode-switch" id="modeSwitch">
        <button class="mode-btn active" data-mode="graph">思想家の系譜</button>
        <button class="mode-btn" data-mode="theme">テーマで読む</button>
      </div>

      <div class="graph-view" id="graphView">
        <div class="filters region-filters" id="regionFilters"></div>
        <div class="filters" id="filters"></div>
        <div class="graph-wrap">
          <svg id="graph" viewBox="0 0 1300 760" preserveAspectRatio="xMidYMid meet">
            <defs>
              <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                <path d="M0,0 L10,5 L0,10 z" fill="var(--edge)"></path>
              </marker>
              <marker id="arrow-active" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                <path d="M0,0 L10,5 L0,10 z" fill="var(--amber)"></path>
              </marker>
            </defs>
            <g id="lane-labels"></g>
            <g id="edges"></g>
            <g id="nodes"></g>
          </svg>
        </div>
        <div class="legend">
          <span><i></i> 継承・影響・批判・決別などの関係線</span>
          <span style="color:var(--amber-soft)">◎ ノードをクリックすると詳細が右に表示されます</span>
        </div>
      </div>

      <div class="theme-view hidden" id="themeView"></div>
    </div>

    <div class="reading-pane" id="reading"></div>
  </div>
</div>

<script>
(function(){

  var CATS = {
    east:  { label:"東洋思想",         sub:"儒家・仏教・道家" },
    source:{ label:"西洋思想の源流",     sub:"古代ギリシャ" },
    mind:  { label:"理性と認識の限界",     sub:"近代哲学" },
    self:  { label:"自己と無意識",       sub:"心理・実存" },
    econ:  { label:"社会契約と資本主義",   sub:"政治経済思想" },
    justice:{ label:"現代の正義と社会倫理", sub:"正義論" }
  };

  var REGIONS = {
    west: { label:"西洋思想", cats:["source","mind","self","econ","justice"] },
    east: { label:"東洋思想", cats:["east"] }
  };

  var LANES = { east:90, source:310, mind:530, self:750, econ:970, justice:1190 };

  var DATA = {
    descartes: {
      name:"ルネ・デカルト", era:"1596–1650 フランス", cat:"mind", featured:false, region:"west",

  function neighborsOf(id){
    var set = {};
    EDGES.forEach(function(e){
      if(e.from === id) set[e.to] = true;
      if(e.to === id) set[e.from] = true;
    });
    return set;
  }

  function buildFilters(){
    var all = document.createElement("div");
    var cats = [{key:"all", label:"すべて"}].concat(
      Object.keys(CATS)
        .filter(function(k){ return activeRegion === "all" || REGIONS[activeRegion].cats.indexOf(k) !== -1; })
        .map(function(k){ return {key:k, label:CATS[k].label}; })
    );
    cats.forEach(function(c){
      var chip = document.createElement("div");
      chip.className = "chip" + (c.key === activeFilter ? " active" : "");
      chip.textContent = c.label;
      chip.dataset.key = c.key;
      chip.addEventListener("click", function(){
        activeFilter = c.key;
        renderFilters();
        renderGraph();
      });
      filtersEl.appendChild(chip);
    });
  }
  function renderFilters(){
    filtersEl.innerHTML = "";
    buildFilters();
  }

  function buildRegionFilters(){
    var regions = [{key:"all", label:"すべて"}].concat(
      Object.keys(REGIONS).map(function(k){ return {key:k, label:REGIONS[k].label}; })
    );
    regions.forEach(function(r){
      var chip = document.createElement("div");
      chip.className = "chip region-chip" + (r.key === activeRegion ? " active" : "");
      chip.textContent = r.label;
      chip.dataset.key = r.key;
      chip.addEventListener("click", function(){
        activeRegion = r.key;
        if(activeFilter !== "all" && activeRegion !== "all" && REGIONS[activeRegion].cats.indexOf(activeFilter) === -1){
          activeFilter = "all";
        }
        renderRegionFilters();
        renderFilters();
        renderGraph();
      });
      regionFiltersEl.appendChild(chip);
    });
  }
  function renderRegionFilters(){
    regionFiltersEl.innerHTML = "";
    buildRegionFilters();
  }

  function edgePath(a, b){
    var mx = (a.x + b.x) / 2;
    var my = (a.y + b.y) / 2;
    var dx = b.x - a.x, dy = b.y - a.y;
    var len = Math.sqrt(dx*dx + dy*dy) || 1;
    var nx, ny, bend;
    if(Math.abs(dx) < 60){
      /* near-vertical (same lane): always bow to the right so the curve
         doesn't run straight through other nodes stacked in that lane */
      nx = 1; ny = 0;
      bend = Math.min(90, len * 0.22);
    } else {
      nx = -dy / len; ny = dx / len;
      bend = Math.min(55, len * 0.14);
    }
    var cx = mx + nx * bend;
    var cy = my + ny * bend;
    return {d:"M " + a.x + " " + a.y + " Q " + cx + " " + cy + " " + b.x + " " + b.y, mx:cx, my:cy};
  }

  function trimToRadius(from, to, r){
    var dx = to.x - from.x, dy = to.y - from.y;
    var len = Math.sqrt(dx*dx + dy*dy) || 1;
    return { x: to.x - (dx/len) * r, y: to.y - (dy/len) * r };
  }

  var NS = "http://www.w3.org/2000/svg";
  function el(tag, attrs){
    var e = document.createElementNS(NS, tag);
    for(var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  function catVisible(cat){
    var regionOk = activeRegion === "all" || REGIONS[activeRegion].cats.indexOf(cat) !== -1;
    var filterOk = activeFilter === "all" || activeFilter === cat;
    return regionOk && filterOk;
  }

  function renderLaneLabels(){
    svgLaneLabels.innerHTML = "";
    Object.keys(LANES).forEach(function(cat){
      var visible = catVisible(cat);
      var t = el("text", {
        class: "lane-label" + (visible ? "" : " dim"),
        x: LANES[cat], y: 40
      });
      t.textContent = CATS[cat].label;
      svgLaneLabels.appendChild(t);
    });
  }

  function renderGraph(){
    svgNodes.innerHTML = "";
    svgEdges.innerHTML = "";
    renderLaneLabels();

    var neighbors = selected ? neighborsOf(selected) : {};

    EDGES.forEach(function(e){
      var a = DATA[e.from].pos, b = DATA[e.to].pos;
      var trimmedB = trimToRadius(a, b, DATA[e.to].featured ? 34 : 29);
      var trimmedA = trimToRadius(b, a, DATA[e.from].featured ? 34 : 29);
      var pathInfo = edgePath(trimmedA, trimmedB);

      var isActive = selected && (e.from === selected || e.to === selected);
      var visible = catVisible(DATA[e.from].cat) || catVisible(DATA[e.to].cat);
      var dim = selected ? !isActive : false;

      var path = el("path", {
        class: "edge" + (isActive ? " active" : "") + ((dim || !visible) ? " dim" : ""),
        d: pathInfo.d,
        "marker-end": isActive ? "url(#arrow-active)" : "url(#arrow)"
      });
      svgEdges.appendChild(path);

      var label = el("text", {
        class: "edge-label" + (isActive ? " active" : "") + ((dim || !visible) ? " dim" : ""),
        x: pathInfo.mx, y: pathInfo.my
      });
      label.textContent = e.type;
      svgEdges.appendChild(label);
    });

    Object.keys(DATA).forEach(function(id){
      var d = DATA[id];
      var visible = catVisible(d.cat);
      var isSelected = selected === id;
      var isNeighbor = selected && neighbors[id];
      var dim = selected ? !(isSelected || isNeighbor) : false;

      var g = el("g", {
        class: "node" +
          (d.featured ? " featured" : "") +
          (isSelected ? " selected" : "") +
          (isNeighbor ? " neighbor" : "") +
          ((dim || !visible) ? " dim" : ""),
        transform: "translate(" + d.pos.x + "," + d.pos.y + ")"
      });
      var r = d.featured ? 34 : 29;
      g.appendChild(el("circle", {class:"core", r:r}));
      var nameNode = el("text", {class:"name", y:5, "font-size": d.featured ? 13.5 : 12.5});
      nameNode.textContent = d.name.length > 7 ? d.name.slice(0,6) + "…" : d.name;
      g.appendChild(nameNode);
      var eraNode = el("text", {class:"era", y: r + 15});
      eraNode.textContent = d.era.split(" ")[0];
      g.appendChild(eraNode);

      g.addEventListener("click", function(){
        selected = id;
        renderGraph();
        renderArticle(id);
      });
      svgNodes.appendChild(g);
    });
  }

  function connLine(dirLabel, id, type){
    var row = document.createElement("div");
    row.className = "conn-row";
    var dir = document.createElement("span");
    dir.className = "conn-dir";
    dir.textContent = dirLabel;
    row.appendChild(dir);
    var btn = document.createElement("div");
    btn.className = "conn-btn";
    btn.innerHTML = DATA[id].name + " <span class=\"conn-tag\">" + type + "</span>";
    btn.addEventListener("click", function(){
      selected = id;
      renderGraph();
      renderArticle(id);
      readingEl.scrollTop = 0;
    });
    row.appendChild(btn);
    return row;
  }

    nSec.appendChild(noteWrap);
    art.appendChild(nSec);

    readingEl.appendChild(art);
  }

  function renderIntro(){
    readingEl.innerHTML = "";
    var intro = document.createElement("div");
    intro.className = "intro";
    intro.innerHTML =
      '<h2>思想は、暗記するものではなく、' +
      '<br>自分の判断に借りる道具である。</h2>' +
      '<p>左の図は、29人の思想家たちが互いに何を受け継ぎ、何を批判し、何を統合してきたかを示す系譜図です。' +
      'テーマで絞り込み、気になる名前をクリックすると、その人物が何に悩み、何を考え、それが今の仕事や人間関係にどう活きるのかを読むことができます。' +
      '<br><br>正解を覚える場所ではありません。自分の頭で考えるための補助線を、ここから持ち帰ってください。</p>';
    readingEl.appendChild(intro);
  }

  /* ---------- theme mode ---------- */

  function renderThemeList(){
    themeViewEl.innerHTML = "";

    var intro = document.createElement("div");
    intro.className = "theme-intro";
    intro.textContent = "幸福、愛、自由——人が生きるうえで避けて通れない大きな問いを、複数の思想家の視点を重ねながら読むコーナーです。気になるテーマを選んでください。";
    themeViewEl.appendChild(intro);

    var grid = document.createElement("div");
    grid.className = "theme-grid";
    THEME_ORDER.forEach(function(tid){
      var t = THEMES[tid];
      var card = document.createElement("div");
      card.className = "theme-card" + (selectedTheme === tid ? " active" : "");
      var whoNames = t.who.map(function(id){ return DATA[id].name; }).join(" / ");
      card.innerHTML =
        '<div class="theme-card-title">' + t.title + '</div>' +
        '<div class="theme-card-teaser">' + t.teaser + '</div>' +
        '<div class="theme-card-who"><span>視点: </span>' + whoNames + '</div>';
      card.addEventListener("click", function(){
        selectedTheme = tid;
        renderThemeList();
        renderThemeArticle(tid);
        readingEl.scrollTop = 0;
      });
      grid.appendChild(card);
    });
    themeViewEl.appendChild(grid);
  }

  function renderThemeIntro(){
    readingEl.innerHTML = "";
    var intro = document.createElement("div");
    intro.className = "intro";
    intro.innerHTML =
      '<h2>幸福も、愛も、自由も、' +
      '<br>一人の哲学者だけでは語り尽くせない。</h2>' +
      '<p>ここでは思想家一人ひとりからではなく、「幸福とは」「愛とは」といった大きな問いから出発します。' +
      '複数の思想家の答えを並べて読むことで、一つの正解ではなく、問いそのものの奥行きが見えてきます。' +
      '<br><br>左のテーマを選んでください。文中の思想家名をクリックすると、その人物の系譜ページに直接ジャンプできます。</p>';
    readingEl.appendChild(intro);
  }

  function renderThemeTimeline(t){
    var wrap = document.createElement("div");
    wrap.className = "timeline-wrap";

    var n = t.chrono.length;
    var width = Math.max(520, n * 170);
    var height = 118;
    var margin = 66;
    var spacing = n > 1 ? (width - margin * 2) / (n - 1) : 0;
    var cy = 56;
    var r = 26;

    var svg = document.createElementNS(NS, "svg");
    svg.setAttribute("viewBox", "0 0 " + width + " " + height);
    svg.setAttribute("preserveAspectRatio", "xMidYMid meet");

    var positions = t.chrono.map(function(id, i){ return {id:id, x: margin + spacing * i}; });

    positions.forEach(function(pos, i){
      if(i === 0) return;
      var prev = positions[i - 1];
      var x1 = prev.x + r, x2 = pos.x - r;
      var line = el("line", {class:"timeline-edge", x1:x1, y1:cy, x2:x2, y2:cy, "marker-end":"url(#arrow)"});
      svg.appendChild(line);
      var cap = el("text", {class:"timeline-cap", x:(x1 + x2) / 2, y: cy - 16});
      cap.textContent = t.transitions[i - 1];
      svg.appendChild(cap);
    });

    positions.forEach(function(pos){
      var d = DATA[pos.id];
      var g = el("g", {class:"timeline-node", transform:"translate(" + pos.x + "," + cy + ")"});
      g.appendChild(el("circle", {r:r}));
      var nameNode = el("text", {class:"tname", y:5});
      nameNode.textContent = d.name.length > 7 ? d.name.slice(0,6) + "…" : d.name;
      g.appendChild(nameNode);
      var eraNode = el("text", {class:"tera", y: r + 14});
      eraNode.textContent = d.era.split(" ")[0];
      g.appendChild(eraNode);
      g.addEventListener("click", function(){ selectThinkerFromTheme(pos.id); });
      svg.appendChild(g);
    });

    wrap.appendChild(svg);
    return wrap;
  }

  function renderThemeArticle(themeId){
    var t = THEMES[themeId];
    readingEl.innerHTML = "";

    var art = document.createElement("div");
    art.className = "article";

    var eyebrow = document.createElement("div");
    eyebrow.className = "art-eyebrow";
    eyebrow.textContent = "テーマで読む";
    art.appendChild(eyebrow);

    var name = document.createElement("div");
    name.className = "art-name";
    name.textContent = t.title;
    art.appendChild(name);

    var one = document.createElement("div");
    one.className = "art-oneliner";
    one.textContent = t.lead;
    art.appendChild(one);

    var tlSec = document.createElement("div");
    tlSec.className = "section";
    tlSec.innerHTML = '<div class="section-title">どう受け継がれていったか</div>';
    tlSec.appendChild(renderThemeTimeline(t));
    art.appendChild(tlSec);

    var pSec = document.createElement("div");
    pSec.className = "section";
    pSec.innerHTML = '<div class="section-title">思想家たちの視点</div>';
    t.perspectives.forEach(function(p){
      var d = DATA[p.id];
      var box = document.createElement("div");
      box.className = "perspective";
      var who = document.createElement("button");
      who.className = "perspective-who";
      who.textContent = d.name + "（" + d.era.split(" ")[0] + "）";
      who.addEventListener("click", function(){
        selectThinkerFromTheme(p.id);
      });
      box.appendChild(who);
      var stance = document.createElement("div");
      stance.className = "perspective-stance";
      stance.textContent = p.stance;
      box.appendChild(stance);
      var text = document.createElement("div");
      text.className = "perspective-text";
      text.textContent = p.text;
      box.appendChild(text);
      pSec.appendChild(box);
    });
    art.appendChild(pSec);

    var cSec = document.createElement("div");
    cSec.className = "section";
    cSec.innerHTML = '<div class="section-title">持ち帰りたい一つの視点</div>';
    var closing = document.createElement("div");
    closing.className = "theme-closing";
    closing.textContent = t.closing;
    cSec.appendChild(closing);
    art.appendChild(cSec);

    readingEl.appendChild(art);
  }

  function selectThinkerFromTheme(id){
    setMode("graph");
    selected = id;
    renderGraph();
    renderArticle(id);
    readingEl.scrollTop = 0;
  }

  /* ---------- mode switching ---------- */

  function setMode(m){
    mode = m;
    Array.prototype.forEach.call(modeSwitchEl.querySelectorAll(".mode-btn"), function(btn){
      btn.classList.toggle("active", btn.dataset.mode === m);
    });
    if(m === "theme"){
      graphViewEl.classList.add("hidden");
      themeViewEl.classList.remove("hidden");
      renderThemeList();
      if(selectedTheme){ renderThemeArticle(selectedTheme); } else { renderThemeIntro(); }
    } else {
      themeViewEl.classList.add("hidden");
      graphViewEl.classList.remove("hidden");
      renderGraph();
      if(selected){ renderArticle(selected); } else { renderIntro(); }
    }
  }

  Array.prototype.forEach.call(modeSwitchEl.querySelectorAll(".mode-btn"), function(btn){
    btn.addEventListener("click", function(){ setMode(btn.dataset.mode); });
  });

  renderRegionFilters();
  renderFilters();
  renderGraph();
  renderIntro();
  setMode("graph");

})();
</script>
