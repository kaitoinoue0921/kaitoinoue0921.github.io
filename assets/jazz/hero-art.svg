<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560">
  <defs>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7c088"/>
      <stop offset="1" stop-color="#b4763a"/>
    </linearGradient>
    <linearGradient id="cym" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6ecda"/>
      <stop offset=".55" stop-color="#e6cfa6"/>
      <stop offset="1" stop-color="#c99a5c"/>
    </linearGradient>
  </defs>

  <!-- 月のような真鍮の円 -->
  <circle cx="340" cy="250" r="205" fill="url(#moon)"/>
  <circle cx="340" cy="250" r="232" fill="none" stroke="#d6a866" stroke-opacity=".35" stroke-width="1.5"/>

  <!-- ライド・シンバル -->
  <line x1="488" y1="132" x2="470" y2="560" stroke="#f3e9d8" stroke-opacity=".75" stroke-width="3"/>
  <g transform="translate(488 128) rotate(-14)">
    <ellipse rx="128" ry="22" fill="url(#cym)"/>
    <ellipse rx="96" ry="16" fill="none" stroke="#b4813f" stroke-opacity=".45"/>
    <ellipse rx="64" ry="11" fill="none" stroke="#b4813f" stroke-opacity=".45"/>
    <ellipse cy="-3" rx="22" ry="8" fill="#d9b27a"/>
  </g>

  <!-- コントラバスのシルエット -->
  <g transform="translate(232 18) rotate(-7 110 330) scale(.82)">
    <g fill="#0e1a2c">
      <circle cx="110" cy="30" r="16"/>
      <path d="M99 42 L97 116 L123 116 L121 42 Z"/>
      <path d="M100 112 L95 330 L125 330 L120 112 Z"/>
      <path d="M110 288 C68 288 40 304 38 344 C36 380 62 398 64 414 C66 430 40 446 26 476 C9 514 14 572 42 602 C64 626 92 634 110 634 C128 634 156 626 178 602 C206 572 211 514 194 476 C180 446 154 430 156 414 C158 398 184 380 182 344 C180 304 152 288 110 288 Z"/>
      <rect x="107" y="630" width="6" height="34" rx="3"/>
    </g>
    <g fill="none" stroke="#d6a866" stroke-linecap="round">
      <path d="M98 62 h-14 M98 84 h-14 M122 62 h14 M122 84 h14" stroke-width="5"/>
      <path d="M80 384 C68 404 94 424 82 452 M140 384 C152 404 126 424 138 452" stroke-width="2.6"/>
      <path d="M88 470 L132 470" stroke-width="3"/>
      <path d="M105 50 L104 515 M108.5 50 L108.5 515 M111.5 50 L111.5 515 M115 50 L116 515" stroke-width="1" stroke-opacity=".85"/>
      <path d="M100 515 L120 515 L116 598 L104 598 Z" stroke-width="2"/>
      <path d="M58 360 C48 420 50 520 70 580" stroke="#f3e9d8" stroke-opacity=".18" stroke-width="5"/>
    </g>
  </g>

  <!-- スイングの「長・短」 -->
  <g fill="#f3e9d8">
    <rect x="40"  y="508" width="44" height="9" rx="4.5"/>
    <rect x="90"  y="508" width="20" height="9" rx="4.5" fill-opacity=".55"/>
    <rect x="118" y="508" width="44" height="9" rx="4.5"/>
    <rect x="168" y="508" width="20" height="9" rx="4.5" fill-opacity=".55"/>
    <rect x="196" y="508" width="44" height="9" rx="4.5"/>
    <rect x="246" y="508" width="20" height="9" rx="4.5" fill-opacity=".55"/>
  </g>
</svg>
